egister and issue a Certificate of Registration and Professional Identification Card to any successful examinee of unsound mind."},{"label":"D","text":"The BOA may, after the expiration of three (3) years from the date of revocation of a Certificate of Registration, reinstate the validity of a revoked Certificate of Registration."}],"ans":"C","explanation":"The BOA shall not register any examinee convicted of moral turpitude or of unsound mind."},{"id":"AT10014_Q17","n":17,"stem":"Which of the following statements concerning ownership of working papers is incorrect?","opts":[{"label":"A","text":"All working papers made by a CPA and his/her staff in the course of an examination remain the property of such CPA in the absence of a written agreement between the CPA and the client to the contrary."},{"label":"B","text":"Working papers include schedules and memoranda prepared and submitted by the client of the CPA."},{"label":"C","text":"Working papers include reports submitted by a CPA to his/her client."},{"label":"D","text":"Working papers shall be treated confidential and privileged unless such documents are required to be produced through subpoena issued by any court, tribunal, or government regulatory or administrative body."}],"ans":"C","explanation":"Final audit reports delivered to the client are the property of the client, not part of working papers retained by CPA."},{"id":"AT10014_Q18","n":18,"stem":"Any person who shall violate any of the provisions of the Accountancy Act or any of its implementing rules and regulations promulgated by the Board of Accountancy subject to the approval of the PRC, shall, upon conviction, be punished by","opts":[{"label":"A","text":"A fine of not more than P50,000."},{"label":"B","text":"Imprisonment for a period not exceeding two years."},{"label":"C","text":"A fine of not less than P50,000 or by imprisonment for a period not exceeding two years or both."},{"label":"D","text":"Lethal injection."}],"ans":"C","explanation":"Penal sanctions under Sec. 36 are fine of not less than P50,000 or imprisonment not exceeding 2 years, or both."},{"id":"AT10014_Q19","n":19,"stem":"The Board of Accountancy may reinstate the validity of a revoked Certificate of Registration after the expiration of how many years from the date of revocation?","opts":[{"label":"A","text":"5"},{"label":"B","text":"3"},{"label":"C","text":"2"},{"label":"D","text":"1"}],"ans":"C","explanation":"Under Sec. 25, the Board may reinstate a revoked certificate after 2 years."},{"id":"AT10014_Q20","n":20,"stem":"All registered CPAs shall obtain and use a seal which shall be circular in form with a smaller circle within bearing the registrant’s name, registration number and title. Which of the following is correct?","opts":[{"label":"A","text":"Engraved in the lower portion of the space between the circles is the CPA’s name."},{"label":"B","text":"Engraved in the middle of the smaller circle are the letters “CPA”."},{"label":"C","text":"Engraved in the middle of the smaller circle are the CPA’s name and registration number."},{"label":"D","text":"Engraved in the middle of the smaller circle is the CPA’s name."}],"ans":"B","explanation":"The letters \"CPA\" are engraved in the middle of the smaller circle."},{"id":"AT10014_Q21","n":21,"stem":"Which of the following statements concerning the use of firm or partnership name is incorrect?","opts":[{"label":"A","text":"In the case of an individual CPA, he/she shall do business under his/her registered name with the BOA and the PRC and as printed in his/her CPA certificate (for example, Juan Puruntong, CPA)."},{"label":"B","text":"In the case of a firm, it shall do business under its duly registered and authorized firm name appearing in the registration documents issued by the Department of Trade and Industry (DTI) and other government offices and such firm name shall include the real name of the sole proprietor as printed in his/her CPA certificate (for example, Arnulfo Gumamela and Associates)."},{"label":"C","text":"In the case of a registered partnership, it shall do business under its name as indicated in its current Articles of Partnership and Certificate of Registration issued by the Securities and Exchange Commission (SEC) (for example, Tanya, Sam, and Jervi, CPAs)."},{"label":"D","text":"A CPA shall practice only under an individual, firm, or partnership name in accordance with Philippine laws and shall not include any fictitious name but may indicate specialization."}],"ans":"D","explanation":"A CPA name cannot include fictitious names NOR indicate specialization."},{"id":"AT10014_Q22","n":22,"stem":"A partner surviving the death or withdrawal of all the other partners in a partnership may continue to practice under the partnership name for a period of not more than _____ years after becoming a sole proprietor.","opts":[{"label":"A","text":"4"},{"label":"B","text":"3"},{"label":"C","text":"2"},{"label":"D","text":"1"}],"ans":"C","explanation":"The surviving partner may continue under the partnership name for not more than 2 years."},{"id":"AT10014_Q23","n":23,"stem":"The death or disability of an individual CPA and/or the dissolution and liquidation of a firm or partnership of CPAs shall be reported to the BOA not later than _____ days from the date of such death, dissolution or liquidation.","opts":[{"label":"A","text":"90"},{"label":"B","text":"60"},{"label":"C","text":"30"},{"label":"D","text":"15"}],"ans":"C","explanation":"Must be reported to the BOA within 30 days."},{"id":"AT10014_Q24","n":24,"stem":"Which of the following statements concerning a CPA’s disclosure of confidential client information is ordinarily correct?","opts":[{"label":"A","text":"Disclosure may be made to any party on consent of the client."},{"label":"B","text":"Disclosure should not be made even if such disclosure will protect the CPA’s professional interests in legal proceedings."},{"label":"C","text":"Disclosure should be made only if there is a legal or professional duty to make the disclosure."},{"label":"D","text":"Disclosure may be made to any government agency without subpoena."}],"ans":"A","explanation":"Confidential client information may be disclosed with the specific consent of the client."},{"id":"AT10014_Q25","n":25,"stem":"Listed below are names of four CPA firms and pertinent facts relative to each firm. Unless otherwise indicated, the individuals named are CPAs and partners, and there are no other partners. Which is a violation of the Implementing Rules and Regulations of RA 9298?","opts":[{"label":"A","text":"Tin, Ton and Tan, CPAs (Tin died about five years ago; Ton and Tan are continuing the firm.)"},{"label":"B","text":"Pol and Bon, CPAs (The name of Cua, a third partner, is omitted from the partnership name.)"},{"label":"C","text":"Joni and Jona, CPAs (Joni died about three years ago; Jona is continuing the firm as a sole proprietor.)"},{"label":"D","text":"Elias and Co., CPAs (The firm has ten other partners who are all CPAs)."}],"ans":"C","explanation":"A surviving sole proprietor may continue using the partnership name for not more than 2 years. Joni died 3 years ago, which is a violation."},{"id":"AT10014_Q26","n":26,"stem":"The following statements relate to some of the provisions of RA 9298. Which is correct?","opts":[{"label":"A","text":"Audit working papers are generally the property of the company whose financial statements were audited."},{"label":"B","text":"After three (3) years, subject to certain conditions, the Board of Accountancy may order the reinstatement of a CPA whose certificate of registration has been revoked."},{"label":"C","text":"The penal provision (Sec. 36) of RA 9298 applies only to the violation of any of the provisions of RA 9298 because its Implementing Rules and Regulations are unenforceable."},{"label":"D","text":"It shall be the primary duty of the PRC and the BOA to effectively enforce the provisions of RA 9298."}],"ans":"D","explanation":"Enforcement of RA 9298 is the primary statutory duty of the PRC and the BOA."}]},{"id":"AT-10015","code":"AT-10015","title":"Code of Ethics for Professional Accountants in the Philippines","standards":"Philippine Code of Ethics (Parts 1, 2, 3, 4A, 4B)","questionCount":55,"summary":"Structure of the Code, Fundamental Principles (Integrity, Objectivity, Professional Competence & Due Care, Confidentiality, Professional Behavior), Conceptual Framework (Identify, Evaluate, Address Threats), Five Threats (Self-Interest, Self-Review, Advocacy, Familiarity, Intimidation), Safeguards, Independence of Mind and Appearance, Long Association / Partner Rotation (7-year time-on, 5-year cooling off for Engagement Partner), and Specific Ethical Situations.","lectureOutline":"### CODE OF ETHICS FOR PROFESSIONAL ACCOUNTANTS IN THE PHILIPPINES\n\n#### Structure of the Code\n- **Part 1:** Complying with the Code, Fundamental Principles and Conceptual Framework (All Professional Accountants)\n- **Part 2:** Professional Accountants in Business (PAIBs) - also applies to PAPPs performing firm duties\n- **Part 3:** Professional Accountants in Public Practice (PAPPs)\n- **Part 4:** International Independence Standards:\n  - *Part 4A:* Independence for Audit and Review Engagements\n  - *Part 4B:* Independence for Assurance Engagements Other than Audit and Review\n\n---\n\n### FUNDAMENTAL PRINCIPLES\n1. **Integrity:** Straightforward and honest in all professional and business relationships.\n2. **Objectivity:** Not compromising professional or business judgment because of bias, conflict of interest, or undue influence.\n3. **Professional Competence and Due Care:** Attain and maintain professional knowledge and skill; act diligently.\n4. **Confidentiality:** Respect confidentiality of information acquired; do not disclose without proper authority, nor use for personal advantage. Continues even after end of relationship.\n5. **Professional Behavior:** Comply with laws/regulations; avoid any conduct that might discredit the profession.\n\n---\n\n### CONCEPTUAL FRAMEWORK APPROACH\nThree-Step Approach:\n1. **Identify** threats to compliance with fundamental principles.\n2. **Evaluate** the threats identified (whether at an acceptable level).\n3. **Address** the threats by eliminating them, applying safeguards, or declining/terminating the engagement.\n\n#### Five Categories of Threats\n- **Self-Interest Threat:** Financial or other interest inappropriately influencing judgment (e.g. direct financial interest, contingent fees, undue dependence on fees).\n- **Self-Review Threat:** Inappropriately evaluating previous judgments/services on which the accountant will rely (e.g. bookkeeping/accounting entries for audit client, IT design).\n- **Advocacy Threat:** Promoting a client’s position to the point objectivity is compromised (e.g. promoting client shares, legal advocacy).\n- **Familiarity Threat:** Long or close relationship leading to being too sympathetic (e.g. immediate family member as client officer, long association).\n- **Intimidation Threat:** Deterred from acting objectively due to actual or perceived pressures (e.g. threatened with dismissal, litigation).\n\n---\n\n### INDEPENDENCE & ROTATION (TIME-ON AND COOLING-OFF)\nFor audit of Public Interest Entities (PIEs):\n- **Maximum Time-on Period:** 7 cumulative years.\n- **Cooling-off Periods:**\n  - *Engagement Partner:* **5 consecutive years**\n  - *Engagement Quality Control Reviewer:* **3 consecutive years**\n  - *Other Key Audit Partners:* **2 consecutive years**","items":[{"id":"AT10015_Q1","n":1,"stem":"The Code of Ethics for Professional Accountants in the Philippines is approved by ______ recommended for adoption by the _____.","opts":[{"label":"A","text":"BOA, PICPA"},{"label":"B","text":"SEC, BOA"},{"label":"C","text":"BOA, President of the Philippines"},{"label":"D","text":"PICPA, BOA"}],"ans":"D","explanation":"The Code of Ethics is prepared and approved by PICPA and recommended for adoption to the BOA/PRC."},{"id":"AT10015_Q2","n":2,"stem":"Which of the following statements best explains why the CPA profession has found it essential to establish ethical standards and means for ensuring their observance?","opts":[{"label":"A","text":"Vigorous enforcement of an established code of ethics is the best way to prevent unscrupulous acts."},{"label":"B","text":"Ethical standards that emphasize excellence in performance over material rewards establish a reputation for competence and character."},{"label":"C","text":"A distinguishing mark of a profession is its acceptance of responsibility to the public."},{"label":"D","text":"A requirement for a profession is to establish ethical standards that stress primarily a responsibility to clients and colleagues."}],"ans":"C","explanation":"A distinguishing mark of the accountancy profession is its acceptance of the responsibility to act in the public interest."},{"id":"AT10015_Q3","n":3,"stem":"The underlying reason for a code of professional conduct for any profession is","opts":[{"label":"A","text":"That it is required by congress"},{"label":"B","text":"The need for public confidence in the quality of the service of the profession"},{"label":"C","text":"That it provides a safeguard to keep unscrupulous people out"},{"label":"D","text":"That it allows professional regulation commission to have a yardstick to measure deficient performance"}],"ans":"B","explanation":"A code of ethics establishes public trust and confidence in the quality and integrity of professional services."},{"id":"AT10015_Q4","n":4,"stem":"How did the Code of Ethics define public interest?","opts":[{"label":"A","text":"A distinguishing mark of a profession is acceptance of its responsibility to the public."},{"label":"B","text":"The accountancy profession's public consists of clients, credit grantors, governments, employers, employees, investors, the business and financial community, and others who rely on the objectivity and integrity of professional accountants."},{"label":"C","text":"The collective well-being of the community of people and institutions the professional accountant serves."},{"label":"D","text":"The standards of the accountancy profession are heavily determined by the public interest."}],"ans":"C","explanation":"Public interest is defined as the collective well-being of the community of people and institutions served."},{"id":"AT10015_Q5","n":5,"stem":"Which statement is incorrect regarding the Code of Ethics for Professional Accountants in the Philippines?","opts":[{"label":"A","text":"The objectives as well as the fundamental principles are of a general nature and are not intended to be used to solve a professional accountant’s ethical problems in a specific case."},{"label":"B","text":"The code is divided into three parts; parts A B and C."},{"label":"C","text":"Part 1 applies to all professional accountants."},{"label":"D","text":"Part 3 applies only to those professional accountants in public practice."}],"ans":"B","explanation":"Under the revised restructured Code, the Code is structured into Parts 1, 2, 3, 4A, and 4B (not simply Parts A, B, and C)."},{"id":"AT10015_Q6","n":6,"stem":"Which of the following statements is incorrect?","opts":[{"label":"A","text":"Part 1 which includes the fundamental principles and the conceptual framework is applicable to all professional accountants."},{"label":"B","text":"Part 2 sets out additional material that applies to professional accountants in business when performing professional activities."},{"label":"C","text":"Part 2 shall not apply to individuals who are professional accountants in public practice when performing professional activities pursuant to their relationship with the firm, whether as a contractor, employee or owner."},{"label":"D","text":"Part 3 sets out additional material that applies to professional accountants in public practice when providing professional services."}],"ans":"C","explanation":"Part 2 DOES apply to PAPPs when performing internal firm activities (as employee, contractor, or owner)."},{"id":"AT10015_Q7","n":7,"stem":"Which of the following fundamental ethical principles requires a professional accountant to be straightforward and honest in all professional and business relationships?","opts":[{"label":"A","text":"Integrity"},{"label":"B","text":"Objectivity"},{"label":"C","text":"Professional behavior"},{"label":"D","text":"Professional competence and due care"}],"ans":"A","explanation":"Integrity requires being straightforward and honest in all professional and business relationships."},{"id":"AT10015_Q8","n":8,"stem":"Which of the following statements is incorrect?\nI. Statement 1: The Code requires professional accountants to comply with the fundamental principles of ethics.\nII. Statement 2: The Code also requires them to apply the conceptual framework to identify, evaluate and address threats to compliance with the fundamental principles.\nIII. Statement 3: Applying the conceptual framework requires exercising professional judgment, remaining alert for new information and to changes in facts and circumstances, and using the reasonable and informed third party test.","opts":[{"label":"A","text":"Only one statement is correct"},{"label":"B","text":"Only two statements are correct"},{"label":"C","text":"All statements are correct"},{"label":"D","text":"All statements are incorrect"}],"ans":"C","explanation":"All three statements accurately state the core requirements of the Code."},{"id":"AT10015_Q9","n":9,"stem":"In order to achieve the objectives of the accountancy profession, professional accountants have to observe a number of prerequisites or fundamental principles. The fundamental principles include the following, except","opts":[{"label":"A","text":"Objectivity"},{"label":"B","text":"Professional Competence and Due Care"},{"label":"C","text":"Professional Behavior"},{"label":"D","text":"Confidence"}],"ans":"D","explanation":"\"Confidence\" is not one of the 5 fundamental ethical principles."},{"id":"AT10015_Q10","n":10,"stem":"A professional accountant shall not knowingly be associated with reports, returns, communications or other information where the accountant believes that the information (select the exception):","opts":[{"label":"A","text":"Contains statements that are truthfully presented"},{"label":"B","text":"Contains a materially false or misleading statement"},{"label":"C","text":"Contains statements or information provided recklessly"},{"label":"D","text":"Omits or obscures required information where such omission or obscurity would be misleading"}],"ans":"A","explanation":"An accountant CAN be associated with information that is truthfully presented; B, C, and D are prohibited associations."},{"id":"AT10015_Q11","n":11,"stem":"Which of the following fundamental ethical principles requires a professional accountant to act diligently and in accordance with applicable technical and professional standards?","opts":[{"label":"A","text":"Objectivity"},{"label":"B","text":"Professional behavior"},{"label":"C","text":"Professional competence and due care"},{"label":"D","text":"Integrity"}],"ans":"C","explanation":"Professional competence and due care requires acting diligently in accordance with standards."},{"id":"AT10015_Q12","n":12,"stem":"Which of the following is incorrect regarding confidentiality?","opts":[{"label":"A","text":"Professional accountants have an obligation to respect the confidentiality of information about a client’s or employer’s affairs acquired in the course of professional services."},{"label":"B","text":"The duty of confidentiality ceases after the end of the relationship between the professional accountant and the client or employer."},{"label":"C","text":"Confidentiality should always be observed by a professional accountant unless specific authority has been given to disclose information or there is a legal or professional duty to disclose."},{"label":"D","text":"Confidentiality requires that a professional accountant acquiring information in the course of performing professional services neither uses nor appear to use that information for personal advantage or for the advantage of a third party."}],"ans":"B","explanation":"The duty of confidentiality continues even after the end of the professional relationship."},{"id":"AT10015_Q13","n":13,"stem":"In compliance with professional behavior, when undertaking marketing or promotional activities, a professional accountant shall not bring the profession into disrepute. A professional accountant shall be honest and truthful and shall not make:\nI. Exaggerated claims for the services offered by, or the qualifications or experience of, the accountant;\nII. Disparaging references or unsubstantiated comparisons to the work of others","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"Both exaggerated claims and disparaging comparisons are strictly prohibited under Professional Behavior."},{"id":"AT10015_Q14","n":14,"stem":"Which of the following is not among the specified procedures in the conceptual framework in Part 1 of the Code of Ethics for Professional Accountants?","opts":[{"label":"A","text":"Identify threats to compliance with the fundamental principles"},{"label":"B","text":"Evaluate the threats identified"},{"label":"C","text":"Use the third-party test"},{"label":"D","text":"Address the threats by eliminating or reducing them to an acceptable level"}],"ans":"C","explanation":"The three-step conceptual framework is Identify, Evaluate, and Address. The third-party test is a tool, not one of the main three steps."},{"id":"AT10015_Q15","n":15,"stem":"The professional accountant should be constantly conscious of and be alert to factors that give rise to conflicts of interest. When faced with significant ethical issues such as identifying unethical behavior or resolving an ethical conflict, the professional accountant should do the following, except","opts":[{"label":"A","text":"follow the established policies of the employing organization to seek a resolution of such conflict."},{"label":"B","text":"review the conflict problem with the immediate superior if the organization’s policies do not resolve the ethical conflict."},{"label":"C","text":"seek advice on a confidential basis with an independent advisor or the applicable professional accountancy body or regulatory body to obtain an understanding of possible courses of action."},{"label":"D","text":"report the matter to the Securities and Exchange Commission."}],"ans":"D","explanation":"Reporting internal employer conflicts directly to the SEC breaches client confidentiality unless an external duty to report exists."},{"id":"AT10015_Q16","n":16,"stem":"Which of the following will not create self-interest threat for a professional accountant in public practice?","opts":[{"label":"A","text":"The possibility of losing a significant client."},{"label":"B","text":"Direct financial interest in the assurance client."},{"label":"C","text":"Undue dependence on total fees from a client."},{"label":"D","text":"Preparing the original data used to generate records that are the subject matter of the assurance engagement."}],"ans":"D","explanation":"Preparing original data creates a self-review threat, not a self-interest threat."},{"id":"AT10015_Q17","n":17,"stem":"Familiarity threat could be created under the following circumstances except","opts":[{"label":"A","text":"A professional accountant accepting gifts from a client whose value is inconsequential or trivial."},{"label":"B","text":"Senior personnel having a long association with the assurance client."},{"label":"C","text":"A director or officer of the client or an employee in a position to exert significant influence over the subject matter of the engagement having recently served as the engagement partner."},{"label":"D","text":"A member of the engagement team having a close or immediate family member who is a director or officer of the client."}],"ans":"A","explanation":"Accepting gifts that are trivial and inconsequential does not create a significant familiarity threat."},{"id":"AT10015_Q18","n":18,"stem":"This threat to independence occurs when a member of the assurance team has recently performed services for an assurance client that directly affect the subject matter information of the assurance engagement (e.g., valuation services).","opts":[{"label":"A","text":"Self-review threat."},{"label":"B","text":"Advocacy threat."},{"label":"C","text":"Self-interest threat."},{"label":"D","text":"Familiarity threat."}],"ans":"A","explanation":"Auditing one's own prior work/calculations creates a self-review threat."},{"id":"AT10015_Q19","n":19,"stem":"If requested to perform a review engagement for an entity in which a practitioner has an immaterial direct financial interest, the accountant is","opts":[{"label":"A","text":"independent because the financial interest is immaterial and, therefore, may issue a review report."},{"label":"B","text":"not independent and, therefore, may not be associated with the financial statements."},{"label":"C","text":"not independent and, therefore, may not issue a review report."},{"label":"D","text":"not independent and, therefore, may issue a review report, but may not issue an auditor’s opinion."}],"ans":"C","explanation":"ANY direct financial interest (material or immaterial) impairs independence, prohibiting both audits and reviews."},{"id":"AT10015_Q20","n":20,"stem":"The threat that a professional accountant will be deterred from acting objectively because of actual or perceived pressures from the client is known as","opts":[{"label":"A","text":"Intimidation threat."},{"label":"B","text":"Familiarity threat."},{"label":"C","text":"Self-interest threat."},{"label":"D","text":"Advocacy threat."}],"ans":"A","explanation":"Pressure deterring objective action is an intimidation threat."},{"id":"AT10015_Q21","n":21,"stem":"The following circumstances may create intimidation threats, except","opts":[{"label":"A","text":"Being threatened with dismissal or replacement in related to a client engagement."},{"label":"B","text":"Being pressured to reduce inappropriately the extent of work performed in order to reduce fees."},{"label":"C","text":"Being threatened with litigation."},{"label":"D","text":"A member of the assurance team being, or having recently been, a director or officer of the client."}],"ans":"D","explanation":"A team member being an officer of the client creates a self-review/familiarity threat, not an intimidation threat."},{"id":"AT10015_Q22","n":22,"stem":"The following circumstances may create self-interest threat, except","opts":[{"label":"A","text":"A professional accountant holding a financial interest in, or receiving a loan or guarantee from, the employing organization."},{"label":"B","text":"A professional accountant participating in incentive compensation arrangements offered by the employing organization."},{"label":"C","text":"A professional accountant having access to corporate assets for personal use."},{"label":"D","text":"A professional accountant determining the appropriate accounting treatment for a business combination after performing the feasibility study supporting the purchase decision."}],"ans":"D","explanation":"Evaluating one's own prior feasibility study creates a self-review threat."},{"id":"AT10015_Q23","n":23,"stem":"Which of the following circumstances creates familiarity threat?","opts":[{"label":"A","text":"A professional accountant having access to confidential information that might be used for personal gain."},{"label":"B","text":"A professional accountant having the opportunity to manipulate information in a prospectus in order to obtain favorable financing."},{"label":"C","text":"A professional accountant having a close or immediate family member who is a director or officer of the client."},{"label":"D","text":"A professional accountant or immediate or close family member facing the threat of dismissal or replacement over a disagreement about the way in which financial information is reported."}],"ans":"C","explanation":"Having immediate family members as client directors/officers creates a familiarity threat."},{"id":"AT10015_Q24","n":24,"stem":"The following circumstances create advocacy threats for a professional accountant in public practice except","opts":[{"label":"A","text":"Promoting shares in an audit client."},{"label":"B","text":"Acting as an advocate on behalf of an audit client in litigation or disputes with third parties."},{"label":"C","text":"Acting as campaign manager for the president of a client who is running for a public office."},{"label":"D","text":"A member of the assurance team having a significant close business relationship with an assurance client."}],"ans":"D","explanation":"A close business relationship creates a self-interest or familiarity threat, not an advocacy threat."},{"id":"AT10015_Q25","n":25,"stem":"Examples of facts and circumstances that may create self-interest threats for PAPPs when undertaking professional services are as follows (choose the exception):","opts":[{"label":"A","text":"Having a direct financial interest in a client"},{"label":"B","text":"Quoting a low fee to obtain a new engagement"},{"label":"C","text":"Having access to confidential information that might be used for personal gain"},{"label":"D","text":"Issuing an assurance report on the effectiveness of the operation of financial systems after implementing the systems"}],"ans":"D","explanation":"Auditing systems that the firm implemented creates a self-review threat."},{"id":"AT10015_Q26","n":26,"stem":"Which of the following circumstances creates self-review threat?","opts":[{"label":"A","text":"Having prepared the original data used to generate records that are the subject matter of the assurance engagement"},{"label":"B","text":"Promoting the interests of, or shares in, a client"},{"label":"C","text":"Acting as an advocate on behalf of a client in litigation or disputes with third parties"},{"label":"D","text":"Having a close or immediate family member who is a director or officer of the client"}],"ans":"A","explanation":"Preparing original data and then auditing it creates a self-review threat."},{"id":"AT10015_Q27","n":27,"stem":"Which of the following circumstances most likely creates advocacy threat?","opts":[{"label":"A","text":"A director or officer of the client or an employee in a position to exert significant influence over the subject matter of the engagement, having recently served as the engagement partner"},{"label":"B","text":"Lobbying in favor of legislation on behalf of a client"},{"label":"C","text":"An audit team member having a long association with the audit client"},{"label":"D","text":"Being threatened with dismissal from a client engagement or the firm because of a disagreement about a professional matter."}],"ans":"B","explanation":"Lobbying on behalf of a client promotes the client's position, creating an advocacy threat."},{"id":"AT10015_Q28","n":28,"stem":"Which of the following safeguards to eliminate or reduce threats to independence is provided by the profession, legislation or regulation?","opts":[{"label":"A","text":"Policies and procedures that emphasize the assurance client’s commitment to fair financial reporting."},{"label":"B","text":"Internal policies and procedures to implement compliance with firm policies and procedures as they relate to independence."},{"label":"C","text":"Continuing professional development requirements."},{"label":"D","text":"Rotation of senior personnel."}],"ans":"C","explanation":"Continuing professional development (CPD) is mandated by the profession and legislation."},{"id":"AT10015_Q29","n":29,"stem":"Which of the following is an example of engagement-specific safeguards in the work environment?","opts":[{"label":"A","text":"Advising partners and professional staff of those assurance clients and related entities from which they must be independent."},{"label":"B","text":"Disclosing to those charged with governance of the client the nature of service provided and extent of fees charged."},{"label":"C","text":"A disciplinary mechanism to promote compliance with the firm’s policies and procedures."},{"label":"D","text":"Published policies and procedures to encourage and empower staff to communicate to senior levels within the firm any issue relating to compliance with the fundamental principles that concerns them."}],"ans":"B","explanation":"Disclosing specific service scope and fees directly to TCWG is an engagement-specific safeguard."},{"id":"AT10015_Q30","n":30,"stem":"Fees charged for assurance engagements should be a fair reflection of the value of the work involved. In determining professional fees, the following should be taken into account, except","opts":[{"label":"A","text":"The time necessarily occupied by each person engaged on the work."},{"label":"B","text":"The outcome or result of a transaction or the result of the work performed."},{"label":"C","text":"The skill and knowledge required for the type of work involved."},{"label":"D","text":"The level of training and experience of the persons necessarily engaged on the work."}],"ans":"B","explanation":"Contingent fees based on outcomes are strictly prohibited for assurance engagements."},{"id":"AT10015_Q31","n":31,"stem":"In the case of audit engagements, it is in the public interest and, therefore, required by the Code that members of audit teams, firms and network firms shall be independent of audit clients. Independence requires","opts":[{"label":"A","text":"Independence of mind only."},{"label":"B","text":"Independence in appearance only."},{"label":"C","text":"Both independence of mind and independence in appearance"},{"label":"D","text":"Either independence of mind or independence in appearance"}],"ans":"C","explanation":"Independence requires BOTH independence of mind and independence in appearance."},{"id":"AT10015_Q32","n":32,"stem":"When the professional accountant determines that appropriate safeguards are not available or cannot be applied to eliminate the threats to independence or reduce them to an acceptable level, the professional accountant shall\nI. Eliminate the circumstance or relationship creating the threats.\nII. Decline or terminate the audit engagement.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Either I or II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"The accountant must eliminate the relationship causing the threat or decline/terminate the audit engagement."},{"id":"AT10015_Q33","n":33,"stem":"Independence from the audit client is required\nI. During the engagement period.\nII. During the period covered by the financial statements.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only."},{"label":"C","text":"Both I and II."},{"label":"D","text":"Neither I nor II."}],"ans":"C","explanation":"Independence is required both during the engagement period and during the period covered by the FS."},{"id":"AT10015_Q34","n":34,"stem":"Financial interests may be held through an intermediary (for example, a collective investment vehicle, estate or trust). When control over the investment vehicle or the ability to influence investment decisions exists, the code defines that financial interest to be a/an","opts":[{"label":"A","text":"Direct financial interest."},{"label":"B","text":"Material direct financial interest."},{"label":"C","text":"Indirect financial interest."},{"label":"D","text":"Material indirect financial interest."}],"ans":"A","explanation":"When control over the vehicle or ability to direct investment decisions exists, it is deemed a DIRECT financial interest."},{"id":"AT10015_Q35","n":35,"stem":"Holding a financial interest in an audit client may create a self-interest threat. The existence and significance of any threat created depends on\nI. The role of the person holding the financial interest.\nII. Whether the financial interest is direct or indirect.\nIII. The materiality of the financial interest.","opts":[{"label":"A","text":"I and II only."},{"label":"B","text":"I and III only."},{"label":"C","text":"II and III only."},{"label":"D","text":"I, II, and III."}],"ans":"D","explanation":"Significance depends on the person's role, whether interest is direct or indirect, and its materiality."},{"id":"AT10015_Q36","n":36,"stem":"The concept of materiality is least important to an auditor when considering the","opts":[{"label":"A","text":"Effects of a direct financial interest in the client upon the auditor’s independence."},{"label":"B","text":"Decision whether to use positive or negative confirmations of accounts receivable."},{"label":"C","text":"Adequacy of disclosure of a client’s illegal act."},{"label":"D","text":"Discovery of weaknesses in a client’s internal control."}],"ans":"A","explanation":"ANY direct financial interest impairs independence, regardless of whether it is material or immaterial."},{"id":"AT10015_Q37","n":37,"stem":"A direct financial interest or a material indirect financial interest in the audit client of a member of the audit team or his immediate family member may create a significant self-interest threat. Which of the following safeguards would be least likely considered to eliminate the threat or reduce it to an acceptable level?","opts":[{"label":"A","text":"Discuss the matter with those charged with governance of the audit client."},{"label":"B","text":"Dispose of the direct financial interest prior to the individual becoming a member of the audit team."},{"label":"C","text":"Dispose of the indirect financial interest in total or dispose of a sufficient amount of it so that the remaining interest is no longer material prior to the individual becoming a member of the audit team."},{"label":"D","text":"Remove the member of the audit team from the audit engagement."}],"ans":"A","explanation":"Merely discussing a direct financial interest with TCWG cannot reduce or eliminate the threat."},{"id":"AT10015_Q38","n":38,"stem":"Jayson, CPA, was offered the engagement to audit W Corporation for the year ended December 31, 2025. He had served as a director of W Corporation until December 31, 2023, and his spouse currently owns 6,000 of the 100,000 outstanding share capital of W Corporation. Jayson disassociated from W Corporation prior to being offered the engagement. Moreover, the engagement does not cover any period that includes Jayson’s association or employment with W Corporation. Under the code of ethics, Jayson should","opts":[{"label":"A","text":"Accept the engagement."},{"label":"B","text":"Let a partner from the same office accept and conduct the engagement."},{"label":"C","text":"Refuse the engagement because he had served as a director."},{"label":"D","text":"Refuse the engagement because of his spouse’s stock ownership."}],"ans":"D","explanation":"His spouse (immediate family member) has a direct financial interest in the client, which strictly impairs independence."},{"id":"AT10015_Q39","n":39,"stem":"A loan, or guarantee of a loan, to the firm from an audit client that is a bank or a similar institution, would not create a threat to independence provided\nI. The loan, or guarantee, is made under normal lending procedures, terms and requirements.\nII. The loan is immaterial to both the firm receiving the loan and the audit client.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"A bank loan does not impair independence if made under normal lending terms and is immaterial to both parties."},{"id":"AT10015_Q40","n":40,"stem":"When an immediate family member of a member of the assurance team is a director, an officer, or an employee of the assurance client in a position to exert direct and significant influence over the subject matter information of the assurance engagement, or was in such a position during the period covered by the engagement, the threats to independence can only be reduced to an acceptable level by","opts":[{"label":"A","text":"Where possible, structuring the responsibilities of the assurance team so that the professional does not deal with matters that are within the responsibility of the immediate family member."},{"label":"B","text":"Withdrawing from the assurance engagement."},{"label":"C","text":"Removing the individual from the assurance team."},{"label":"D","text":"Discussing the issue with those charged with governance, such as the audit committee."}],"ans":"C","explanation":"The only effective safeguard is removing the individual from the assurance team."},{"id":"AT10015_Q41","n":41,"stem":"Which of the following would not generally create a threat to independence?","opts":[{"label":"A","text":"The purchase of goods and services from an assurance client by the firm (or from a financial statement audit client by a network firm) or a member of the assurance team provided that the transaction is in the normal course of business and on an arm’s length basis."},{"label":"B","text":"A partner or employee of the firm or a network firm serves as Company Secretary for a financial statement audit client."},{"label":"C","text":"Determining which recommendations of the firm should be implemented."},{"label":"D","text":"Reporting, in a management role, to those charged with governance."}],"ans":"A","explanation":"Purchasing goods/services from a client in the ordinary course of business on normal arm's-length terms does not create an independence threat."},{"id":"AT10015_Q42","n":42,"stem":"The following forms of assistance to a financial statement audit client do not generally threaten the firm’s independence, except","opts":[{"label":"A","text":"Analyzing and accumulating information for regulatory reporting."},{"label":"B","text":"Assisting in resolving account reconciliation problems."},{"label":"C","text":"Authorizing or approving transactions."},{"label":"D","text":"Assisting in the preparation of consolidated financial statements."}],"ans":"C","explanation":"Authorizing or approving transactions is assuming a management responsibility, which is strictly prohibited."},{"id":"AT10015_Q43","n":43,"stem":"As defined in the Code, “a valuation comprises the making of assumptions with regard to future developments, the application of certain methodologies and techniques, and the combination of both in order to compute a certain value, or range of values, for an asset, a liability or for a business as a whole.” Which of the following threats may be created when a firm or a network firm performs valuation for an audit client that is to be incorporated in the client’s financial statements?","opts":[{"label":"A","text":"Advocacy threat"},{"label":"B","text":"Familiarity threat"},{"label":"C","text":"Self-review threat"},{"label":"D","text":"Intimidation threat"}],"ans":"C","explanation":"Performing valuations incorporated into FS creates a self-review threat."},{"id":"AT10015_Q44","n":44,"stem":"The following statements relate to the provision of taxation, internal audit or IT Systems services to audit clients. Which is false?","opts":[{"label":"A","text":"Preparing calculations of current and deferred tax liabilities (or assets) for an audit client for the purpose of preparing accounting entries that will be subsequently audited by the firm creates a self-interest threat."},{"label":"B","text":"A self-review threat may be created when a firm, or network firm, provides internal audit services to an audit client."},{"label":"C","text":"The provision of services by a firm or network firm to an audit client that involve the design and implementation of financial information technology systems that are used to generate information forming part of a client’s financial statements may create a self-review threat."},{"label":"D","text":"The provision of services in connection with the assessment, design, and implementation of internal accounting controls and risk management controls does not create a threat to independence provided that firm or network firm personnel do not perform management functions."}],"ans":"A","explanation":"Preparing tax accounting entries that the firm will subsequently audit creates a SELF-REVIEW threat, not a self-interest threat."},{"id":"AT10015_Q45","n":45,"stem":"What threat to independence is created when the litigation support services provided to an audit client include the estimation of the possible outcome and thereby affects the amounts or disclosures to be reflected in the financial statements?","opts":[{"label":"A","text":"Self-review threat"},{"label":"B","text":"Advocacy threat"},{"label":"C","text":"Intimidation threat"},{"label":"D","text":"Familiarity threat"}],"ans":"A","explanation":"Estimating outcomes affecting FS amounts creates a self-review threat."},{"id":"AT10015_Q46","n":46,"stem":"The recruitment of senior management for an assurance client, such as those in a position to affect the subject matter of the assurance engagement, may create the following current or future threats to independence, except","opts":[{"label":"A","text":"Self-interest threat"},{"label":"B","text":"Familiarity threat"},{"label":"C","text":"Intimidation threat"},{"label":"D","text":"Self-review threat"}],"ans":"D","explanation":"Recruitment of senior management creates self-interest, familiarity, and intimidation threats, but not self-review threat."},{"id":"AT10015_Q47","n":47,"stem":"Which of the following threats to independence may be created when litigation takes place, or appears likely, between the firm or a member of the assurance team the assurance client?","opts":[{"label":"A","text":"Self-interest or advocacy threat"},{"label":"B","text":"Advocacy or intimidation threat"},{"label":"C","text":"Self-interest or intimidation threat"},{"label":"D","text":"Familiarity or self-review threat"}],"ans":"C","explanation":"Litigation with a client creates self-interest and intimidation threats."},{"id":"AT10015_Q48","n":48,"stem":"The following statements relate to the provisions of the Code of Ethics that deal with the professional accountant’s marketing of professional services. Which is false?","opts":[{"label":"A","text":"When a professional accountant in public practice solicits new work through advertising or other forms of marketing, a self-interest threat to compliance with the principle of professional behavior may be created."},{"label":"B","text":"The professional accountant should be honest and truthful when marketing professional services."},{"label":"C","text":"Advertising and publicity are generally unacceptable."},{"label":"D","text":"When marketing professional services, the professional accountant should not make exaggerated claims for services offered, qualifications possessed or experience gained."}],"ans":"C","explanation":"Advertising and publicity are acceptable provided they are honest, truthful, and not deceptive or disparaging."},{"id":"AT10015_Q49","n":49,"stem":"Which of the following statements concerning publicity is incorrect?","opts":[{"label":"A","text":"A professional accountant may write a letter or make a direct approach to another professional accountant when seeking employment or professional business."},{"label":"B","text":"Genuine vacancies for staff may be communicated to the public through any medium in which comparable staff vacancies normally appear."},{"label":"C","text":"Professional accountants are prevented from providing training services to other professional bodies, associations or educational institutions which run courses for their members or the public."},{"label":"D","text":"In publications such as those specifically directed to schools and other places of education to inform students and graduates of career opportunities in the profession, services offered to the public may be described in a business-like way."}],"ans":"C","explanation":"Professional accountants are NOT prevented from lecturing or providing training services to professional bodies."},{"id":"AT10015_Q50","n":50,"stem":"A professional accountant in public practice is allowed to","opts":[{"label":"A","text":"Refer to, use or cite actual or purported testimonials by third parties."},{"label":"B","text":"Publish services in billboard (e.g., tarpaulin, streamers, etc.) advertisements."},{"label":"C","text":"Publish and compare fees with other CPAs or CPA firms or compare those services with those provided by another firm or CPA practitioner."},{"label":"D","text":"Inform interested parties through any medium that a partnership or salaried employment of an accountancy nature is being sought."}],"ans":"D","explanation":"Informing interested parties that partnership or employment is sought is permissible."},{"id":"AT10015_Q51","n":51,"stem":"After evaluating the significance of the threat created by an actual or threatened litigation, the following safeguards should be applied to reduce the threat to an acceptable level, except","opts":[{"label":"A","text":"Disclosing to the audit committee, or others charged with governance, the extent and nature of the litigation."},{"label":"B","text":"If the litigation involves a member of the assurance team, removing that individual from the assurance team."},{"label":"C","text":"Involving an additional professional accountant in the firm who was not a member of the assurance team to review the work or otherwise advise as necessary."},{"label":"D","text":"Withdraw from, or refuse to accept, the assurance engagement."}],"ans":"D","explanation":"Withdrawing from or refusing the engagement is an action taken when safeguards are unavailable, not a safeguard itself."},{"id":"AT10015_Q52","n":52,"stem":"When the total fees generated by an assurance client represent a large proportion of a firm’s total fees, the dependence on that client or client group and concern about the possibility of losing the client may create a/an","opts":[{"label":"A","text":"Self-interest threat."},{"label":"B","text":"Self-review threat."},{"label":"C","text":"Intimidation threat."},{"label":"D","text":"Advocacy threat."}],"ans":"A","explanation":"Undue fee dependence generates a self-interest threat (fear of losing revenue) and potential intimidation threat."},{"id":"AT10015_Q53","n":53,"stem":"What threat to independence may be created if fees due from an assurance client for professional services remain unpaid for a long time, especially if a significant part is not paid before the issue of the assurance report for the following year?","opts":[{"label":"A","text":"Advocacy threat"},{"label":"B","text":"Self-interest threat"},{"label":"C","text":"Intimidation threat"},{"label":"D","text":"Self-review threat"}],"ans":"B","explanation":"Overdue unpaid fees resemble a loan to the client, creating a self-interest threat."},{"id":"AT10015_Q54","n":54,"stem":"What threats to independence are created when a contingent fee is charged by a firm in respect of an assurance engagement?","opts":[{"label":"A","text":"Self-review and intimidation threats"},{"label":"B","text":"Self-interest and advocacy threats"},{"label":"C","text":"Familiarity and intimidation threats"},{"label":"D","text":"Self-interest and self-review threats"}],"ans":"B","explanation":"Contingent fees for assurance engagements create self-interest and advocacy threats so significant no safeguards can reduce them."},{"id":"AT10015_Q55","n":55,"stem":"The following statements relate to the provision of legal services to an audit client. Which is incorrect?","opts":[{"label":"A","text":"The provision of legal services to an audit client involving matters that would not be expected to have a material effect on the financial statements may create a self-review threat."},{"label":"B","text":"Legal services to support an audit client in the execution of a transaction (e.g., contract support) may create a self-review threat."},{"label":"C","text":"Acting for an audit client in the resolution of a dispute or litigation in such circumstances when the amounts involved are material in relation to the financial statements of the audit client would create advocacy and self-review threats so significant no safeguards could reduce the threats to an acceptable level."},{"label":"D","text":"The appointment of a partner or an employee of the firm or network firm as General Counsel for legal affairs to an audit client would create self-review and advocacy threats that are so significant no safeguards could reduce the threats to an acceptable level."}],"ans":"A","explanation":"Provision of legal services on matters with no material effect does NOT ordinarily create an unacceptable self-review threat."}]}]
</script>

<script>
(function(){
const MODULES = JSON.parse(document.getElementById('quizdata').textContent);
const MOD_MAP = {};
const Q_MAP = {};
let totalQ = 0;

MODULES.forEach(m => {
  MOD_MAP[m.id] = m;
  m.items.forEach(q => {
    q.mod = m;
    Q_MAP[q.id] = q;
    totalQ++;
  });
});

document.getElementById('sub').textContent = totalQ + ' Verbatim MCQs across ' + MODULES.length + ' CPAR Auditing Theory Modules';

const KEY = 'cpar_audit_pet_quizzer_v1';
let S = {
  pet: null,
  ans: {},
  flags: {},
  modId: 'AT-10001',
  filter: 'all',
  taps: 0
};

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved) S = Object.assign(S, saved);
} catch(e){}

if (!MOD_MAP[S.modId]) S.modId = 'AT-10001';

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}

const $ = s => document.querySelector(s);

function getStats(m) {
  let pts = 0, ans = 0, sc = m.items.length;
  m.items.forEach(q => {
    const a = S.ans[q.id];
    if (a) {
      ans++;
      if (a === q.ans) pts++;
    }
  });
  return { pts, ans, sc, n: m.items.length, pct: sc ? (pts / sc) * 100 : 0 };
}

function getMood(pct) {
  if (pct <= 20) return 'dying';
  if (pct <= 30) return 'normal';
  if (pct <= 50) return 'happy';
  if (pct <= 75) return 'fat';
  return 'gold';
}

const MOODNAME = {
  dying: 'Starving',
  normal: 'Doing okay',
  happy: 'Happy',
  fat: 'Well fed',
  gold: 'Ascended'
};

function formatOutlineMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (inTable && tableRows.length > 0) {
      html += '<div class="outline-table-wrap"><table class="outline-table"><thead><tr>';
      const headers = tableRows[0];
      headers.forEach(h => html += '<th>' + h + '</th>');
      html += '</tr></thead><tbody>';
      for (let i = 1; i < tableRows.length; i++) {
        html += '<tr>';
        tableRows[i].forEach(cell => html += '<td>' + cell + '</td>');
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      inTable = false;
      tableRows = [];
    }
  };

  lines.forEach(l => {
    const line = l.trim();
    if (line.startsWith('|')) {
      const parts = line.split('|').map(c => c.trim()).filter((_, idx, arr) => idx > 0 && idx < arr.length - 1);
      if (parts.length > 0 && !parts.every(p => /^[-:]+$/.test(p))) {
        inTable = true;
        tableRows.push(parts);
      }
      return;
    } else {
      flushTable();
    }

    if (line.startsWith('### ')) {
      html += '<h3 class="outline-h3">' + line.replace('### ', '') + '</h3>';
    } else if (line.startsWith('#### ')) {
      html += '<h4 class="outline-h4">' + line.replace('#### ', '') + '</h4>';
    } else if (line.startsWith('- ') || line.startsWith('* ')) {
      html += '<li class="outline-li">' + line.substring(2).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') + '</li>';
    } else if (line.startsWith('---')) {
      html += '<hr style="margin:14px 0;border:0;border-top:1px solid var(--line);">';
    } else if (line.length > 0) {
      html += '<p style="margin:6px 0">' + line.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') + '</p>';
    }
  });

  flushTable();
  return html;
}

function renderTabs() {
  const flagCount = Object.keys(S.flags).filter(k => Q_MAP[k]).length;
  let h = MODULES.map(m => {
    const st = getStats(m);
    const sel = S.modId === m.id;
    return '<button class="doctab" role="tab" data-mod="' + m.id + '" aria-selected="' + sel + '">' +
      m.code + '<span class="cnt">' + st.pts + '/' + st.sc + '</span></button>';
  }).join('');

  h += '<button class="doctab" role="tab" data-mod="FLAGGED" aria-selected="' + (S.modId === 'FLAGGED') + '">' +
    '⭐ Flagged Review<span class="cnt">' + flagCount + '</span></button>';

  $('#doctabs').innerHTML = h;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function qCard(q) {
  const userAns = S.ans[q.id];
  const done = userAns !== undefined;
  const fl = !!S.flags[q.id];
  const noteKey = 'audit_note_' + q.id;
  const savedNote = localStorage.getItem(noteKey) || '';
  const hasNote = savedNote.trim().length > 0;

  let h = '<article class="q' + (fl ? ' flagged' : '') + '" id="' + q.id + '" data-qid="' + q.id + '">';
  h += '<div class="qhead">';
  h += '<span class="num">Q' + q.n + '</span>';
  if (hasNote) {
    h += '<span class="notetag" onclick="openNote(\'' + q.id + '\')">✏️ Notes</span>';
  }
  h += '<button class="flag" data-flag="' + q.id + '" aria-pressed="' + fl + '">';
  h += (fl ? '★ Flagged' : '☆ Flag') + '</button></div>';

  if (q.context) {
    h += '<div style="background:var(--bg2);padding:10px 14px;border-radius:14px;font-size:.88rem;margin-bottom:10px;border:1px solid #ded0f7"><b>Facts:</b> ' + q.context + '</div>';
  }

  h += '<div class="stem">' + q.stem + '</div>';
  h += '<ul class="opts">';

  q.opts.forEach(o => {
    let cls = 'opt';
    let tag = '';
    if (done) {
      if (o.label === q.ans) {
        cls += ' correct';
        tag = '<span class="tag">✓ Correct</span>';
      } else if (o.label === userAns) {
        cls += ' wrong';
        tag = '<span class="tag">✗ Your pick</span>';
      }
    }
    h += '<li><button class="' + cls + '" data-opt="' + o.label + '" data-qid="' + q.id + '"' + (done ? ' disabled' : '') + '>';
    h += '<span class="lt">' + o.label + '</span>';
    h += '<span class="ot">' + o.text + '</span>' + tag + '</button></li>';
  });
  h += '</ul>';

  if (done) {
    if (userAns === q.ans) {
      h += '<p class="verdict ok">🎉 Correct! +1 ' + (S.pet === 'cat' ? '🐟' : '🍖') + '</p>';
    } else {
      h += '<p class="verdict no">⚠️ Incorrect. Correct answer is [ ' + q.ans + ' ]</p>';
    }
    if (q.explanation) {
      h += '<div class="expl"><h4>Rationale</h4>' + q.explanation + '</div>';
    }
    h += '<div class="qfoot"><button class="btn redo" data-redo="' + q.id + '">Reset Item</button></div>';
  }

  // Notes Box
  h += '<div class="notebox">';
  h += '<button class="notetoggle" onclick="toggleNote(\'' + q.id + '\')">✏️ My Notes / Mnemonics ' + (hasNote ? '• (saved)' : '') + '</button>';
  h += '<div class="notediv" id="note_' + q.id + '">';
  h += '<textarea rows="3" placeholder="Type memory aids, mnemonics, or notes for this question (auto-saved)..." oninput="saveNote(\'' + q.id + '\', this.value)">' + escapeHtml(savedNote) + '</textarea>';
  h += '<div class="notesavehint"><span>Persists in localStorage</span><span id="saved_' + q.id + '" style="color:#059669;font-weight:700"></span></div>';
  h += '</div></div>';

  h += '</article>';
  return h;
}

window.toggleNote = function(qid) {
  const div = document.getElementById('note_' + qid);
  if (div) div.classList.toggle('open');
};

window.openNote = function(qid) {
  const div = document.getElementById('note_' + qid);
  if (div) div.classList.add('open');
};

window.saveNote = function(qid, val) {
  const noteKey = 'audit_note_' + qid;
  if (val.trim()) {
    localStorage.setItem(noteKey, val);
  } else {
    localStorage.removeItem(noteKey);
  }
  const hint = document.getElementById('saved_' + qid);
  if (hint) {
    hint.textContent = '✓ Saved';
    setTimeout(() => { if (hint) hint.textContent = ''; }, 1200);
  }
};

function render() {
  renderTabs();
  const m = $('#main');

  if (S.modId === 'FLAGGED') {
    const flaggedIds = Object.keys(S.flags).filter(k => S.flags[k] && Q_MAP[k]);
    if (!flaggedIds.length) {
      m.innerHTML = '<div class="panel" style="text-align:center;padding:40px 20px"><h2 class="chtitle">No Flagged Items</h2><p class="chmeta">Bookmark difficult questions by clicking "Flag" on any question card to review them here.</p></div>';
      updatePet();
      return;
    }
    let h = '<section class="panel"><h2 class="chtitle">⭐ Flagged Review Queue</h2><p class="chmeta">' + flaggedIds.length + ' bookmarked items across modules. Answering here feeds your companion!</p></section>';
    h += flaggedIds.map(id => qCard(Q_MAP[id])).join('');
    m.innerHTML = h;
    updatePet();
    return;
  }

  const mod = MOD_MAP[S.modId];
  const st = getStats(mod);
  const md = getMood(st.pct);

  let h = '<section class="panel">';
  h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="background:var(--bg2);color:var(--plum);font-size:.78rem;font-weight:800;padding:2px 8px;border-radius:6px">' + mod.code + '</span><span style="font-size:.78rem;color:var(--muted)">' + mod.standards + '</span></div>';
  h += '<h2 class="chtitle">' + mod.title + '</h2>';
  h += '<p class="chmeta">' + st.n + ' questions • ' + st.pts + '/' + st.sc + ' points earned (' + Math.round(st.pct) + '% score) • ' + st.ans + ' answered</p>';

  h += '<div class="bowl"><div class="fill" style="width:' + st.pct.toFixed(1) + '%"></div><div class="marks"><span style="left:20%"></span><span style="left:30%"></span><span style="left:50%"></span><span style="left:75%"></span></div><div class="pawdot" style="left:' + Math.max(3, Math.min(97, st.pct)).toFixed(1) + '%">' + (S.pet === 'cat' ? '🐟' : '🍖') + '</div></div>';
  h += '<div class="stage"><span>Starving (0-20%)</span><span>Normal (30%)</span><span>Happy (50%)</span><span>Chonky (75%)</span><span style="color:#D97706">👑 Ascended</span></div>';

  h += '<div class="toolbar"><div class="seg" role="group">' +
    [['all','All Items'],['unanswered','Unanswered'],['flagged','Flagged'],['incorrect','Incorrect']].map(f =>
      '<button data-filter="' + f[0] + '" aria-pressed="' + (S.filter === f[0]) + '">' + f[1] + '</button>'
    ).join('') + '</div>';

  h += '<label class="jump">Jump: <input type="number" min="1" max="' + mod.items.length + '" id="jumpin" placeholder="Q#"></label>';
  h += '<button class="btn" id="resetMod">Reset Module</button>';
  h += '</div></section>';

  const items = mod.items.filter(q => {
    const a = S.ans[q.id];
    if (S.filter === 'unanswered') return a === undefined;
    if (S.filter === 'flagged') return !!S.flags[q.id];
    if (S.filter === 'incorrect') return a !== undefined && a !== q.ans;
    return true;
  });

  if (items.length === 0) {
    h += '<div class="panel" style="text-align:center;padding:36px 20px"><p class="chmeta">No items found under "' + S.filter + '" filter.</p><button class="btn" onclick="setFilterAll()">Show All Items</button></div>';
  } else {
    h += items.map(q => qCard(q)).join('');
  }

  m.innerHTML = h;
  updatePet();
  updateDrawerContent();
}

window.setFilterAll = function() {
  S.filter = 'all';
  save();
  render();
};

/* Virtual Pet SVG Rendering */
function petSVG(type, md, uid) {
  const G = {
    dying: { bx: 18, by: 20, hr: 22 },
    normal: { bx: 26, by: 23, hr: 25 },
    happy: { bx: 27, by: 24, hr: 25 },
    fat: { bx: 37, by: 30, hr: 28 },
    gold: { bx: 35, by: 29, hr: 27 }
  }[md];

  const cx = 70, cy = 100 - (md === 'fat' || md === 'gold' ? 2 : 0), hy = md === 'dying' ? 62 : 58, { bx, by, hr } = G;
  let P;
  if (md === 'gold') P = { fur: 'url(#gold' + uid + ')', dark: '#C98A07', light: '#FFF5C4', ink: '#5A3A00', inner: '#FFB37A' };
  else if (md === 'dying') P = type === 'dog' ? { fur: '#CFC4B6', dark: '#A0937F', light: '#EEE8E0', ink: '#4A4252', inner: '#D8C6C6' } : { fur: '#C3C3CB', dark: '#94949E', light: '#EDEDF1', ink: '#4A4252', inner: '#D9C9CF' };
  else P = type === 'dog' ? { fur: '#F2BA7A', dark: '#BD7340', light: '#FFF1DC', ink: '#3A2A44', inner: '#FF9CB6' } : { fur: '#A9B6CF', dark: '#7684A0', light: '#F5F3FB', ink: '#3A2A44', inner: '#FFB0C6' };

  const happy = md === 'happy' || md === 'fat' || md === 'gold';
  let s = '<svg viewBox="12 4 116 130" xmlns="http://www.w3.org/2000/svg" class="m-' + md + '" aria-hidden="true"><defs>' +
    '<radialGradient id="gold' + uid + '" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF3A6"/><stop offset=".55" stop-color="#F9C93C"/><stop offset="1" stop-color="#E09B0E"/></radialGradient>' +
    '<linearGradient id="fireA' + uid + '" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF3D1F"/><stop offset=".6" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFC23A" stop-opacity=".2"/></linearGradient>' +
    '<linearGradient id="fireB' + uid + '" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF9A1F"/><stop offset=".6" stop-color="#FFE45C" stop-opacity=".4"/></linearGradient>' +
    '<radialGradient id="glow' + uid + '"><stop offset="0" stop-color="#FFD54A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD54A" stop-opacity="0"/></radialGradient></defs>';

  if (md === 'gold') {
    s += '<circle cx="70" cy="80" r="66" fill="url(#glow' + uid + ')"/>';
    s += '<path class="flame" d="M70 -2 C84 22 110 28 118 58 C128 92 112 128 70 130 C28 128 12 92 22 58 C30 28 56 22 70 -2Z" fill="url(#fireA' + uid + ')"/>';
    s += '<path class="flame f4" d="M24 30 C34 48 22 62 30 84 C16 74 12 50 24 30Z M116 30 C106 48 118 62 110 84 C124 74 128 50 116 30Z" fill="url(#fireA' + uid + ')"/>';
    s += '<path class="flame f2" d="M70 16 C80 34 100 40 104 62 C110 92 98 124 70 126 C42 124 30 92 36 62 C40 40 60 34 70 16Z" fill="url(#fireB' + uid + ')"/>';
    s += '<path class="flame f3" d="M70 40 C78 54 92 60 92 78 C92 104 84 122 70 124 C56 122 48 104 48 78 C48 60 62 54 70 40Z" fill="#FFE66D" opacity=".75"/>';
    // Crown
    s += '<polygon points="58,16 64,4 70,12 76,4 82,16" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>';
  }

  s += '<ellipse cx="70" cy="129" rx="' + (bx + 12) + '" ry="5" fill="#2F2343" opacity=".14"/>';
  s += '<g class="petbody"><g class="breath">';

  // tail
  if (type === 'dog') {
    const tx = cx + bx - 5, ty = cy - 6;
    s += '<path class="tail" d="' + (md === 'dying' ? 'M' + tx + ' ' + ty + ' q12 6 14 22' : 'M' + tx + ' ' + ty + ' q14 -2 14 -22') + '" fill="none" stroke="' + P.dark + '" stroke-width="' + (md === 'dying' ? 5 : 8) + '" stroke-linecap="round"/>';
  } else {
    const tx = cx + bx - 4, ty = cy + 6;
    s += '<path class="tail" d="' + (md === 'dying' ? 'M' + tx + ' ' + ty + ' C' + (tx + 16) + ' ' + (ty + 2) + ' ' + (tx + 22) + ' ' + (ty + 16) + ' ' + (tx + 30) + ' ' + (ty + 18) : 'M' + tx + ' ' + ty + ' C' + (tx + 20) + ' ' + (ty - 2) + ' ' + (tx + 24) + ' ' + (ty - 30) + ' ' + (tx + 10) + ' ' + (ty - 38)) + '" fill="none" stroke="' + P.fur + '" stroke-width="' + (md === 'dying' ? 5 : 7) + '" stroke-linecap="round"/>';
  }

  // legs
  const lw = md === 'dying' ? 7 : (md === 'fat' || md === 'gold' ? 14 : 11), ly = cy + by - 12;
  [-(bx - 9), -(bx * 0.32), bx * 0.32, bx - 9].forEach((dx, i) => {
    s += '<rect x="' + (cx + dx - lw / 2) + '" y="' + ly + '" width="' + lw + '" height="' + (md === 'dying' ? 20 : 15) + '" rx="' + lw / 2 + '" fill="' + (i === 0 || i === 3 ? P.dark : P.fur) + '"/>';
  });

  // body
  s += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + bx + '" ry="' + by + '" fill="' + P.fur + '"/>';
  s += '<ellipse cx="' + cx + '" cy="' + (cy + 4) + '" rx="' + (bx * 0.56) + '" ry="' + (by * 0.62) + '" fill="' + P.light + '"/>';
  if (md === 'dying') {
    for (let i = 0; i < 3; i++) {
      const y = cy - 4 + i * 6;
      s += '<path d="M' + (cx - 9) + ' ' + y + ' q4 -3 8 0 M' + (cx + 1) + ' ' + y + ' q4 -3 8 0" fill="none" stroke="' + P.dark + '" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>';
    }
  }

  // ears (cat)
  if (type === 'cat') {
    const tip = md === 'dying' ? [cx - hr * 1.15, hy - hr + 2] : [cx - hr * 0.8, hy - hr - 13];
    const L = [[cx - hr * 0.95, hy - hr * 0.3], tip, [cx - hr * 0.15, hy - hr * 0.92]];
    const R = L.map(p => [2 * cx - p[0], p[1]]);
    [L, R].forEach(T => {
      s += '<path d="M' + T.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + 'Z" fill="' + P.fur + '"/>';
    });
  }

  // head
  s += '<circle cx="' + cx + '" cy="' + hy + '" r="' + hr + '" fill="' + P.fur + '"/>';

  // ears (dog)
  if (type === 'dog') {
    const rot = md === 'dying' ? 8 : 22, ry = md === 'dying' ? 19 : 16;
    s += '<ellipse cx="' + (cx - hr + 3) + '" cy="' + (hy + 2) + '" rx="9" ry="' + ry + '" fill="' + P.dark + '" transform="rotate(' + rot + ' ' + (cx - hr + 3) + ' ' + (hy - 10) + ')"/>';
    s += '<ellipse cx="' + (cx + hr - 3) + '" cy="' + (hy + 2) + '" rx="9" ry="' + ry + '" fill="' + P.dark + '" transform="rotate(' + (-rot) + ' ' + (cx + hr - 3) + ' ' + (hy - 10) + ')"/>';
  }

  // eyes
  const ex = hr * 0.38, ey = hy - 3;
  [cx - ex, cx + ex].forEach((x, i) => {
    if (md === 'dying') {
      s += '<path d="M' + (x - 4) + ' ' + ey + ' q4 3.5 8 0" fill="none" stroke="' + P.ink + '" stroke-width="2.2" stroke-linecap="round"/>';
    } else if (happy) {
      s += '<path d="M' + (x - 4.5) + ' ' + (ey + 1.5) + ' q4.5 -6 9 0" fill="none" stroke="' + P.ink + '" stroke-width="2.8" stroke-linecap="round"/>';
    } else {
      s += '<circle cx="' + x + '" cy="' + ey + '" r="3.6" fill="' + P.ink + '"/><circle cx="' + (x + 1.2) + '" cy="' + (ey - 1.3) + '" r="1.2" fill="#fff"/>';
    }
  });

  if (happy) {
    [cx - hr * 0.62, cx + hr * 0.62].forEach(x => {
      s += '<ellipse cx="' + x + '" cy="' + (hy + 7) + '" rx="4.6" ry="2.8" fill="#FF7FA8" opacity=".55"/>';
    });
  }

  // snout / nose
  if (type === 'dog') {
    s += '<ellipse cx="' + cx + '" cy="' + (hy + 9) + '" rx="' + (hr * 0.44) + '" ry="' + (hr * 0.32) + '" fill="' + P.light + '"/>';
    s += '<ellipse cx="' + cx + '" cy="' + (hy + 4.5) + '" rx="4.6" ry="3.4" fill="' + P.ink + '"/>';
    if (md === 'dying') s += '<path d="M' + (cx - 5) + ' ' + (hy + 15) + ' q5 -4 10 0" fill="none" stroke="' + P.ink + '" stroke-width="1.8" stroke-linecap="round"/>';
    else if (happy) s += '<path d="M' + (cx - 6) + ' ' + (hy + 10) + ' q6 9 12 0Z" fill="#7A2E45"/>';
    else s += '<path d="M' + (cx - 5) + ' ' + (hy + 11) + ' q2.5 3 5 0 q2.5 3 5 0" fill="none" stroke="' + P.ink + '" stroke-width="1.8" stroke-linecap="round"/>';
  } else {
    s += '<path d="M' + (cx - 3.2) + ' ' + (hy + 4) + ' L' + (cx + 3.2) + ' ' + (hy + 4) + ' L' + cx + ' ' + (hy + 7.5) + 'Z" fill="#FF7FA8"/>';
    if (happy) s += '<path d="M' + (cx - 5) + ' ' + (hy + 9) + ' q5 7 10 0Z" fill="#7A2E45"/>';
    else s += '<path d="M' + (cx - 5) + ' ' + (hy + 9) + ' q2.5 3 5 0 q2.5 3 5 0" fill="none" stroke="' + P.ink + '" stroke-width="1.8" stroke-linecap="round"/>';
  }

  if (md === 'dying') s += '<path class="drop" d="M' + (cx + hr * 0.7) + ' ' + (hy - 14) + ' q3 5 0 7 q-3 -2 0 -7Z" fill="#8CC8F2"/>';

  s += '</g></g>';
  if (md === 'gold') {
    [[22, 30, ''], [118, 42, ' s2'], [30, 100, ' s3'], [112, 104, '']].forEach(p => {
      s += '<path class="spark' + p[2] + '" d="M' + p[0] + ' ' + (p[1] - 6) + ' L' + (p[0] + 2) + ' ' + (p[1] - 2) + ' L' + (p[0] + 6) + ' ' + p[1] + ' L' + (p[0] + 2) + ' ' + (p[1] + 2) + ' L' + p[0] + ' ' + (p[1] + 6) + ' L' + (p[0] - 2) + ' ' + (p[1] + 2) + ' L' + (p[0] - 6) + ' ' + p[1] + ' L' + (p[0] - 2) + ' ' + (p[1] - 2) + 'Z" fill="#FFF6B0"/>';
    });
  }
  if (md === 'fat') {
    [[24, 40, ''], [116, 48, ' s2']].forEach(p => {
      s += '<text class="spark' + p[2] + '" x="' + p[0] + '" y="' + p[1] + '" font-size="12" text-anchor="middle">💖</text>';
    });
  }
  s += '</svg>';
  return s;
}

let lastPetKey = '';
function updatePet() {
  if (!S.pet) {
    $('#pet').style.display = 'none';
    return;
  }
  $('#pet').style.display = '';
  const mod = MOD_MAP[S.modId] || MODULES[0];
  const st = getStats(mod);
  const md = getMood(st.pct);
  const key = S.pet + md;

  if (key !== lastPetKey) {
    $('#petbtn').innerHTML = petSVG(S.pet, md, 'p');
    lastPetKey = key;
  }

  $('#bubble').innerHTML = MOODNAME[md] + ' (' + Math.round(st.pct) + '%)<small>' + mod.code + '</small>';
}

function floatParticle(txt, cls, dx) {
  const f = document.createElement('span');
  f.className = 'float ' + (cls || '');
  f.textContent = txt;
  f.style.setProperty('--dx', (dx || 0) + 'px');
  $('#petbtn').appendChild(f);
  setTimeout(() => f.remove(), 1100);
}

function petAnim(cls) {
  const b = $('#petbtn');
  b.classList.remove('jump', 'pat');
  void b.offsetWidth;
  b.classList.add(cls);
  setTimeout(() => b.classList.remove(cls), 650);
}

function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2200);
}

/* Drawer logic */
function updateDrawerContent() {
  const mod = MOD_MAP[S.modId] || MODULES[0];
  $('#drawerTitle').textContent = mod.code + ' – ' + mod.title;
  $('#drawerSub').textContent = 'Official CPAR Lecture Outline &amp; Standards: ' + mod.standards;

  const srch = ($('#drawersrch').value || '').toLowerCase().trim();
  let outline = mod.lectureOutline;

  if (srch) {
    const lines = outline.split('\n');
    const filtered = lines.filter(l => l.toLowerCase().includes(srch));
    if (!filtered.length) {
      $('#drawerbody').innerHTML = '<p style="color:var(--muted)">No matches found in this module for "' + srch + '".</p>';
      return;
    }
    outline = '### Search results in ' + mod.code + ' for "' + srch + '":\n\n' + filtered.join('\n\n');
  }

  $('#drawerbody').innerHTML = formatOutlineMarkdown(outline);
}

/* Event delegation */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-mod],[data-opt],[data-flag],[data-filter],[data-redo],[data-pet],#drawerbtn,#drawerclose,#swap,#resetMod,#petbtn');
  if (!t) return;

  if (t.dataset.mod) {
    S.modId = t.dataset.mod;
    S.filter = 'all';
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (t.dataset.filter) {
    S.filter = t.dataset.filter;
    save();
    render();
    return;
  }

  if (t.dataset.flag) {
    const qid = t.dataset.flag;
    if (S.flags[qid]) delete S.flags[qid];
    else S.flags[qid] = true;
    save();
    render();
    return;
  }

  if (t.dataset.opt) {
    const qid = t.dataset.qid;
    const q = Q_MAP[qid];
    if (S.ans[qid]) return;

    const chosen = t.dataset.opt;
    S.ans[qid] = chosen;
    save();

    render();

    if (chosen === q.ans) {
      petAnim('jump');
      floatParticle('+1 ' + (S.pet === 'cat' ? '🐟' : '🍖'), '', 0);
    } else {
      petAnim('pat');
    }
    updatePet();
    return;
  }

  if (t.dataset.redo) {
    const qid = t.dataset.redo;
    delete S.ans[qid];
    save();
    render();
    toast('Item reset');
    return;
  }

  if (t.id === 'resetMod') {
    const mod = MOD_MAP[S.modId];
    if (!confirm('Clear all answers for ' + mod.code + '? Flags and notes will be kept.')) return;
    mod.items.forEach(q => delete S.ans[q.id]);
    save();
    render();
    toast(mod.code + ' answers cleared');
    return;
  }

  if (t.id === 'petbtn') {
    S.taps = (S.taps || 0) + 1;
    save();
    petAnim('pat');
    floatParticle('💖', 'heart', -15);
    setTimeout(() => floatParticle('💖', 'heart', 15), 120);
    const msgs = S.pet === 'cat' ? ['Purr...', 'Mrrp! 🐾', '*slow blink*', 'Prrr!'] : ['Woof!', 'Arf! 🦴', '*happy tail wag*', 'Yip!'];
    toast(msgs[S.taps % msgs.length]);
    return;
  }

  if (t.id === 'swap') {
    openChooser();
    return;
  }

  if (t.dataset.pet) {
    S.pet = t.dataset.pet;
    save();
    $('#chooser').hidden = true;
    lastPetKey = '';
    render();
    toast('Adopted ' + (S.pet === 'cat' ? 'Kitten' : 'Puppy') + '!');
    return;
  }

  if (t.id === 'drawerbtn') {
    $('#drawer').classList.add('open');
    updateDrawerContent();
    return;
  }

  if (t.id === 'drawerclose' || t.id === 'drawer') {
    $('#drawer').classList.remove('open');
    return;
  }
});

// Close drawer on background click
$('#drawer').addEventListener('click', e => {
  if (e.target.id === 'drawer') {
    $('#drawer').classList.remove('open');
  }
});

$('#drawersrch').addEventListener('input', () => {
  updateDrawerContent();
});

document.addEventListener('change', e => {
  if (e.target.id === 'jumpin') {
    const val = parseInt(e.target.value, 10);
    const mod = MOD_MAP[S.modId];
    if (!mod) return;
    const q = mod.items.find(x => x.n === val);
    if (!q) {
      toast('Item Q' + val + ' not found in this module');
      return;
    }
    S.filter = 'all';
    render();
    const el = document.getElementById(q.id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.style.borderColor = 'var(--plum)';
      setTimeout(() => { if (el) el.style.borderColor = ''; }, 1800);
    }
  }
});

function openChooser() {
  $('#pvDog').innerHTML = petSVG('dog', 'happy', 'd');
  $('#pvCat').innerHTML = petSVG('cat', 'happy', 'c');
  $('#chooser').hidden = false;
}

render();
if (!S.pet) openChooser();
})();
</script>
</body>
</html>
