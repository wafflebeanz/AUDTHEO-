occurred, but were not recorded."}],"ans":"A","explanation":"The auditor must ascertain the underlying business purpose and economic rationale of the transaction."},{"id":"AT10011_Q16","n":16,"stem":"PSA 570 (Going Concern) states that a fundamental principle in the preparation of financial statements is the going concern assumption. Under this assumption, an entity is ordinarily viewed as continuing in business for the foreseeable future with neither the intention nor the necessity of liquidation, ceasing trading or seeking protection from creditors pursuant to laws and regulations. The responsibility to make an assessment of an entity’s ability to continue as a going concern rests with the","opts":[{"label":"A","text":"Auditor"},{"label":"B","text":"Entity’s management"},{"label":"C","text":"SEC"},{"label":"D","text":"Entity’s creditors"}],"ans":"B","explanation":"Management has the direct responsibility to assess the entity's going concern status."},{"id":"AT10011_Q17","n":17,"stem":"Which of the following statements best describes the auditor’s responsibility concerning the appropriateness of the going concern assumption in the preparation of the financial statements?","opts":[{"label":"A","text":"The auditor’s responsibility is to make a specific assessment of the entity’s ability to continue as a going concern."},{"label":"B","text":"The auditor’s responsibility is to predict future events or conditions that may cause the entity to cease to continue as a going concern."},{"label":"C","text":"The auditor’s responsibility is to consider the appropriateness of management’s use of the going concern assumption and consider whether there are material uncertainties about the entity’s ability to continue as a going concern that need to be disclosed in the financial statements."},{"label":"D","text":"The auditor’s responsibility is to give a guarantee in the audit report that the entity has the ability to continue as a going concern."}],"ans":"C","explanation":"Under PSA 570, the auditor evaluates management's use of the assumption and whether material uncertainties exist requiring disclosure."},{"id":"AT10011_Q18","n":18,"stem":"Which of the following conditions or events most likely would cause an auditor to have substantial doubt about an entity’s ability to continue as a going concern?","opts":[{"label":"A","text":"Cash flows from operating activities are negative."},{"label":"B","text":"Stock dividends replace annual cash dividends."},{"label":"C","text":"Significant related party transactions are pervasive."},{"label":"D","text":"Research and development projects are postponed."}],"ans":"A","explanation":"Negative cash flows from operations are a major financial indicator of going concern doubt."},{"id":"AT10011_Q19","n":19,"stem":"Which of the following conditions or events most likely would cause an auditor to have substantial doubt about an entity’s ability to continue as a going concern?","opts":[{"label":"A","text":"Restrictions on the disposal of principal assets are present."},{"label":"B","text":"Usual trade credit from suppliers is denied."},{"label":"C","text":"Significant related party transactions are pervasive."},{"label":"D","text":"Arrearages in principal stock dividends are paid."}],"ans":"B","explanation":"Denial of usual supplier trade credit (forced cash-on-delivery) signals severe working capital distress."},{"id":"AT10011_Q20","n":20,"stem":"Which of the following audit procedures would most likely assist an auditor in identifying conditions and events that may indicate there could be substantial doubt about an entity’s ability to continue as a going concern?","opts":[{"label":"A","text":"Confirmation of bank balances."},{"label":"B","text":"Confirmation of accounts receivable from major customers."},{"label":"C","text":"Reconciliation of interest expense with debt outstanding."},{"label":"D","text":"Review of compliance with terms of debt agreements."}],"ans":"D","explanation":"Reviewing debt covenant compliance detects defaults or violations that could trigger immediate loan acceleration."},{"id":"AT10011_Q21","n":21,"stem":"Harold, CPA, believes there is substantial doubt about the ability of Jersamtan Co. to continue as a going concern for a reasonable period of time. In evaluating Jersamtan’s plans for dealing with the adverse effects of future conditions and events, Harold most likely would consider, as a mitigating factor, Jersamtan’s plans to","opts":[{"label":"A","text":"Postpone expenditures for research and development projects."},{"label":"B","text":"Purchase production facilities currently being leased from a related party."},{"label":"C","text":"Strengthen internal controls over cash disbursements."},{"label":"D","text":"Discuss with lenders the terms of all debt and loan agreements."}],"ans":"A","explanation":"Postponing capital expenditures or R&D immediately reduces cash outflows, acting as a realistic mitigating plan."},{"id":"AT10011_Q22","n":22,"stem":"When an auditor concludes that there is substantial doubt about a continuing audit client’s ability to continue as a going concern for a reasonable period of time, the auditor’s responsibility is to","opts":[{"label":"A","text":"Consider the adequacy of disclosure about the client’s possible inability to continue as a going concern."},{"label":"B","text":"Issue a qualified or adverse opinion, depending upon materiality, due to the possible effects on the financial statements."},{"label":"C","text":"Report to the client’s audit committee that management’s accounting estimates may need to be adjusted."},{"label":"D","text":"Reissue the prior year’s auditor’s report and add an emphasis of matter paragraph that specifically refers to “substantial doubt” and “going concern.”"}],"ans":"A","explanation":"The auditor must evaluate whether the disclosures concerning the going concern uncertainty are adequate in the notes."},{"id":"AT10011_Q23","n":23,"stem":"As used in PSA 560 (Subsequent Events), the term “subsequent events” refers to\nI. Events occurring between the date of the financial statements and the date of the auditor’s report.\nII. Facts discovered after the date of the auditor’s report.","opts":[{"label":"A","text":"I only."},{"label":"B","text":"II only."},{"label":"C","text":"Both I and II."},{"label":"D","text":"Neither I nor II."}],"ans":"C","explanation":"PSA 560 explicitly defines subsequent events as both events up to the report date and facts discovered after the report date."},{"id":"AT10011_Q24","n":24,"stem":"Which of the following statements best describes the “date of the financial statements?”","opts":[{"label":"A","text":"The date on which those with the recognized authority assert that they have prepared the entity’s complete set of financial statements, including the related notes, and that they have taken responsibility for them."},{"label":"B","text":"The date that the auditor’s report and audited financial statements are made available to third parties."},{"label":"C","text":"The date of the end of the latest period covered by the financial statements, which is normally the date of the most recent balance sheet in the financial statements subject to audit."},{"label":"D","text":"The date on which the auditor has obtained sufficient appropriate audit evidence on which to base the opinion on the financial statements."}],"ans":"C","explanation":"This is the exact definition of \"Date of the financial statements\" under PSA 560."},{"id":"AT10011_Q25","n":25,"stem":"Which of the following procedures would an auditor most likely perform to obtain evidence about the occurrence of subsequent events?","opts":[{"label":"A","text":"Inquiring as to whether any unusual adjustments were made after the date of the financial statements."},{"label":"B","text":"Confirming a sample of material accounts receivable established after the date of the financial statements."},{"label":"C","text":"Comparing the financial statements being reported on with those of the prior period."},{"label":"D","text":"Investigating personnel changes in the accounting department occurring after the date of the financial statements."}],"ans":"A","explanation":"Inquiring whether unusual adjustments were made after the balance sheet date is a specific subsequent events procedure."},{"id":"AT10011_Q26","n":26,"stem":"Which of the following statements best expresses the auditor’s responsibility with respect to facts discovered after the date of the auditor’s report but before the date the financial statements are issued?","opts":[{"label":"A","text":"The auditor should amend the financial statements."},{"label":"B","text":"If the facts discovered will materially affect the financial statements, the auditor should issue a new report which contains either a qualified opinion or an adverse opinion."},{"label":"C","text":"The auditor should consider whether the financial statements need amendment, discuss the matter with management, and consider taking actions appropriate in the circumstances."},{"label":"D","text":"The auditor should withdraw from the engagement."}],"ans":"C","explanation":"The auditor discusses with management whether amendment is needed and determines appropriate audit action."},{"id":"AT10011_Q27","n":27,"stem":"After issuing a report, an auditor has no obligation to make continuing inquiries or perform other procedures concerning the audited financial statements, unless","opts":[{"label":"A","text":"Final determinations or resolutions are made of contingencies that had been disclosed in the financial statements."},{"label":"B","text":"Information about an event that occurred after the date of the auditor’s report comes to the auditor’s attention."},{"label":"C","text":"The control environment changes after issuance of the report."},{"label":"D","text":"Information, which existed at the report date and may affect the report, comes to the auditor’s attention."}],"ans":"D","explanation":"The auditor has no ongoing obligation unless information which existed at report date comes to attention."},{"id":"AT10011_Q28","n":28,"stem":"Which of the following events occurring after the issuance of an auditor’s report most likely would cause the auditor to make further inquiries about the previously issued financial statements?","opts":[{"label":"A","text":"A technological development that could affect the entity’s future ability to continue as a going concern."},{"label":"B","text":"The entity’s sale of a subsidiary that accounts for 30% of the entity’s consolidated sales."},{"label":"C","text":"The discovery of information regarding a contingency that existed before the financial statements were issued."},{"label":"D","text":"The final resolution of a lawsuit disclosed in the notes to the financial statements."}],"ans":"C","explanation":"Discovery of information about a contingency that existed before the statements were issued requires investigation."},{"id":"AT10011_Q29","n":29,"stem":"The auditor is required to obtain audit evidence that management\nI. Acknowledges its responsibility for the fair presentation of the financial statements in accordance with applicable financial reporting framework.\nII. Has approved the financial statements.","opts":[{"label":"A","text":"I only."},{"label":"B","text":"II only."},{"label":"C","text":"Both I and II."},{"label":"D","text":"Neither I nor II."}],"ans":"C","explanation":"Under PSA 580, evidence must be obtained that management acknowledges responsibility and has approved the FS."},{"id":"AT10011_Q30","n":30,"stem":"When an audit is made in accordance with generally accepted auditing standards, the auditor should always","opts":[{"label":"A","text":"Observe the taking of physical inventory on the balance sheet date."},{"label":"B","text":"Obtain certain written representations from management."},{"label":"C","text":"Employ analytical procedures as substantive tests to obtain evidence about specific assertions related to account balances."},{"label":"D","text":"Document the understanding of the client’s internal control and the basis for all conclusions about the assessed level of control risk for financial statement assertions."}],"ans":"B","explanation":"Obtaining written representations from management (PSA 580) is mandatory in all financial statement audits."},{"id":"AT10011_Q31","n":31,"stem":"When considering the use of management’s written representations as audit evidence about the completeness assertion, an auditor should understand that such representations","opts":[{"label":"A","text":"Constitute sufficient appropriate audit evidence to support the assertion when considered in combination with a sufficiently low assessed level of control risk."},{"label":"B","text":"Are not part of the audit evidence considered to support the assertion."},{"label":"C","text":"Replace a low assessed level of control risk as audit evidence to support the assertion."},{"label":"D","text":"Complement, but do not replace, substantive tests designed to support the assertion."}],"ans":"D","explanation":"Management representations complement, but cannot substitute for or replace, substantive audit procedures."},{"id":"AT10011_Q32","n":32,"stem":"A written representation from a client’s management that, among other matters, acknowledges responsibility for the fair presentation of financial statements, should normally be signed by the","opts":[{"label":"A","text":"Chief financial officer and the chair of the board of directors."},{"label":"B","text":"Chief executive officer and the chief financial officer."},{"label":"C","text":"Chief executive officer, the chair of the board of directors, and the client’s lawyer."},{"label":"D","text":"Chair of the audit committee of the board of directors."}],"ans":"B","explanation":"Under PSA 580, the letter is normally signed by the CEO and CFO."},{"id":"AT10011_Q33","n":33,"stem":"The date of the management representation letter should coincide with the date of the","opts":[{"label":"A","text":"Balance sheet"},{"label":"B","text":"Latest related party transaction"},{"label":"C","text":"Auditor’s report"},{"label":"D","text":"Latest interim financial information"}],"ans":"C","explanation":"The representation letter must be dated as of the date of the auditor's report."},{"id":"AT10011_Q34","n":34,"stem":"Which of the following statements concerning management representations is incorrect?","opts":[{"label":"A","text":"Representations by management can be a substitute for other audit evidence that the auditor could reasonably expect to be available."},{"label":"B","text":"If the auditor is unable to obtain sufficient appropriate audit evidence regarding a matter, which has, or may have, a material effect on the financial statements and such audit evidence is expected to be available, this will constitute a limitation in the scope of the audit, even if a representation from management has been received on the matter."},{"label":"C","text":"If a representation by management is contradicted by other audit evidence, the auditor should investigate the circumstances and, when necessary, reconsider the reliability of other representations by management."},{"label":"D","text":"The auditor’s working papers would ordinarily include a summary of oral discussions with management or written representations from management."}],"ans":"A","explanation":"Representations by management CANNOT be a substitute for other audit evidence."},{"id":"AT10011_Q35","n":35,"stem":"What type of opinion should be expressed if the client’s management refuses to provide a representation that the auditor considers necessary?","opts":[{"label":"A","text":"Qualified opinion or a disclaimer of opinion."},{"label":"B","text":"Qualified opinion or an adverse opinion."},{"label":"C","text":"Adverse opinion or a disclaimer of opinion"},{"label":"D","text":"Unmodified opinion."}],"ans":"A","explanation":"Management refusal to provide written representations is a scope limitation (qualified or disclaimer of opinion)."}]},{"id":"AT-10012","code":"AT-10012","title":"Forming an Opinion and Reporting on Financial Statements","standards":"PSA 700 (Revised), PSA 701, PSA 705 (Revised), PSA 706 (Revised), PSA 710, PSA 720 (Revised), PSA 800, PSA 805, PSA 810","questionCount":40,"summary":"Standard Auditor’s Report Structure (Title, Addressee, Opinion, Basis for Opinion, Material Uncertainty to Going Concern, Key Audit Matters, Responsibilities of Management & TCWG, Auditor’s Responsibilities, Signature, Date, Address), Modified Opinions (Qualified, Adverse, Disclaimer - Pervasiveness matrix), Key Audit Matters (PSA 701), Emphasis of Matter and Other Matter paragraphs (PSA 706), Comparative Information (Corresponding figures vs Comparative FS - PSA 710), Other Information (PSA 720), and Special Purpose Frameworks (PSA 800, 805, 810).","lectureOutline":"### PSA 700 (REVISED): FORMING AN OPINION AND REPORTING ON FINANCIAL STATEMENTS\n\n#### Order of Sections in the Independent Auditor's Report\n1. **Title:** Must indicate \"Independent Auditor's Report\" to distinguish from reports of others.\n2. **Addressee:** To shareholders, board of directors, or both (not to management).\n3. **Opinion Section (FIRST):** Identifies entity, states FS audited, titles of each statement, notes, date/period, and opinion phrasing (\"present fairly, in all material respects, in accordance with PFRS\").\n4. **Basis for Opinion (Immediately follows Opinion):** States audit conducted in accordance with PSAs, refers to responsibilities section, statement of independence under Code of Ethics, states evidence obtained is sufficient and appropriate.\n5. **Going Concern Section (if applicable):** Heading \"Material Uncertainty Related to Going Concern\".\n6. **Key Audit Matters (PSA 701):** Mandatory for listed entities.\n7. **Responsibilities of Management and TCWG:** Fair presentation under PFRS, internal control, going concern assessment, oversight.\n8. **Auditor’s Responsibilities for the Audit of the FS:** Reasonable assurance definition, fraud vs. error, professional skepticism, exercising judgment. May be in body, appendix, or reference to official authority website.\n9. **Other Reporting Responsibilities (if applicable)**\n10. **Name of Engagement Partner:** Required for listed entities (unless significant personal security threat).\n11. **Signature of the Auditor:** Name of audit firm, personal name, or both.\n12. **Auditor’s Address:** Location in jurisdiction where auditor practices.\n13. **Date of Auditor’s Report:** Dated **no earlier than the date** on which the auditor has obtained sufficient appropriate audit evidence, including management assertion and approval of FS.\n\n---\n\n### PSA 705 (REVISED): MODIFICATIONS TO THE OPINION\n\n| Nature of Matter Giving Rise to Modification | Material but NOT Pervasive | Material AND Pervasive |\n|---|---|---|\n| **Financial statements are materially misstated** (Departure from PFRS) | **Qualified Opinion** (\"Except for...\") | **Adverse Opinion** (\"Do not present fairly...\") |\n| **Inability to obtain sufficient appropriate audit evidence** (Scope Limitation) | **Qualified Opinion** (\"Except for...\") | **Disclaimer of Opinion** (\"We do not express an opinion...\") |\n\n*Prohibition:* When a disclaimer of opinion is issued, the auditor is **prohibited** from communicating Key Audit Matters (KAM).\n\n---\n\n### PSA 701: COMMUNICATING KEY AUDIT MATTERS (KAM)\n- Matters of **most significance** in the audit of current period FS, selected from matters communicated with TCWG.\n- Not a substitute for disclosures, expressing a modified opinion, or going concern reporting under PSA 570.\n- Does NOT provide a separate opinion on individual matters.\n\n---\n\n### PSA 706 (REVISED): EMPHASIS OF MATTER & OTHER MATTER\n- **Emphasis of Matter (EOM):** Refers to a matter *appropriately presented or disclosed* in the FS that is fundamental to users' understanding (e.g., litigation uncertainty, early adoption of new standard, catastrophe, major subsequent event). The opinion is NOT modified.\n- **Other Matter (OM):** Refers to a matter *other than those presented or disclosed* in the FS that is relevant to users' understanding of the audit, auditor's responsibilities, or report.\n\n---\n\n### PSA 710: COMPARATIVES\n- **Corresponding Figures:** Current opinion covers current period FS as a whole including corresponding figures; does not specifically refer to corresponding figures.\n- **Comparative Financial Statements:** Auditor's opinion refers to each period presented and audited.","items":[{"id":"AT10012_Q1","n":1,"stem":"A major purpose of the auditor’s report on financial statements is to","opts":[{"label":"A","text":"Assure investors of the complete accuracy of the financial statements."},{"label":"B","text":"Enhance the degree of confidence of intended users in the financial statements."},{"label":"C","text":"Deter creditors from extending loans in high-risk situations."},{"label":"D","text":"Describe the specific auditing procedures undertaken to gather evidence for the opinion."}],"ans":"B","explanation":"The primary purpose of the auditor's report is to enhance the degree of confidence of intended users in the FS."},{"id":"AT10012_Q2","n":2,"stem":"To distinguish it from report that might be issued by others, such as by officers of the entity, the board of directors, or from the reports of other auditors who may not have to abide by the same ethical requirements as the independent auditor, the auditor’s report should have an appropriate","opts":[{"label":"A","text":"Addresses"},{"label":"B","text":"Title"},{"label":"C","text":"Signature"},{"label":"D","text":"Opinion"}],"ans":"B","explanation":"The title \"Independent Auditor's Report\" distinguishes it from reports issued by others."},{"id":"AT10012_Q3","n":3,"stem":"The auditor’s report should be addressed","opts":[{"label":"A","text":"Only to the shareholders of the entity whose financial statements are being audited"},{"label":"B","text":"Only to the board of directors of the entity whose financial statements are being audited"},{"label":"C","text":"Either to the shareholders or the board of directors of the entity whose financial statement are being audited"},{"label":"D","text":"Either to the shareholders or the board of directors, or both, of the entity whose statements are being audited"}],"ans":"D","explanation":"The report is addressed to the shareholders, board of directors, or both."},{"id":"AT10012_Q4","n":4,"stem":"The first section of the auditor’s report shall have the heading","opts":[{"label":"A","text":"Responsibilities for the Financial Statements."},{"label":"B","text":"Opinion."},{"label":"C","text":"Auditor’s Responsibilities for the Audit of the Financial Statements."},{"label":"D","text":"Basis for Opinion."}],"ans":"B","explanation":"Under revised PSA 700, the first section of the report is the \"Opinion\" section."},{"id":"AT10012_Q5","n":5,"stem":"Which of the following sections in the auditor’s report shall be placed immediately after the Opinion section?","opts":[{"label":"A","text":"Management’s Responsibilities for the Financial Statements."},{"label":"B","text":"Auditor’s Responsibilities for the Audit of the Financial Statements."},{"label":"C","text":"Basis for Opinion."},{"label":"D","text":"Other Reporting Responsibilities."}],"ans":"C","explanation":"The \"Basis for Opinion\" section immediately follows the Opinion section."},{"id":"AT10012_Q6","n":6,"stem":"The Basis for Opinion section of the auditor’s report shall","opts":[{"label":"A","text":"State that the financial statements have been audited."},{"label":"B","text":"State that the objective of the auditor is to issue an auditor’s report that includes the auditor’s opinion."},{"label":"C","text":"Describe management’s responsibility for preparing the financial statements in accordance with the applicable financial reporting framework."},{"label":"D","text":"State that the audit was conducted in accordance with Philippine Standards on Auditing (PSAs)."}],"ans":"D","explanation":"The Basis for Opinion section expressly states that the audit was conducted in accordance with PSAs."},{"id":"AT10012_Q7","n":7,"stem":"Which of the following management’s responsibilities shall be described in the Responsibilities for the Financial Statements section the auditor’s report?","opts":[{"label":"A","text":"Responsibility for preparing the financial statements in accordance with the applicable financial reporting framework."},{"label":"B","text":"Responsibility for obtaining reasonable assurance about whether the financial statements as a whole are free from material misstatement."},{"label":"C","text":"Responsibility to exercise professional judgment and maintain professional skepticism throughout the audit."},{"label":"D","text":"Responsibility to identify and assess the risks of material misstatement of the financial statements."}],"ans":"A","explanation":"Management is responsible for the preparation and fair presentation of the FS in accordance with the framework."},{"id":"AT10012_Q8","n":8,"stem":"The description of the auditor’s responsibilities for the audit of the financial statements shall be included\nI. Within the body of the auditor’s report.\nII. Within an appendix to the auditor’s report.\nIII. By a specific reference within the auditor’s report to the location of such a description on a website of an appropriate authority.","opts":[{"label":"A","text":"I only."},{"label":"B","text":"II only."},{"label":"C","text":"I or II only."},{"label":"D","text":"I, II, or III."}],"ans":"D","explanation":"Under paragraph 40 of PSA 700 (Revised), the auditor's responsibilities can be in the body, an appendix, or a website reference."},{"id":"AT10012_Q9","n":9,"stem":"An auditor should disclose the substantive reasons for expressing an adverse opinion in the Basis for Adverse Opinion section","opts":[{"label":"A","text":"Following the opinion section."},{"label":"B","text":"Preceding the opinion section."},{"label":"C","text":"Following the Auditor’s Responsibility section."},{"label":"D","text":"Within the notes to the financial statements."}],"ans":"A","explanation":"The Basis for Adverse Opinion section is placed immediately following the Opinion section."},{"id":"AT10012_Q10","n":10,"stem":"What is the appropriate opinion to express when the auditor concludes that the financial statements are prepared, in all material respects, in accordance with the applicable financial reporting framework?","opts":[{"label":"A","text":"Unmodified opinion."},{"label":"B","text":"Qualified opinion."},{"label":"C","text":"Adverse opinion."},{"label":"D","text":"Disclaimer of opinion."}],"ans":"A","explanation":"An unmodified opinion is expressed when financial statements are prepared, in all material respects, in accordance with the applicable framework."},{"id":"AT10012_Q11","n":11,"stem":"PSA 705 (Revised), Modification to the Opinion in the Independent Auditor’s Report, prohibits the auditor from communicating key audit matters when the auditor expresses a/an","opts":[{"label":"A","text":"Unmodified opinion."},{"label":"B","text":"Qualified opinion."},{"label":"C","text":"Adverse opinion."},{"label":"D","text":"Disclaimer of opinion."}],"ans":"D","explanation":"PSA 705 prohibits communicating Key Audit Matters when the auditor disclaims an opinion."},{"id":"AT10012_Q12","n":12,"stem":"The following statements relate to the date of the auditor’s report. Which is false?","opts":[{"label":"A","text":"The auditor should date the report as of the completion date of the audit."},{"label":"B","text":"The date of the auditor’s report should not be earlier than the date on which the financial statements are signed or approved by management."},{"label":"C","text":"The date of the auditor’s report should not be later than the date on which the financial statements are signed or approved by management."},{"label":"D","text":"The date of the auditor’s report should always be later than the date of the financial statements (i.e., the balance sheet date)."}],"ans":"C","explanation":"The auditor's report date is dated on or after (NOT earlier than) the date the FS are approved by management. Thus C is false."},{"id":"AT10012_Q13","n":13,"stem":"An independent auditor discovers that a payroll supervisor of the company being audited has misappropriated P50,000. The company’s total assets and income before tax are P70 million and P15 million, respectively. Assuming no other issues affect the report, the auditor’s report will most likely contain a/an","opts":[{"label":"A","text":"Unmodified opinion"},{"label":"B","text":"Disclaimer of opinion"},{"label":"C","text":"Adverse opinion"},{"label":"D","text":"Scope qualification"}],"ans":"A","explanation":"P50,000 is clearly immaterial in relation to P70 million assets and P15 million income; hence an unmodified opinion is appropriate."},{"id":"AT10012_Q14","n":14,"stem":"A note to the financial statements of the Prudent Bank indicates that all of the records relating to the bank’s business operations are stored on magnetic disks, and that no emergency backup systems or duplicate disks are stored because the bank and its auditors consider the occurrence of a catastrophe to be remote. Based upon this note, the auditor’s report should express","opts":[{"label":"A","text":"A qualified opinion"},{"label":"B","text":"An unmodified opinion"},{"label":"C","text":"An adverse opinion"},{"label":"D","text":"A “subject to” opinion"}],"ans":"B","explanation":"The absence of backup is an operational/internal control vulnerability properly disclosed in notes; it is not a material misstatement of FS numbers, so unmodified opinion applies."},{"id":"AT10012_Q15","n":15,"stem":"Which of the following terms is used in the standard to describe the effects on the financial statements of misstatements or the possible effects on the financial statements, if any, that are undetected due to an inability to obtain sufficient appropriate audit evidence?","opts":[{"label":"A","text":"Persuasive"},{"label":"B","text":"Pervasive"},{"label":"C","text":"Material"},{"label":"D","text":"Extensive"}],"ans":"B","explanation":"Under PSA 705, \"Pervasive\" describes misstatements that are not confined to specific elements, represent a substantial proportion, or are fundamental to user understanding."},{"id":"AT10012_Q16","n":16,"stem":"A limitation on the scope of the audit may arise from\nI. Circumstances beyond the control of the entity.\nII. Circumstances relating to the nature and timing of the auditor’s work.\nIII. Limitations imposed by management.","opts":[{"label":"A","text":"I and II only"},{"label":"B","text":"II and III only"},{"label":"C","text":"I and III only"},{"label":"D","text":"I, II, and III"}],"ans":"D","explanation":"Scope limitations arise from external circumstances, timing of appointment, or management restrictions."},{"id":"AT10012_Q17","n":17,"stem":"An auditor may express a qualified opinion under which of the following circumstances?\nLack of sufficient appropriate evidence | Restriction on the scope of the audit","opts":[{"label":"A","text":"No | No"},{"label":"B","text":"No | Yes"},{"label":"C","text":"Yes | No"},{"label":"D","text":"Yes | Yes"}],"ans":"D","explanation":"A qualified opinion can result from either lack of sufficient evidence or scope restrictions (material but not pervasive)."},{"id":"AT10012_Q18","n":18,"stem":"Which of the following should be included in the Qualified Opinion section when an auditor expresses a qualified opinion?\nWhen read in conjunction with Note X | With the foregoing explanation","opts":[{"label":"A","text":"Yes | No"},{"label":"B","text":"No | Yes"},{"label":"C","text":"No | No"},{"label":"D","text":"Yes | Yes"}],"ans":"C","explanation":"Phrases like \"when read in conjunction with Note X\" or \"with the foregoing explanation\" are vague and prohibited; the required phrase is \"except for the effects of the matter(s)...\"."},{"id":"AT10012_Q19","n":19,"stem":"In which of the following situations would an auditor ordinarily choose between expressing a qualified opinion or an adverse opinion?","opts":[{"label":"A","text":"The auditor wishes to emphasize an unusually important subsequent event."},{"label":"B","text":"The financial statements fail to disclose information that is required by Philippine Financial Reporting Standards."},{"label":"C","text":"Events disclosed in the financial statements cause the auditor to have substantial doubt about the entity’s ability to continue as a going concern."},{"label":"D","text":"The auditor did not observe the entity’s physical inventory and is unable to become satisfied as to its balance by other auditing procedures."}],"ans":"B","explanation":"Inadequate disclosure is a departure from PFRS, leading to a choice between qualified (material not pervasive) or adverse (material and pervasive)."},{"id":"AT10012_Q20","n":20,"stem":"Which of the following phrases would an auditor most likely include in the auditor’s report when expressing a qualified opinion because of inadequate disclosure?","opts":[{"label":"A","text":"Do not present fairly in all material respects."},{"label":"B","text":"Except for the omission of the information included in the Basis for Qualified Opinion paragraph."},{"label":"C","text":"With the foregoing explanation of these omitted procedures."},{"label":"D","text":"Subject to the departure from generally accepted accounting principles, as described above."}],"ans":"B","explanation":"The standard wording is \"except for the omission of the information...\" described in the Basis for Qualified Opinion section."},{"id":"AT10012_Q21","n":21,"stem":"Which of the following best describes key audit matters (KAM):\nI. Those matters that, in the auditor’s professional judgment, were of most significance in the audit of the financial statements of the current period.\nII. Selected from matters communicated with those charged with governance.\nIII. A substitute for disclosure, expressing a modified opinion, material uncertainty reporting requirements (PSA 570) and includes a separate opinion for the KAM","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"I, II, and III"}],"ans":"C","explanation":"Statements I and II are true. III is false because KAM is NEVER a substitute for disclosure, modified opinion, or going concern."},{"id":"AT10012_Q22","n":22,"stem":"Which of the following statements concerning communication of key audit matters in the auditor’s report is incorrect?","opts":[{"label":"A","text":"Communicating key audit matters in the auditor’s report enhances the communicative value of the auditor’s report by providing greater transparency about the audit that was performed."},{"label":"B","text":"Communicating key audit matters provides additional information to intended users of the financial statements to assist them in understanding those matters that, in the auditor’s professional judgment, were of most significance in the audit of the financial statements of the current and prior period/s."},{"label":"C","text":"Communicating key audit matters may assist intended users in understanding the entity and areas of significant management judgment in the audited financial statements."},{"label":"D","text":"The auditor’s determination of key audit matters is limited to those matters of most significance in the audit of the financial statements of the current period, even when comparative financial statements are presented."}],"ans":"B","explanation":"KAM is determined for the CURRENT period only, not for prior periods."},{"id":"AT10012_Q23","n":23,"stem":"Communicating key audit matters in the auditor’s report is:\n• A substitute for disclosures in the financial statements.\n• A substitute for the auditor’s expression of a modified opinion.\n• A substitute for reporting in accordance with PSA 570 (Revised) when a material uncertainty exists.\n• A separate opinion on individual matters.","opts":[{"label":"A","text":"Yes | Yes | No | Yes"},{"label":"B","text":"Yes | No | Yes | Yes"},{"label":"C","text":"No | No | Yes | No"},{"label":"D","text":"No | No | No | No"}],"ans":"D","explanation":"KAM is never a substitute for disclosures, modified opinions, going concern uncertainty reporting, or separate opinions on matters."},{"id":"AT10012_Q24","n":24,"stem":"When audited financial statements are presented in a document (e.g., annual report) containing other information, the auditor","opts":[{"label":"A","text":"Should read the other information to consider whether it is inconsistent with the audited financial statements."},{"label":"B","text":"Has no responsibility for the other information because it is not part of the basic financial statements."},{"label":"C","text":"Has an obligation to perform auditing procedures to corroborate the other information."},{"label":"D","text":"Is required to express a qualified opinion if the other information has a material misstatement of fact."}],"ans":"A","explanation":"Under PSA 720, the auditor reads other information to identify material inconsistencies with the FS or auditor's knowledge."},{"id":"AT10012_Q25","n":25,"stem":"PSA 720 states, “If, on reading the other information, the auditor identifies a material inconsistency, the auditor should determine whether the audited financial statement or the other information needs to be amended”. What type of opinion should be expressed if the client refuses to make the necessary amendment in the financial statements?","opts":[{"label":"A","text":"Disclaimer of opinion"},{"label":"B","text":"Qualified opinion or disclaimer of opinion"},{"label":"C","text":"Unqualified opinion with an emphasis of matter paragraph describing the material inconsistency"},{"label":"D","text":"Qualified or adverse opinion"}],"ans":"D","explanation":"If the FS are materially misstated and management refuses to amend, the auditor expresses a qualified or adverse opinion."},{"id":"AT10012_Q26","n":26,"stem":"There are two broad financial reporting frameworks for comparatives: the corresponding figures and the comparative financial statements. Which of the following statements is correct concerning these reporting frameworks?","opts":[{"label":"A","text":"Under the corresponding figures framework, the corresponding figures for the prior period(s) are integral part of the current period financial statements."},{"label":"B","text":"Under the corresponding figures framework, the corresponding figures for the prior period(s) are considered separate financial statements."},{"label":"C","text":"Under the comparative financial statements framework, the comparative financial statements for the prior period(s) are intended to be read in conjunction with the amounts and other disclosures relating to the current period."},{"label":"D","text":"Under the comparative financial statements framework, the amounts and other disclosures for the prior period(s) form part of the current period financial statements."}],"ans":"A","explanation":"In the corresponding figures framework (standard under PFRS/PSA 710), prior period figures are an integral part of current period FS."},{"id":"AT10012_Q27","n":27,"stem":"The following statements relate to the auditor’s reporting responsibilities regarding comparatives. Which is incorrect?\nI. For corresponding figures, the auditor’s report only refers to the financial statements of the current period.\nII. For comparative financial statements, the auditor’s report refers to each period that financial statements are presented.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"Neither I nor II"}],"ans":"D","explanation":"Both statements I and II are correct; neither is incorrect."},{"id":"AT10012_Q28","n":28,"stem":"According to PSA 710, the incoming auditor may refer to the predecessor auditor’s report on the corresponding figures in the incoming auditor’s report for the current period. The incoming auditor’s report should indicate\nI. That the financial statements of the prior period were audited by another auditor.\nII. The type of report issued by the predecessor auditor.\nIII. The date of the predecessor auditor’s report.","opts":[{"label":"A","text":"I and II only."},{"label":"B","text":"II and III only."},{"label":"C","text":"I and III only."},{"label":"D","text":"I, II, and III."}],"ans":"D","explanation":"An Other Matter paragraph states that prior FS were audited by predecessor, the type of report, and date."},{"id":"AT10012_Q29","n":29,"stem":"J, CPA, audited JST Company’s prior-year financial statements. These statements are presented with those of the current year for comparative purposes without J’s auditor’s report, which expressed a qualified opinion. In drafting the current year’s auditor’s report, S, CPA, the incoming auditor, should\nI. Not name J as the predecessor auditor.\nII. Indicate the type of report issued by J.\nIII. Indicate the substantive reasons for J’s qualification.\nIV. Indicate the date of J’s auditor’s report.","opts":[{"label":"A","text":"I, II, and IV only."},{"label":"B","text":"II, III, and IV only."},{"label":"C","text":"I, II, and III only."},{"label":"D","text":"I, II, III, and IV."}],"ans":"D","explanation":"All four statements are correct under PSA 710 when referring to a predecessor auditor's report."},{"id":"AT10012_Q30","n":30,"stem":"The predecessor auditor, who is satisfied after properly communicating with the incoming auditor, has reissued his/her auditor’s report on prior year financial statements. The predecessor auditor’s report should","opts":[{"label":"A","text":"Refer to the work of the incoming auditor in the scope and opinion paragraphs"},{"label":"B","text":"Refers to the report of the incoming auditor only in the scope paragraphs"},{"label":"C","text":"Refer to both the work and the report of the incoming auditor only in the opinion paragraph"},{"label":"D","text":"Not refer to the report or the work of the incoming auditor"}],"ans":"D","explanation":"A reissued predecessor report on prior statements does not refer to the incoming auditor."},{"id":"AT10012_Q31","n":31,"stem":"Financial statements prepared in accordance with a financial reporting framework designed to meet the financial information needs of specific users are referred to as","opts":[{"label":"A","text":"Special purpose financial statements"},{"label":"B","text":"Special purpose framework"},{"label":"C","text":"General purpose financial statements"},{"label":"D","text":"Specific purpose financial statements"}],"ans":"A","explanation":"These are special purpose financial statements (PSA 800)."},{"id":"AT10012_Q32","n":32,"stem":"An auditor’s report on financial statements prepared in accordance with the financial reporting provisions of a contract (that is, a special purpose framework) to comply with the provisions of that contract should include all of the following, except","opts":[{"label":"A","text":"An opinion as to whether the financial statements are presented fairly, in all material respects, in accordance with the financial reporting provisions of the contract."},{"label":"B","text":"A statement that indicates the basis of accounting used."},{"label":"C","text":"An opinion as to whether the basis of accounting used is appropriate under the circumstances."},{"label":"D","text":"Reference to the note to the financial statements that describes the basis of presentation."}],"ans":"C","explanation":"The auditor expresses an opinion on whether the statements comply with the contract, not on whether the basis of accounting is appropriate for the contracting parties."},{"id":"AT10012_Q33","n":33,"stem":"A CPA is permitted to accept a separate engagement (not in conjunction with an audit of financial statements) to audit an entity’s:\nSchedule of Accounts Receivable | Schedule of Profit Participation","opts":[{"label":"A","text":"Yes | No"},{"label":"B","text":"No | Yes"},{"label":"C","text":"Yes | Yes"},{"label":"D","text":"Yes | No"}],"ans":"C","explanation":"Under PSA 805, an auditor may accept an audit of a single financial statement or specific element/account."},{"id":"AT10012_Q34","n":34,"stem":"An auditor may express an opinion on an entity’s accounts receivable balance even if the auditor has disclaimed an opinion on the financial statements taken as a whole provided the","opts":[{"label":"A","text":"Report on the accounts receivable is presented separately from the disclaimer of opinion on the financial statements."},{"label":"B","text":"Auditor also reports on the current asset portion of the entity’s statement of financial position."},{"label":"C","text":"Use of the report on the accounts receivable is restricted."},{"label":"D","text":"Report on the accounts receivable discloses the reason for the disclaimer of opinion on the financial statements."}],"ans":"A","explanation":"Under PSA 805, an unmodified opinion on a specific element can only be expressed if published separately from the disclaimer/adverse report."},{"id":"AT10012_Q35","n":35,"stem":"In the auditor’s report on summary financial statements that are derived from an entity’s audited financial statements, a CPA should indicate that the","opts":[{"label":"A","text":"CPA has audited and expressed an opinion on the complete financial statements."},{"label":"B","text":"CPA expresses limited assurance that the financial statements are presented in accordance with PFRS."},{"label":"C","text":"Summary financial statements are not fairly presented in all material respects."},{"label":"D","text":"Summary financial statements are prepared in accordance with special purpose financial reporting framework."}],"ans":"A","explanation":"Under PSA 810, the report states that the auditor has audited and expressed an opinion on the complete FS."},{"id":"AT10012_Q36","n":36,"stem":"The following are special purpose audit engagements, except:","opts":[{"label":"A","text":"Compilation of financial statements."},{"label":"B","text":"Audits involving statements prepared in accordance with a comprehensive basis of accounting other than generally accepted accounting principles in the Philippines."},{"label":"C","text":"Audits of specified accounts, elements of accounts, or items in a financial statement."},{"label":"D","text":"Audits of compliance with contractual agreements."}],"ans":"A","explanation":"Compilation is a non-assurance related service (PSRS 4410), not an audit engagement."},{"id":"AT10012_Q37","n":37,"stem":"Other comprehensive financial reporting frameworks may include the following, except:","opts":[{"label":"A","text":"The Philippine Financial Reporting Framework"},{"label":"B","text":"That used by an entity to prepare its income tax return"},{"label":"C","text":"The cash receipts and disbursements basis of accounting"},{"label":"D","text":"The financial reporting provisions of a government regulatory agency"}],"ans":"A","explanation":"PFRS is the general-purpose framework, not a special purpose or other comprehensive basis."},{"id":"AT10012_Q38","n":38,"stem":"RIEL Company prepared its financial statements on an accounting basis prescribed by a government agency solely for filing with that agency. The practitioner believes that the financial statements are not presented fairly in conformity with the prescribed basis. The practitioner should issue a(n)","opts":[{"label":"A","text":"Unqualified report"},{"label":"B","text":"Standard audit report"},{"label":"C","text":"Disclaimer of opinion"},{"label":"D","text":"Adverse opinion"}],"ans":"D","explanation":"If financial statements are not presented fairly in conformity with the applicable reporting basis, an adverse opinion is expressed."},{"id":"AT10012_Q39","n":39,"stem":"Audits of components of financial statements:","opts":[{"label":"A","text":"Must be undertaken as a separate, stand-alone engagement."},{"label":"B","text":"Must be performed in conjunction with an audit of the entity’s financial statements."},{"label":"C","text":"May be undertaken as a separate engagement or in conjunction with an audit of the entity’s financial statements."},{"label":"D","text":"Are not allowed since it is tantamount to expressing a piecemeal opinion on the accounts subjected to the audit."}],"ans":"C","explanation":"Audits of single FS or specific elements may be performed separately or in conjunction with the full audit."},{"id":"AT10012_Q40","n":40,"stem":"The following statements relates to audit of specific components of financial statements. Which is incorrect?","opts":[{"label":"A","text":"This type of engagement may be undertaken as a separate engagement or in conjunction with an audit of the entity’s financial statements."},{"label":"B","text":"The auditor needs to consider financial statement items that are interrelated and which could materially affect the information on which the audit opinion is to be expressed."},{"label":"C","text":"The auditor’s examination will ordinarily be less extensive than if the same component were to be audited in connection with a report on the entire financial statements."},{"label":"D","text":"When an adverse opinion or disclaimer of opinion on the entire financial statements has been expressed, the auditor may report on components of the financial statements only if those components are not so extensive as to constitute a major portion of the financial statements."}],"ans":"C","explanation":"Auditing a single component in isolation requires a MORE extensive examination than when audited as part of the whole financial statements."}]},{"id":"AT-10013","code":"AT-10013","title":"Reports – Other Assurance and Related Services","standards":"PSRE 2400 (Revised), PSRS 4400, PSRS 4410 (Revised), PSAE 3400","questionCount":20,"summary":"Review of Financial Statements (Inquiry & Analytical, Negative Assurance), Agreed-Upon Procedures (Factual Findings, Restricted Distribution), Compilation Engagements (No assurance, Management Responsibility), and Prospective Financial Information (Forecasts vs Projections).","lectureOutline":"### PSRE 2400 (REVISED): ENGAGEMENTS TO REVIEW FINANCIAL STATEMENTS\n- Objective: State whether anything has come to attention that causes the auditor to believe that FS are not prepared in all material respects in accordance with PFRS (**negative assurance**).\n- Evidence obtained primarily through **inquiry and analytical procedures**.\n- Level of assurance: **Moderate / Limited assurance**.\n- Procedures do NOT include assessing internal controls or substantive tests of details.\n\n---\n\n### PSRS 4400: AGREED-UPON PROCEDURES\n- Auditor carries out procedures of an audit nature to which the auditor, entity, and appropriate third parties have agreed.\n- Reports on **factual findings**; **no assurance** is expressed.\n- Report is **strictly restricted** to parties that agreed to the procedures.\n- **Independence is not a requirement** (must disclose if not independent).\n\n---\n\n### PSRS 4410 (REVISED): COMPILATION ENGAGEMENTS\n- Apply accounting and financial reporting expertise to assist management in preparing financial information.\n- Expresses **no audit opinion or review conclusion** (no assurance).\n- If management refuses to provide necessary information, the practitioner shall **withdraw**.\n\n---\n\n### PSAE 3400: PROSPECTIVE FINANCIAL INFORMATION\n- **Forecast:** Prepared on the basis of assumptions as to future events management expects to take place (**best-estimate assumptions**). Suitable for general use.\n- **Projection:** Prepared on the basis of **hypothetical assumptions** (or a mixture). Not suitable for general use.\n- Auditor provides only a **moderate level of assurance** regarding the reasonableness of assumptions; expresses NO opinion as to whether results will be achieved.","items":[{"id":"AT10013_Q1","n":1,"stem":"Which of the following is an objective of a review engagement?","opts":[{"label":"A","text":"Expressing a positive opinion that the financial information is presented in conformity with generally accepted accounting principles."},{"label":"B","text":"Expressing a limited assurance to users who have agreed as to procedures that will be performed by the CPA."},{"label":"C","text":"Reporting whether material modifications should be made to such financial statements to make them conform with generally accepted accounting principles."},{"label":"D","text":"Reporting that the financial statements, in all materials respects, fairly present the financial position and operating results of the client."}],"ans":"C","explanation":"A review states whether anything has come to attention indicating material modifications are needed for compliance with GAAP/PFRS."},{"id":"AT10013_Q2","n":2,"stem":"Financial statements of an entity that have been reviewed by a practitioner should be accompanied by a report stating that","opts":[{"label":"A","text":"A review provides only negative assurance that the financial statements are fairly presented."},{"label":"B","text":"A review includes examining, on a test basis, information that is the representation of management."},{"label":"C","text":"Does not contemplate obtaining corroborating evidential matter or applying certain other procedures ordinarily performed during an audit."},{"label":"D","text":"The procedures performed in a review are substantially less than those performed in an audit conducted in accordance with PSAs."}],"ans":"D","explanation":"The review report explicitly highlights that review procedures are substantially less than an audit in accordance with PSAs."},{"id":"AT10013_Q3","n":3,"stem":"A practitioner’s report on a review of the financial statements of an entity should state that the practitioner","opts":[{"label":"A","text":"Does not express an opinion or any form of limited assurance on the financial statements."},{"label":"B","text":"Obtained reasonable assurance about whether the financial statements are free of material misstatements."},{"label":"C","text":"Examined evidence, on a test basis, supporting the amounts and disclosures in the financial statements."},{"label":"D","text":"Conducted the review in accordance with the Philippine Standard on Review Engagements."}],"ans":"D","explanation":"The report states that the review was conducted in accordance with PSRE."},{"id":"AT10013_Q4","n":4,"stem":"Financial statements of an entity that have been reviewed by a practitioner should be accompanied by a report stating that","opts":[{"label":"A","text":"The scope of the inquiry and analytical procedures performed by the practitioner has not been restricted."},{"label":"B","text":"Management is responsible for the preparation and fair presentation of the entity’s financial statements."},{"label":"C","text":"A review includes examining, on a test basis, evidence supporting the amounts and disclosures in the financial statements."},{"label":"D","text":"A review is greater in scope than a compilation, the objective of which is to present financial statements that are free of material misstatements."}],"ans":"B","explanation":"The review report explicitly contains a section stating management's responsibility for the financial statements."},{"id":"AT10013_Q5","n":5,"stem":"A practitioner who reviews the financial statements of an entity should issue a report stating that a review","opts":[{"label":"A","text":"Provides negative assurance that internal control is functioning as designed."},{"label":"B","text":"Provides only limited assurance that the financial statements are fairly presented."},{"label":"C","text":"Is substantially more in scope than a compilation."},{"label":"D","text":"Is a limited assurance engagement."}],"ans":"D","explanation":"Under PSRE 2400 (Revised), the report states that a review of financial statements is a limited assurance engagement."},{"id":"AT10013_Q6","n":6,"stem":"If the practitioner determines that the financial statements are materially misstated, he/she shall express a/an","opts":[{"label":"A","text":"Unmodified conclusion."},{"label":"B","text":"Qualified conclusion when the practitioner concludes that the effects of the matter(s) giving rise to the modification are material, but not pervasive to the financial statements."},{"label":"C","text":"Adverse conclusion if the practitioner concludes that the possible effects on the financial statements could be both material and pervasive."},{"label":"D","text":"Disclaimer of conclusion when the effects of the matter giving rise to the modification are both material and pervasive to the financial statements."}],"ans":"B","explanation":"A qualified conclusion is expressed when the effects of the misstatement are material but not pervasive."},{"id":"AT10013_Q7","n":7,"stem":"What conclusion is appropriate when the practitioner has obtained limited assurance to be able to conclude that nothing has come to the practitioner’s attention that causes the practitioner to believe that the financial statements are not prepared, in all material respects, in accordance with the applicable financial reporting framework?","opts":[{"label":"A","text":"Unmodified conclusion."},{"label":"B","text":"Disclaimer of conclusion."},{"label":"C","text":"Modified conclusion."},{"label":"D","text":"Qualified conclusion."}],"ans":"A","explanation":"An unmodified conclusion expresses the negative assurance without qualification."},{"id":"AT10013_Q8","n":8,"stem":"Charlie, CPA, is performing a compilation service for Clean and Green Corporation. In the course of performing compilation procedures, Charlie became aware that some of the information provided by Clean and Green’s management are incomplete. Client management refuses to comply with Charlie’s requests for additional information. In this case, Charlie should:","opts":[{"label":"A","text":"Issue a qualified opinion on the financial statements compiled."},{"label":"B","text":"Issue an adverse opinion on the financial statements compiled."},{"label":"C","text":"Issue a disclaimer of opinion on the financial statements complied."},{"label":"D","text":"Withdraw from the engagement."}],"ans":"D","explanation":"Under PSRS 4410, if management fails to provide records or explanations requested, the accountant shall withdraw."},{"id":"AT10013_Q9","n":9,"stem":"The procedures employed in doing compilation are:","opts":[{"label":"A","text":"Designed to enable the accountant to express a limited assurance."},{"label":"B","text":"Designed to enable the accountant to express a negative assurance."},{"label":"C","text":"Not designed to enable the accountant to express any form of assurance."},{"label":"D","text":"Less extensive than review procedures but more extensive than agreed-upon procedures."}],"ans":"C","explanation":"Compilation procedures are not designed to enable the expression of any assurance."},{"id":"AT10013_Q10","n":10,"stem":"When performing a compilation engagement, the accountant is required to","opts":[{"label":"A","text":"Assess internal controls."},{"label":"B","text":"Verify matters and explanations."},{"label":"C","text":"Obtain a general knowledge of the business and operations of the entity."},{"label":"D","text":"Make inquiries of management to assess the reliability and completeness of the information provided."}],"ans":"C","explanation":"The accountant must obtain general knowledge of the business and operations."},{"id":"AT10013_Q11","n":11,"stem":"When compiling the financial statements of an entity, an accountant should","opts":[{"label":"A","text":"Review agreements with financial institutions for restrictions on cash balances."},{"label":"B","text":"Understand the accounting principles and practices of the entity’s industry."},{"label":"C","text":"Inquire of key personnel concerning related parties and subsequent events."},{"label":"D","text":"Perform ratio analyses of the financial data of comparable prior periods."}],"ans":"B","explanation":"The accountant must understand the accounting principles and practices of the industry."},{"id":"AT10013_Q12","n":12,"stem":"When compiling an entity’s financial statements, an accountant would be least likely to","opts":[{"label":"A","text":"Perform analytical procedures designed to identify relationships that appear to be unusual."},{"label":"B","text":"Read the compiled financial statements and consider whether they appear to include adequate disclosure."},{"label":"C","text":"Obtain an acknowledgment from management of its responsibility for the financial statements."},{"label":"D","text":"Plan the work so that an effective engagement will be performed."}],"ans":"A","explanation":"Analytical procedures to identify unusual relationships are characteristic of a review, not a compilation."},{"id":"AT10013_Q13","n":13,"stem":"Which of the following should not be included in an accountant’s report based upon the compilation of an entity’s financial statements?","opts":[{"label":"A","text":"A statement that a compilation of the company’s financial statements was made in accordance with the Philippine Standard on Related Services 4410 (Revised), Compilation Engagements."},{"label":"B","text":"A statement that the financial statements and the accuracy and completeness of the information used to compile them are management’s responsibility."},{"label":"C","text":"A statement that a compilation engagement is an assurance engagement."},{"label":"D","text":"A statement that the accountant does not express an audit opinion or a review conclusion."}],"ans":"C","explanation":"A compilation is expressly NOT an assurance engagement."},{"id":"AT10013_Q14","n":14,"stem":"Negative assurance may be expressed when an accountant is requested to report agreed-upon procedures to specified:\nElement of a Financial Statement | Accounts of a Financial Statement","opts":[{"label":"A","text":"Yes | Yes"},{"label":"B","text":"Yes | No"},{"label":"C","text":"No | No"},{"label":"D","text":"No | Yes"}],"ans":"C","explanation":"In agreed-upon procedures, NO assurance (positive or negative) is ever expressed; only factual findings are reported."},{"id":"AT10013_Q15","n":15,"stem":"An accountant may accept an engagement to apply agreed-upon procedures that are not sufficient to express an opinion on one or more specified accounts or items of a financial statement provided that","opts":[{"label":"A","text":"The accountant’s report does not enumerate the procedures performed."},{"label":"B","text":"The financial statements are prepared in accordance with a comprehensive basis of accounting other than generally accepted accounting principles."},{"label":"C","text":"Distribution of the accountant’s report is restricted."},{"label":"D","text":"The accountant is also the entity’s continuing auditor."}],"ans":"C","explanation":"AUP reports are strictly restricted to the specified parties who agreed to the procedures."},{"id":"AT10013_Q16","n":16,"stem":"Given one or more hypothetical assumptions, a responsible party may prepare, to the best of its knowledge and belief, an entity’s expected financial position, results of operations, and cash flows. Such prospective financial statements are known as","opts":[{"label":"A","text":"Pro forma financial statements."},{"label":"B","text":"Financial projections."},{"label":"C","text":"Partial presentations."},{"label":"D","text":"Financial forecasts."}],"ans":"B","explanation":"Prospective statements based on hypothetical assumptions are called financial projections."},{"id":"AT10013_Q17","n":17,"stem":"A financial forecast consists of prospective financial statements that present an entity’s expected financial position, results of operations, and cash flows. A forecast","opts":[{"label":"A","text":"Is based on the most conservative estimates."},{"label":"B","text":"Present estimates given one or more hypothetical assumptions."},{"label":"C","text":"Unlike a projection, may contain a range."},{"label":"D","text":"Is based on assumptions reflecting conditions expected to exist and courses of action expected to be taken."}],"ans":"D","explanation":"A forecast reflects management's best-estimate assumptions of expected future conditions."},{"id":"AT10013_Q18","n":18,"stem":"When an accountant examines prospective financial statements, the accountant’s report should include a separate paragraph that","opts":[{"label":"A","text":"Contains an opinion as to whether the prospective financial statements are properly prepared on the basis of the assumptions and are presented in accordance with generally accepted accounting principles in the Philippines."},{"label":"B","text":"Provides an explanation of the differences between an examination and an audit."},{"label":"C","text":"States that the accountant is responsible for events and circumstances up to 1 year after the report’s date."},{"label":"D","text":"Disclaims an opinion on whether the assumptions provide a reasonable basis for the prospective financial statements."}],"ans":"A","explanation":"The report gives an opinion on whether the statements are properly prepared on the basis of assumptions and presented in accordance with PFRS."},{"id":"AT10013_Q19","n":19,"stem":"The following statements relate to the examination of prospective financial information. Which is false?","opts":[{"label":"A","text":"The auditor should express an opinion as to whether the results shown in the prospective financial information will be achieved."},{"label":"B","text":"Before accepting an engagement to examine prospective financial information, the auditor should consider the intended use of the information."},{"label":"C","text":"The auditor should not accept, or should withdraw from, an engagement to examine prospective financial information when the assumptions are clearly unrealistic."},{"label":"D","text":"When in the auditor’s judgment an appropriate level of satisfaction has been obtained, the auditor is not precluded from expressing positive assurance regarding the assumptions."}],"ans":"A","explanation":"The auditor does NOT express any opinion on whether prospective results will be achieved."},{"id":"AT10013_Q20","n":20,"stem":"Which of the following is a prospective financial information for general use upon which an accountant may appropriately report?","opts":[{"label":"A","text":"Financial projection"},{"label":"B","text":"Partial presentation"},{"label":"C","text":"Pro forma financial statement"},{"label":"D","text":"Financial forecast"}],"ans":"D","explanation":"A financial forecast (based on best estimates) is appropriate for general use, unlike a projection (based on hypothetical assumptions)."}]},{"id":"AT-10014","code":"AT-10014","title":"Philippine Accountancy Act of 2004 / IRR (RA 9298)","standards":"RA 9298 and its Implementing Rules and Regulations (IRR)","questionCount":26,"summary":"Scope of Accountancy Practice (Public Practice, Commerce & Industry, Academe, Government), Composition and Qualifications of Board of Accountancy (BOA), Term of Office, Licensure Examination, CPA Seal, Ownership of Working Papers, Penal Provisions, and Renewal of Registration.","lectureOutline":"### REPUBLIC ACT NO. 9298: PHILIPPINE ACCOUNTANCY ACT OF 2004\nAn act regulating the practice of accountancy in the Philippines, repealing PD 692.\n\n#### Scope of Practice (4 Sectors)\n1. **Practice of Public Accountancy:** Offering skilled accounting/audit services to more than one client on a fee basis.\n2. **Practice in Commerce and Industry:** Involved in decision-making requiring professional knowledge in the science of accounting, or where position requires supervising financial records in companies with paid-up capital of at least **P5,000,000** and/or annual revenue of at least **P10,000,000**.\n3. **Practice in Education / Academe:** Teaching accounting, auditing, management services, taxation, business law. Dean/chair must be a registered CPA.\n4. **Practice in the Government:** Appointed to an accounting professional group in government where decision-making requires CPA knowledge.\n\n---\n\n### PROFESSIONAL REGULATORY BOARD OF ACCOUNTANCY (BOA)\n- **Composition:** 1 Chairman and 6 Members (Total = 7), appointed by the President of the Philippines from a list of 3 rank-and-file nominees for each position submitted by the PRC from 5 nominees submitted by the Accredited National Professional Organization of CPAs (APO / PICPA).\n- **Qualifications:** Natural-born citizen, resident of the Philippines, duly registered CPA with at least 10 years of work experience in any scope of practice of accountancy, good moral character, not convicted of crimes of moral turpitude, no direct/indirect pecuniary interest in review schools/universities, not an officer/director of APO at appointment.\n- **Term of Office:** 3 years. No member shall serve more than 2 consecutive complete terms (must lapse 2 years before eligible for reappointment).\n- **Ratings Submission:** BOA submits ratings to PRC within **10 calendar days** after examination.\n\n---\n\n### OWNERSHIP OF WORKING PAPERS & SEAL\n- **Ownership:** All working papers prepared by a CPA remain the property of the CPA, unless a written agreement to the contrary exists. They are confidential and privileged.\n- **CPA Seal:** Circular in form with smaller circle within. Engraved in the middle of the smaller circle are the letters **\"CPA\"**.","items":[{"id":"AT10014_Q1","n":1,"stem":"Republic Act 9298 is known as the","opts":[{"label":"A","text":"Revised Accountancy Law."},{"label":"B","text":"Code of Ethics for Professional Accountants."},{"label":"C","text":"Philippine Accountancy Act of 2004."},{"label":"D","text":"Philippine Accountancy Law of 2004."}],"ans":"C","explanation":"RA 9298 is titled the \"Philippine Accountancy Act of 2004\"."},{"id":"AT10014_Q2","n":2,"stem":"Which of the following is not an objective of the Philippine Accountancy Act of 2004?","opts":[{"label":"A","text":"The standardization and regulation of accounting education."},{"label":"B","text":"The examination for registration of certified public accountants."},{"label":"C","text":"The supervision, control, and regulation of the practice of accountancy in the Philippines."},{"label":"D","text":"The development and improvement of accounting standards that will be generally accepted in the Philippines."}],"ans":"D","explanation":"Development of accounting standards is handled by the FRSC, not a direct statutory objective of RA 9298."},{"id":"AT10014_Q3","n":3,"stem":"The practice of Accountancy includes:\nI. Practice of Public Accountancy\nII. Practice in Commerce and Industry\nIII. Practice in Education/Academe\nIV. Practice in the Government","opts":[{"label":"A","text":"I, II, and IV only"},{"label":"B","text":"II, III, and IV only"},{"label":"C","text":"I, II, and III only"},{"label":"D","text":"I, II, III, and IV"}],"ans":"D","explanation":"Section 4 covers all four sectors of accountancy practice."},{"id":"AT10014_Q4","n":4,"stem":"A CPA is in public accounting practice when he/she","opts":[{"label":"A","text":"Represents his/her employer before government agencies on tax and other matters related to accounting."},{"label":"B","text":"Represents his/her clients before government agencies on tax and other matters related to accounting."},{"label":"C","text":"Teaches accounting, auditing, management advisory services, accounting aspect of finance, business law, taxation, and other technically related subjects."},{"label":"D","text":"Holds, or is appointed to a position, in an accounting professional group in government or in a government-owned and/or controlled corporation where decision making requires professional knowledge in the science of accounting."}],"ans":"B","explanation":"Serving \"clients\" on a fee basis distinguishes public practice from private employment."},{"id":"AT10014_Q5","n":5,"stem":"Section 4 of the Rules and Regulations Implementing RA 9298 (IRR) provides that any position in any business or company in the private sector which requires supervising the recording of financial transactions, preparation of financial statements, coordinating with the external auditors for the audit of such financial statements, and other related functions should be occupied by a duly registered CPA. It provides further that","opts":[{"label":"A","text":"The business or company where such position exists has a paid-up capital of at least P5,000,000 and/or annual revenue of at least P10,000,000."},{"label":"B","text":"The business or company where such position exists has a paid-up capital of at least P10,000,000 and/or annual revenue of at least P5,000,000."},{"label":"C","text":"The section applies to all incumbents to the position."},{"label":"D","text":"The section applies only to persons to be employed after the effectivity of the Code of Ethics for Professional Accountants in the Philippines."}],"ans":"A","explanation":"Paid-up capital must be at least P5,000,000 and/or annual revenue of at least P10,000,000."},{"id":"AT10014_Q6","n":6,"stem":"Section 5 of the Accountancy Act of 2004 states that the Board of Accountancy shall be composed of a Chairman and","opts":[{"label":"A","text":"2 members"},{"label":"B","text":"6 members"},{"label":"C","text":"7 members"},{"label":"D","text":"8 members"}],"ans":"B","explanation":"BOA is composed of 1 Chairman and 6 members (total of 7)."},{"id":"AT10014_Q7","n":7,"stem":"The members of the Professional Regulatory Board of Accountancy shall be appointed by the","opts":[{"label":"A","text":"Philippine Institute of CPAs (PICPA)."},{"label":"B","text":"Professional Regulation Commission (PRC)."},{"label":"C","text":"President of the Philippines."},{"label":"D","text":"Association of CPAs in Public Practice (ACPAPP)."}],"ans":"C","explanation":"Members are appointed by the President of the Philippines."},{"id":"AT10014_Q8","n":8,"stem":"Who has the power to suspend or remove any member of the Board of Accountancy?","opts":[{"label":"A","text":"The Chairman of the FRSC"},{"label":"B","text":"The Chairman of the PRC"},{"label":"C","text":"The Chairman of the AASC"},{"label":"D","text":"The President of the Philippines"}],"ans":"D","explanation":"The President of the Philippines upon recommendation of PRC has power of removal."},{"id":"AT10014_Q9","n":9,"stem":"The following statements relate to the submission of nominations to the Board of Accountancy. Which is correct?","opts":[{"label":"A","text":"The Accredited National Professional Organization of CPAs (APO) shall submit its nominations to the president of the Philippines not later than sixty (60) days prior to the expiry of the term of an incumbent chairman or member."},{"label":"B","text":"The APO shall submit its nominations to the PRC not later than thirty (30) days prior to the expiry of the term of an incumbent chairman or member."},{"label":"C","text":"If the APO fails to submit its own nominee(s) to the PRC within the required period, the PRC in consultation with the Board of Accountancy shall submit to the president of the Philippines a list of five (5) nominees for each position."},{"label":"D","text":"There should be adequate documentation to show the qualifications and primary field of professional activity of each nominee."}],"ans":"D","explanation":"Documentation showing qualifications and primary field of activity must accompany each nomination."},{"id":"AT10014_Q10","n":10,"stem":"The following statements relate to the qualifications of a member of the Board of Accountancy. Which is incorrect?","opts":[{"label":"A","text":"He/she must be of good moral character and must not have been convicted of crimes involving moral turpitude."},{"label":"B","text":"He/she must be a duly registered CPA with at least ten (10) years of work experience in the practice of public accounting."},{"label":"C","text":"He/she must be a natural-born citizen and a resident of the Philippines."},{"label":"D","text":"He/she must not be a director or officer of the APO at the time of his/her appointment."}],"ans":"B","explanation":"Experience must be in ANY field of accountancy, not restricted solely to public accounting."},{"id":"AT10014_Q11","n":11,"stem":"The following statements relate to the term of office of the chairman and members of the Board of Accountancy (BOA). Which is false?","opts":[{"label":"A","text":"The Chairman and members of the BOA shall hold office for a term of three (3) years."},{"label":"B","text":"Any vacancy occurring within the term of a member shall be filled up for the unexpired portion of the term only."},{"label":"C","text":"No person who has served two successive complete terms as Chairman or member shall be eligible for reappointment until the lapse of two (2) years."},{"label":"D","text":"Appointment to fill up an unexpired term is not to be considered as a complete term."}],"ans":"C","explanation":"Under RA 9298, no person who has served two successive complete terms shall be eligible for reappointment until the lapse of ONE (1) year (not 2 years)."},{"id":"AT10014_Q12","n":12,"stem":"Which of the following is a function of the Board of Accountancy?\nI. To prescribe and adopt the rules and regulations necessary for carrying out the provisions of the Philippine Accountancy Act of 2004.\nII. To supervise the regulation, licensure, and practice of accountancy in the Philippines.\nIII. To issue, suspend, revoke, or reinstate the certificate of registration for the practice of the accountancy profession.","opts":[{"label":"A","text":"I and II only"},{"label":"B","text":"II and III only"},{"label":"C","text":"I and III only"},{"label":"D","text":"I, II, and III"}],"ans":"D","explanation":"All listed duties are core functions of the Board of Accountancy under RA 9298."},{"id":"AT10014_Q13","n":13,"stem":"The Board of Accountancy has the power to conduct an oversight into the quality of audits of financial statements through a review of the quality control measures instituted by auditors in order to ensure compliance with the accounting and auditing standards and practices. This power of the BOA is called","opts":[{"label":"A","text":"Quality assurance review"},{"label":"B","text":"Peer review"},{"label":"C","text":"Appraisal"},{"label":"D","text":"Quality control"}],"ans":"A","explanation":"This oversight function is officially known as Quality Assurance Review (QAR)."},{"id":"AT10014_Q14","n":14,"stem":"The Board of Accountancy shall submit to the PRC the ratings obtained by each candidate within _____ days after the examination, unless extended for just cause.","opts":[{"label":"A","text":"10"},{"label":"B","text":"5"},{"label":"C","text":"3"},{"label":"D","text":"2"}],"ans":"A","explanation":"Section 19 specifies that ratings must be submitted within 10 calendar days."},{"id":"AT10014_Q15","n":15,"stem":"Which of the following shall be issued to examinees who pass the CPA licensure examination?","opts":[{"label":"A","text":"Certificate of registration only."},{"label":"B","text":"Professional identification card only."},{"label":"C","text":"Certificate of registration and professional identification card."},{"label":"D","text":"Certificate of participation and professional identification card."}],"ans":"C","explanation":"Successful examinees receive both a Certificate of Registration and a Professional Identification Card."},{"id":"AT10014_Q16","n":16,"stem":"Which of the following statements concerning the issuance of Certificates of Registration and Professional Identification Cards to successful examinees is correct?","opts":[{"label":"A","text":"The Certificate of Registration issued to successful examinees is renewable every three (3) years."},{"label":"B","text":"The Professional Identification Card issued to successful examinees shall remain in full force and effect until withdrawn, suspended or revoked in accordance with RA 9298."},{"label":"C","text":"The BOA shall not r
