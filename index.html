n\"."},{"id":"AT10002_Q22","n":22,"stem":"For audits of financial statements of listed entities, the engagement partner should not issue the auditor’s report until the completion of the","opts":[{"label":"A","text":"Management Review"},{"label":"B","text":"Engagement Team Review"},{"label":"C","text":"Engagement Partner Review"},{"label":"D","text":"Engagement Quality Review"}],"ans":"D","explanation":"Under PSQM 2 and PSA 220, the auditor's report cannot be dated or issued until the Engagement Quality Review is completed."},{"id":"AT10002_Q23","n":23,"stem":"A process comprising an ongoing consideration and evaluation of the firm’s system of quality management including a periodic inspection of a selection of completed engagements designed to provide the firm with reasonable assurance that its system of quality management is operating effectively refers to what quality management element?","opts":[{"label":"A","text":"Internal control."},{"label":"B","text":"Acceptance and continuance of client relationships and specific engagements."},{"label":"C","text":"Monitoring."},{"label":"D","text":"Human resources."}],"ans":"C","explanation":"Ongoing consideration, evaluation, and periodic inspection of completed engagements constitutes Monitoring."},{"id":"AT10002_Q24","n":24,"stem":"Which component of a system of quality management is addressed by the establishment of policies and procedures designed to provide the firm with reasonable assurance that it has sufficient personnel with the competence, capabilities, and commitment to ethical principles?","opts":[{"label":"A","text":"Information and communication"},{"label":"B","text":"Governance and leadership"},{"label":"C","text":"Human resources"},{"label":"D","text":"Engagement performance"}],"ans":"C","explanation":"Assuring sufficient personnel with competence and ethical commitment falls under Human Resources."},{"id":"AT10002_Q25","n":25,"stem":"The following are essential components of a system of quality management except","opts":[{"label":"A","text":"Policies and procedures that ensure that monitoring activities are effectively applied."},{"label":"B","text":"Policies and procedures to ensure that firm personnel are actively engaged in marketing strategies."},{"label":"C","text":"Policies and procedures to ensure that the work performed by firm personnel meet applicable professional standards."},{"label":"D","text":"Policies to ensure that personnel maintain their independence when performing assurance services."}],"ans":"B","explanation":"Marketing strategies are not a component of quality management; in fact, commercial considerations must not override audit quality."},{"id":"AT10002_Q26","n":26,"stem":"An audit firm should implement quality management policies and procedures designed to ensure that all audits are conducted in accordance with PSAs or relevant national standards or practices. These policies and procedures should be implemented","opts":[{"label":"A","text":"At the audit firm level only."},{"label":"B","text":"On individual audits only."},{"label":"C","text":"Either at the audit firm level or on individual audits."},{"label":"D","text":"Both at the audit firm level and on individual audits."}],"ans":"D","explanation":"Quality management operates at both the firm level (PSQM 1) and on individual engagements (PSA 220)."},{"id":"AT10002_Q27","n":27,"stem":"Who should take responsibility for the overall quality on each audit engagement?","opts":[{"label":"A","text":"Engagement partner"},{"label":"B","text":"Engagement team"},{"label":"C","text":"CPA firm"},{"label":"D","text":"Engagement quality reviewer"}],"ans":"A","explanation":"Under PSA 220, the engagement partner takes overall responsibility for quality on each audit engagement."},{"id":"AT10002_Q28","n":28,"stem":"The engagement partner should be satisfied that appropriate procedures regarding the acceptance and continuance of client relationships and specific audit engagements have been followed, and that conclusions reached in this regard are appropriate and have been documented. Acceptance and continuance of client relationships and specific audit engagements include considering:\nI. The integrity of the principal owners, key management, and those charged with governance of the entity.\nII. Whether the engagement team is competent to perform the audit engagement and has the necessary time and resources.\nIII. Whether the firm and the engagement team can comply with ethical requirements.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"I and II only"},{"label":"C","text":"II and III only"},{"label":"D","text":"I, II, and III"}],"ans":"D","explanation":"Acceptance/continuance requires considering client integrity, team competence/resources, and ethical compliance."},{"id":"AT10002_Q29","n":29,"stem":"For audits of financial statements of listed entities, the engagement partner should\nA. Determine that an engagement quality reviewer has been appointed.\nB. Discuss significant matters arising during the audit engagement, including those identified during the engagement quality review, with the engagement quality reviewer.\nC. Not issue the auditor’s report until the completion of the engagement quality review.\nD. All of the above","opts":[{"label":"A","text":"Determine that an engagement quality reviewer has been appointed."},{"label":"B","text":"Discuss significant matters arising during the audit engagement, including those identified during the engagement quality review, with the engagement quality reviewer."},{"label":"C","text":"Not issue the auditor’s report until the completion of the engagement quality review."},{"label":"D","text":"All of the above"}],"ans":"D","explanation":"All of the listed duties are required of the engagement partner when an EQR is conducted."},{"id":"AT10002_Q30","n":30,"stem":"Typically, an external auditor first gets supervisory experience at what level of authority?","opts":[{"label":"A","text":"Senior."},{"label":"B","text":"Supervisor."},{"label":"C","text":"Manager"},{"label":"D","text":"Partner"}],"ans":"A","explanation":"External auditors typically first gain supervisory experience as a Senior auditor overseeing assistants."},{"id":"AT10002_Q31","n":31,"stem":"The audit work performed by each assistant should be reviewed by personnel of at least equal competence to determine whether it was adequately performed and to evaluate whether the","opts":[{"label":"A","text":"Firm’s system of quality management has been maintained at a high level."},{"label":"B","text":"Work performed and the results obtained have been adequately documented."},{"label":"C","text":"Audit procedures performed are approved in the professional standards."},{"label":"D","text":"Audit procedures performed are in accordance with Philippine Standards on Auditing (PSAs)."}],"ans":"D","explanation":"Work is reviewed to evaluate whether procedures performed and evidence obtained are in accordance with PSAs."},{"id":"AT10002_Q32","n":32,"stem":"Which of the following quality objectives addresses the engagement performance component of a system of quality management?","opts":[{"label":"A","text":"Consultation on difficult or contentious matters is undertaken and the conclusions agreed are implemented."},{"label":"B","text":"Personnel are hired, developed and retained and have the competence and capabilities to consistently perform quality engagements."},{"label":"C","text":"Appropriate technological resources are obtained or developed, implemented, maintained, and used, to enable the operation of the firm’s system of quality management and the performance of engagements."},{"label":"D","text":"The culture of the firm recognizes and reinforces the responsibility of personnel to exchange information with the firm and with one another."}],"ans":"A","explanation":"Consultation on difficult/contentious matters is an explicit objective under Engagement Performance."},{"id":"AT10002_Q33","n":33,"stem":"A firm’s system of quality management should ordinarily provide for the maintenance of","opts":[{"label":"A","text":"A file of minutes of staff meetings."},{"label":"B","text":"Updated personnel files."},{"label":"C","text":"Documentation of its system of quality management that is sufficient to support a consistent understanding of the system of quality management by personnel."},{"label":"D","text":"Documentation to demonstrate compliance with regulatory requirements."}],"ans":"C","explanation":"PSQM 1 requires documentation sufficient to support a consistent understanding and operation of the SOQM by personnel."},{"id":"AT10002_Q34","n":34,"stem":"The firm shall obtain written confirmation of compliance with its policies and procedures on independence from all firm personnel required to be independent by relevant ethical requirements","opts":[{"label":"A","text":"At least annually"},{"label":"B","text":"At least monthly"},{"label":"C","text":"At least semi-annually"},{"label":"D","text":"At the completion of each engagement"}],"ans":"A","explanation":"Written confirmation of independence compliance must be obtained at least annually."},{"id":"AT10002_Q35","n":35,"stem":"Under PSQM 1, an appropriate time limit within which to complete the assembly of the final engagement file is ordinarily _______________ after the date of the engagement report.","opts":[{"label":"A","text":"not more than 60 days"},{"label":"B","text":"not more than 30 days"},{"label":"C","text":"not more than 10 days"},{"label":"D","text":"not more than 5 days."}],"ans":"A","explanation":"Under PSQM 1 and PSA 230, the time limit for final assembly of the audit file is ordinarily not more than 60 days after the report date."}]},{"id":"AT-10003","code":"AT-10003","title":"Agreeing the Terms of Audit Engagements (PSA 210)","standards":"PSA 210","questionCount":15,"summary":"Preconditions for an Audit, Engagement Letters (Scope, Responsibilities, Framework, Report Form), Recurring Audits, Communications with Predecessor Auditor, and Acceptance of a Change in Engagement.","lectureOutline":"### AGREEING THE TERMS OF AUDIT ENGAGEMENTS (PSA 210)\n\n#### Objective of the Auditor\nTo accept or continue an audit engagement only when the basis upon which it is to be performed has been agreed, through:\na) Establishing whether the preconditions for an audit are present; and\nb) Confirming that there is a common understanding between the auditor and management (and where appropriate, TCWG) of the terms.\n\n#### Preconditions for an Audit\na) The use by management of an acceptable financial reporting framework in the preparation of the financial statements; and\nb) The agreement of management and, where appropriate, TCWG to the premise on which an audit is conducted (acknowledging responsibilities for FS preparation, internal control, and providing unrestricted access and information).\n\n---\n\n### AUDIT ENGAGEMENT LETTERS\nThe agreed terms shall be recorded in an audit engagement letter or other suitable form of written agreement and shall include:\n1. The objective and scope of the audit of the financial statements;\n2. The responsibilities of the auditor;\n3. The responsibilities of management;\n4. Identification of the applicable financial reporting framework; and\n5. Reference to the expected form and content of any reports to be issued and a statement that there may be circumstances in which a report may differ from its expected form and content.\n\n---\n\n### ACCEPTANCE OF A CHANGE IN ENGAGEMENT\n1. An auditor requested to change the engagement to one providing a lower level of assurance should consider the appropriateness of doing so.\n2. A request may result from:\n   - A change in circumstances affecting the need for the service (reasonable);\n   - A misunderstanding as to the nature of an audit originally requested (reasonable); or\n   - A restriction on the scope of the engagement (not reasonable if related to incorrect/incomplete information).\n3. The auditor should NOT agree to a change where there is NO reasonable justification.\n4. If changed, the report would NOT include reference to the original engagement or any procedures performed in it (except for agreed-upon procedures).\n5. If unable to agree to a change and not permitted to continue the original engagement, the auditor should **withdraw** and consider reporting obligations.","items":[{"id":"AT10003_Q1","n":1,"stem":"The auditor may accept or continue an audit engagement only when the basis upon which it is to be performed has been agreed, through\nI. Establishing whether the preconditions for an audit are present.\nII. Confirming that there is a common understanding between the auditor and management and, where appropriate, those charged with governance of the terms of the audit engagement.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"Under PSA 210, both preconditions and common understanding of terms are required."},{"id":"AT10003_Q2","n":2,"stem":"Before accepting an engagement to audit a new client, a CPA is required to obtain:","opts":[{"label":"A","text":"An understanding of the prospective client's industry and business."},{"label":"B","text":"The prospective client's signature to the representation letter."},{"label":"C","text":"A preliminary understanding of the prospective client's control environment."},{"label":"D","text":"The prospective client's consent to make inquiries of the predecessor auditor, if any."}],"ans":"D","explanation":"Code of Ethics and auditing standards require obtaining client consent prior to communicating with the predecessor auditor."},{"id":"AT10003_Q3","n":3,"stem":"Which of the following is not correct regarding the communications between successor and predecessor auditors?","opts":[{"label":"A","text":"The burden of initiating the communication rests with the predecessor auditor."},{"label":"B","text":"The burden of initiating the communication rests with the successor auditor."},{"label":"C","text":"The predecessor auditor must receive their former client’s permission prior to divulging information to the successor auditor."},{"label":"D","text":"The predecessor auditor may choose to provide a limited response to a successor auditor."}],"ans":"A","explanation":"The initiative rests with the successor auditor, not the predecessor."},{"id":"AT10003_Q4","n":4,"stem":"Before accepting an audit engagement, a successor auditor should make specific inquiries of the predecessor auditor regarding:","opts":[{"label":"A","text":"The predecessor’s evaluation of matters of continuing accounting significance"},{"label":"B","text":"Disagreement which the predecessor had with the client concerning auditing procedures and accounting principles"},{"label":"C","text":"The degree of cooperation the predecessor received concerning the inquiry of the client’s legal counsel"},{"label":"D","text":"The predecessor’s assessment of inherent risk and judgments about materiality"}],"ans":"B","explanation":"Specific inquiries include disagreements regarding principles/procedures, management integrity, reasons for change, and related party/fraud matters."},{"id":"AT10003_Q5","n":5,"stem":"Which of the following auditor concerns most likely could be so serious that the auditor concludes that a financial statement audit cannot be performed?","opts":[{"label":"A","text":"Management fails to modify prescribed internal controls for changes in information technology."},{"label":"B","text":"Internal control activities requiring segregation of duties are rarely monitored by management."},{"label":"C","text":"Management is dominated by one person who is also the majority stockholder."},{"label":"D","text":"There is a substantial risk of intentional misapplication of accounting principles."}],"ans":"D","explanation":"Substantial risk of intentional misapplication of principles reflects severe management dishonesty such that an audit cannot be performed."},{"id":"AT10003_Q6","n":6,"stem":"The scope and nature of an auditor’s contractual obligation to a client is ordinarily set forth in the","opts":[{"label":"A","text":"Management representation letter."},{"label":"B","text":"Opinion section of the auditor’s report."},{"label":"C","text":"Engagement letter."},{"label":"D","text":"Basis for Opinion section of the auditor’s report."}],"ans":"C","explanation":"The engagement letter documents the contract between the auditor and the client."},{"id":"AT10003_Q7","n":7,"stem":"An auditor is required to establish an understanding in writing with a client regarding the services to be performed for each engagement. This understanding generally includes","opts":[{"label":"A","text":"Management’s responsibility for errors and the illegal activities of employees that may cause material misstatement."},{"label":"B","text":"The auditor’s responsibility for ensuring that those charged with governance are aware of any significant deficiencies or material weaknesses in internal control that come to the auditor’s attention."},{"label":"C","text":"Management’s responsibility for providing the auditor with an assessment of the risk of material misstatement due to fraud."},{"label":"D","text":"The auditor’s responsibility for determining preliminary judgments about materiality and audit risk factors."}],"ans":"B","explanation":"The auditor ensures TCWG are communicated significant deficiencies in internal control coming to the auditor's attention."},{"id":"AT10003_Q8","n":8,"stem":"The engagement letter documents and confirms the:\nAuditor’s acceptance of appointment | Objective and scope of audit | Extent of auditor’s responsibilities | Form of any reports","opts":[{"label":"A","text":"Yes | Yes | No | Yes"},{"label":"B","text":"Yes | No | Yes | No"},{"label":"C","text":"Yes | Yes | No | No"},{"label":"D","text":"Yes | Yes | Yes | Yes"}],"ans":"D","explanation":"The engagement letter covers appointment acceptance, scope/objectives, responsibilities, and expected form of reports."},{"id":"AT10003_Q9","n":9,"stem":"An engagement letter should ordinarily include information on the objectives of the engagement and:\nAuditor’s Responsibilities | Management’s Responsibilities | Limitation of Engagement","opts":[{"label":"A","text":"Yes | Yes | No"},{"label":"B","text":"No | No | No"},{"label":"C","text":"Yes | No | Yes"},{"label":"D","text":"Yes | Yes | Yes"}],"ans":"D","explanation":"An engagement letter includes auditor responsibilities, management responsibilities, and inherent limitations of the audit."},{"id":"AT10003_Q10","n":10,"stem":"Which of the following statements would least likely appear in an auditor’s engagement letter?","opts":[{"label":"A","text":"Fees for our services are based on our regular per diem rates, plus travel and other out-of-pocket expenses."},{"label":"B","text":"Management is responsible for making all financial records and related information available to us."},{"label":"C","text":"Our engagement is subject to the risk that material errors or fraud, if they exist, will not be detected."},{"label":"D","text":"After performing our preliminary analytical procedures, we will discuss with you the other procedures we consider necessary to complete the engagement."}],"ans":"D","explanation":"Auditing procedures must retain an element of unpredictability; an auditor does not discuss specific further audit procedures in advance."},{"id":"AT10003_Q11","n":11,"stem":"The following are usually included in an auditor’s engagement letter, except","opts":[{"label":"A","text":"List of audit procedures to be used in inventory observation."},{"label":"B","text":"The financial statements are the responsibility of the company’s management."},{"label":"C","text":"A reference to PFRS."},{"label":"D","text":"A reference to PSAs."}],"ans":"A","explanation":"Detailed audit procedures (like specific inventory observation procedures) are in the audit plan, never disclosed in the engagement letter."},{"id":"AT10003_Q12","n":12,"stem":"An auditor’s engagement letter most likely will include","opts":[{"label":"A","text":"A request for permission to contact the client’s lawyer for assistance in identifying litigation, claims, and assessments."},{"label":"B","text":"A reminder that management is responsible for illegal acts committed by employees."},{"label":"C","text":"The auditor’s preliminary assessment of the risk factors relating to misstatements arising from fraudulent financial reporting."},{"label":"D","text":"Management’s acknowledgment of its responsibility for such internal control as it determines is necessary to enable the preparation of financial statements that are free from material misstatement."}],"ans":"D","explanation":"Under PSA 210, management's written agreement acknowledges responsibility for internal control."},{"id":"AT10003_Q13","n":13,"stem":"An auditor who, before the completion of the engagement, is requested to change the engagement to one which provides a lower level of assurance, should","opts":[{"label":"A","text":"Withdraw and consider whether there is any obligation to report to other parties the circumstances necessitating the withdrawal."},{"label":"B","text":"Issue a report that includes reference to the original engagement and any procedures that may have been performed in the original engagement."},{"label":"C","text":"Not agree to a change of engagement where there is no reasonable justification for doing so."},{"label":"D","text":"Consider the change reasonable if it relates to information that is incorrect, incomplete or otherwise unsatisfactory."}],"ans":"C","explanation":"Under PSA 210, the auditor should not agree to a change if there is no reasonable justification."},{"id":"AT10003_Q14","n":14,"stem":"Before the completion of the audit engagement, an auditor is requested to change the engagement to one that provides a lower level of assurance. If the auditor concludes that there is a reasonable justification for the change in engagement, the report to be issued would","opts":[{"label":"A","text":"Be that appropriate for the revised terms of engagement."},{"label":"B","text":"Include reference to the original engagement."},{"label":"C","text":"Include reference to any procedures that may have been performed in the original engagement."},{"label":"D","text":"Not include reference to any procedures that may have been performed, particularly when the new engagement is to undertake agreed-upon procedures."}],"ans":"A","explanation":"The report issued is that appropriate for the revised engagement without referring to the original audit."},{"id":"AT10003_Q15","n":15,"stem":"If the auditor is unable to agree to a change of the engagement and is not permitted to continue the original engagement, the auditor should","opts":[{"label":"A","text":"Insist on continuing the original engagement."},{"label":"B","text":"Express a qualified opinion."},{"label":"C","text":"Express an adverse opinion."},{"label":"D","text":"Withdraw from the engagement."}],"ans":"D","explanation":"The auditor should withdraw from the engagement and consider reporting obligations to TCWG or regulators."}]},{"id":"AT-10004","code":"AT-10004","title":"Audit Planning (PSA 300) & Assessing Risks of Material Misstatement (PSA 315)","standards":"PSA 300, PSA 315 (Revised 2019)","questionCount":60,"summary":"Overall Audit Strategy vs Audit Plan, Preliminary Engagement Activities, Direction/Supervision/Review, PSA 315 Risk Assessment Procedures, Understanding the Entity and its Environment, System of Internal Control, 5 Components of Internal Control (Control Environment, Risk Assessment, Information System & Communication, Control Activities, Monitoring), Significant Risks, and Cycles (Revenue, Purchases, Inventory, Payroll).","lectureOutline":"### PSA 300: PLANNING AN AUDIT OF FINANCIAL STATEMENTS\nPlanning an audit involves:\n1. **Establishing the overall audit strategy:** Sets the scope, timing, and direction of the audit, guides development of the more detailed audit plan, determines resources necessary.\n2. **Developing an audit plan:** More detailed than the strategy. Describes the nature, timing, and extent of:\n   - Planned risk assessment procedures (PSA 315)\n   - Planned further audit procedures at the assertion level (PSA 330)\n   - Other planned audit procedures required by PSAs\n\n#### Direction, Supervision, and Review\nThe nature, timing, and extent depend on:\n- Size and complexity of the entity\n- Area of the audit\n- Assessed risk of material misstatement (higher RMM requires more extensive/experienced supervision)\n- Capabilities and competence of individual team members\n\n---\n\n### PSA 315 (REVISED 2019): IDENTIFYING AND ASSESSING RISKS OF MATERIAL MISSTATEMENT\n#### Objective\nTo identify and assess risks of material misstatement, whether due to fraud or error, at the financial statement and assertion levels, thereby providing a basis for designing and implementing responses (PSA 330).\n\n#### Risk Assessment Procedures (RAP)\n1. Inquiries of management and appropriate individuals (including internal audit).\n2. Analytical procedures (as risk assessment / preliminary stage).\n3. Observation and inspection.\n*(Note: RAP does not include substantive testing or tests of controls).*\n\n#### 5 Components of the Entity's System of Internal Control\n1. **Control Environment:** Governance and management functions, attitudes, awareness, and actions concerning internal control (\"tone at the top\").\n2. **Entity’s Risk Assessment Process:** Identifying business risks relevant to financial reporting, estimating significance, assessing likelihood, deciding actions.\n3. **Information System and Communication:** Classes of significant transactions, procedures within IT and manual systems, accounting records, reporting process, and communication of roles.\n4. **Control Activities:** Policies and procedures helping ensure management directives are carried out:\n   - Authorization\n   - Performance reviews\n   - Information processing\n   - Physical controls\n   - Segregation of duties (custody, authorization, recording, reconciliation)\n5. **Monitoring of Controls:** Assessing design and operation of controls on a timely basis and taking corrective actions.\n\n#### Definition of Significant Risk\nAn identified and assessed risk of material misstatement that, in the auditor's judgment, requires special audit consideration (e.g., fraud risk, complex/unusual transactions, significant related party transactions).","items":[{"id":"AT10004_Q1","n":1,"stem":"Adequate planning of the audit work helps to ensure that:\n• Appropriate attention is devoted to important areas of the audit\n• Potential problems are identified\n• The work is completed expeditiously","opts":[{"label":"A","text":"Yes | Yes | No"},{"label":"B","text":"No | Yes | Yes"},{"label":"C","text":"Yes | Yes | Yes"},{"label":"D","text":"No | No | No"}],"ans":"C","explanation":"Adequate audit planning ensures important areas receive attention, problems are identified, and work is completed expeditiously."},{"id":"AT10004_Q2","n":2,"stem":"Which of the following matters should be considered by the auditor in developing the overall audit strategy?","opts":[{"label":"A","text":"Important characteristics of the entity, its business, its financial performance and its reporting requirements including changes since the date of the prior audit."},{"label":"B","text":"Conditions requiring special attention, such as the existence of related parties."},{"label":"C","text":"The setting of materiality levels for audit purposes."},{"label":"D","text":"All of the above."}],"ans":"D","explanation":"All of these factors are considered when establishing the overall audit strategy."},{"id":"AT10004_Q3","n":3,"stem":"An auditor should design the audit plan so that","opts":[{"label":"A","text":"All material transactions will be selected for substantive testing."},{"label":"B","text":"Substantive tests prior to the balance sheet date will be minimized."},{"label":"C","text":"The audit procedures selected will achieve specific audit objectives."},{"label":"D","text":"Each account balance will be tested under either tests of controls or tests of transactions."}],"ans":"C","explanation":"Audit procedures in the plan are designed to achieve specific audit objectives responsive to assessed risks."},{"id":"AT10004_Q4","n":4,"stem":"Audit plans should be designed so that","opts":[{"label":"A","text":"Most of the required procedures can be performed as interim work."},{"label":"B","text":"Inherent risk is assessed at a sufficiently low level."},{"label":"C","text":"The auditor can make constructive suggestions to management."},{"label":"D","text":"The audit evidence gathered supports the auditor’s conclusions."}],"ans":"D","explanation":"The audit plan ensures sufficient appropriate audit evidence is gathered to support the audit conclusions."},{"id":"AT10004_Q5","n":5,"stem":"An audit program provides a proof that","opts":[{"label":"A","text":"sufficient competent evidential matter is obtained."},{"label":"B","text":"the work is adequately planned."},{"label":"C","text":"there is compliance with generally accepted standards of reporting."},{"label":"D","text":"there is a proper study and evaluation of internal control."}],"ans":"B","explanation":"An audit program (audit plan) serves as written proof of adequate audit planning."},{"id":"AT10004_Q6","n":6,"stem":"An auditor most likely obtains an understanding of a new client to","opts":[{"label":"A","text":"Make constructive suggestions concerning improvements to the client’s internal control."},{"label":"B","text":"Develop an attitude of professional skepticism concerning management’s financial statement assertions."},{"label":"C","text":"Evaluate whether the aggregation of known misstatements causes the financial statements taken as a whole to be materially misstated."},{"label":"D","text":"Identify areas of audit emphasis."}],"ans":"D","explanation":"Understanding the client identifies risks and determines areas of audit emphasis."},{"id":"AT10004_Q7","n":7,"stem":"Which of the following procedures is the auditor most likely to perform after accepting an initial audit engagement?","opts":[{"label":"A","text":"Prepare a rough draft of the financial statements and of the auditor’s report."},{"label":"B","text":"Assess control risk for the assertions embodied in the financial statements."},{"label":"C","text":"Tour the client’s facilities."},{"label":"D","text":"Consult with and review the work of the predecessor auditor prior to discussing the engagement with the client management."}],"ans":"C","explanation":"Touring client facilities early in the planning stage provides immediate physical insight into business operations and controls."},{"id":"AT10004_Q8","n":8,"stem":"PSA 315 (Identifying and Assessing the Risks of Material Misstatement through Understanding the Entity and its Environment) requires the auditor to perform risk assessment procedures at","opts":[{"label":"A","text":"The financial statement level only."},{"label":"B","text":"The assertion level only."},{"label":"C","text":"The financial statement level and the assertion level for classes of transactions, account balances and disclosures."},{"label":"D","text":"Either the financial statement or assertion level."}],"ans":"C","explanation":"Risks must be identified and assessed at both the financial statement level and assertion level."},{"id":"AT10004_Q9","n":9,"stem":"The auditor’s risk assessment procedures should always include the following, except","opts":[{"label":"A","text":"Inquiries of management and of others within the entity."},{"label":"B","text":"Analytical procedures."},{"label":"C","text":"Observation and inspection."},{"label":"D","text":"Substantive test procedures and tests of controls."}],"ans":"D","explanation":"Substantive tests and tests of controls are further audit procedures (PSA 330), not risk assessment procedures (PSA 315)."},{"id":"AT10004_Q10","n":10,"stem":"The auditor should obtain an understanding of the entity’s objectives and strategies, and those business risks that may result in risks of material misstatement. Which of the following statements concerning the entity’s business risk is incorrect?","opts":[{"label":"A","text":"Business risk is broader than the risk of material misstatement of the financial statements, though it includes the latter."},{"label":"B","text":"An understanding of the business risks facing the entity increases the likelihood of identifying risks of material misstatement."},{"label":"C","text":"The auditor has a responsibility to identify or assess all business risks."},{"label":"D","text":"Business risk may arise from the development of new products or services that may fail."}],"ans":"C","explanation":"The auditor does NOT have a responsibility to identify or assess all business risks, only those that may result in risks of material misstatement."},{"id":"AT10004_Q11","n":11,"stem":"The objective of performing analytical procedures as risk assessment procedures in an audit is to identify","opts":[{"label":"A","text":"Unusual transactions and events."},{"label":"B","text":"Noncompliance with laws and regulations that went undetected because of internal control weaknesses."},{"label":"C","text":"Relate party transactions."},{"label":"D","text":"Recorded transactions that were properly authorized."}],"ans":"A","explanation":"Preliminary analytical procedures identify unusual transactions, events, amounts, ratios and trends that indicate potential risks."},{"id":"AT10004_Q12","n":12,"stem":"A measure of how willing the auditor is to accept that the financial statements may be materially misstated after the audit is completed and an unmodified opinion has been issued is the","opts":[{"label":"A","text":"Inherent risk."},{"label":"B","text":"Acceptable audit risk."},{"label":"C","text":"Control risk."},{"label":"D","text":"Detection risk."}],"ans":"B","explanation":"This is the definition of acceptable audit risk."},{"id":"AT10004_Q13","n":13,"stem":"Which of the following audit risk components may be assessed in quantitative terms?\nInherent Risk | Control Risk | Detection Risk","opts":[{"label":"A","text":"Yes | No | Yes"},{"label":"B","text":"Yes | Yes | Yes"},{"label":"C","text":"No | No | No"},{"label":"D","text":"No | No | Yes"}],"ans":"B","explanation":"All audit risk model components (IR, CR, DR) may be assessed in quantitative terms (e.g. percentages) or non-quantitative terms (high, medium, low)."},{"id":"AT10004_Q14","n":14,"stem":"A measure of the auditor’s assessment of the likelihood that there are material misstatements in an account before considering the effectiveness of the client’s internal control is called","opts":[{"label":"A","text":"Audit risk"},{"label":"B","text":"Detection risk"},{"label":"C","text":"Inherent risk"},{"label":"D","text":"Control risk"}],"ans":"C","explanation":"Inherent risk is susceptibility to misstatement before considering related controls."},{"id":"AT10004_Q15","n":15,"stem":"Inherent risk and control risk differ from detection risk in that they","opts":[{"label":"A","text":"Arise from the misapplication of auditing procedures."},{"label":"B","text":"May be assessed in either quantitative or nonquantitative terms."},{"label":"C","text":"Exist independently of the financial statement audit."},{"label":"D","text":"Can be changed at the auditor’s discretion."}],"ans":"C","explanation":"IR and CR are functions of the entity and its environment, existing independently of the audit."},{"id":"AT10004_Q16","n":16,"stem":"Assessing control risk at a low level most likely would involve","opts":[{"label":"A","text":"Performing more extensive substantive tests with larger sample sizes than originally planned."},{"label":"B","text":"Reducing inherent risk for most of the assertions relevant to significant account balances."},{"label":"C","text":"Changing the timing of substantive tests by omitting interim-date testing and performing the tests at year-end."},{"label":"D","text":"Identifying specific controls relevant to specific assertions."}],"ans":"D","explanation":"Assessing CR below maximum requires identifying specific controls relevant to assertions and testing their operating effectiveness."},{"id":"AT10004_Q17","n":17,"stem":"An auditor assesses control risk because it","opts":[{"label":"A","text":"Is relevant to the auditor’s understanding of the control environment."},{"label":"B","text":"Provides assurance that the auditor’s materiality levels are appropriate."},{"label":"C","text":"Indicates to the auditor where inherent risk may be the greatest."},{"label":"D","text":"Affects the level of detection risk that the auditor may accept."}],"ans":"D","explanation":"The assessed level of control risk directly affects the acceptable level of detection risk (inverse relationship)."},{"id":"AT10004_Q18","n":18,"stem":"Which of the following is not a step in an auditor’s assessment of control risk?","opts":[{"label":"A","text":"Evaluate the effectiveness of internal control with tests of controls."},{"label":"B","text":"Obtain an understanding of the entity’s information system and control environment."},{"label":"C","text":"Perform tests of details of transactions to detect material misstatements in the financial statements."},{"label":"D","text":"Consider whether controls can have a pervasive effect on financial statement assertions."}],"ans":"C","explanation":"Tests of details to detect misstatements are substantive procedures, not steps in assessing control risk."},{"id":"AT10004_Q19","n":19,"stem":"The statements below describe the interrelationship of audit risk components. Which is false?","opts":[{"label":"A","text":"There is an inverse relationship between detection risk and the combined level of inherent and control risks."},{"label":"B","text":"When inherent and control risks are high, the acceptable level of detection risk needs to be low to reduce audit risk to an acceptably low level."},{"label":"C","text":"When inherent and control risks are low, an auditor can accept a higher detection risk and still reduce audit risk to an acceptably low level."},{"label":"D","text":"The assessed level of inherent and control risks can be sufficiently low to eliminate the need for the auditor to perform any substantive procedures."}],"ans":"D","explanation":"Regardless of how low IR and CR are assessed, the auditor must always perform some substantive procedures for material classes of transactions and balances."},{"id":"AT10004_Q20","n":20,"stem":"It is the process designed and effected by those charged with governance, management, and other personnel to provide reasonable assurance about the achievement of the entity’s objectives.","opts":[{"label":"A","text":"Internal auditing"},{"label":"B","text":"Internal control"},{"label":"C","text":"Business strategy"},{"label":"D","text":"Accounting process"}],"ans":"B","explanation":"This is the definition of internal control under PSA 315."},{"id":"AT10004_Q21","n":21,"stem":"Which of the following is not one of the three primary objectives of effective internal control?","opts":[{"label":"A","text":"Reliability of financial reporting."},{"label":"B","text":"Efficiency and effectiveness of operations."},{"label":"C","text":"Compliance with laws and regulations."},{"label":"D","text":"Assurance of elimination of business risk."}],"ans":"D","explanation":"Internal control cannot eliminate business risk."},{"id":"AT10004_Q22","n":22,"stem":"When considering an entity’s internal control system, an auditor is not required to","opts":[{"label":"A","text":"Search for significant deficiencies in the operation of the internal control system."},{"label":"B","text":"Understand the components of the entity’s internal control system."},{"label":"C","text":"Determine whether relevant controls have been placed in operation."},{"label":"D","text":"Perform procedures to understand the design of the internal control system policies."}],"ans":"A","explanation":"An audit of FS is not designed to search for deficiencies, although deficiencies that come to light must be communicated."},{"id":"AT10004_Q23","n":23,"stem":"In an audit of financial statements, an auditor’s primary consideration regarding an internal control is whether the control","opts":[{"label":"A","text":"Reflects management’s philosophy and operating style."},{"label":"B","text":"Affects management’s financial statement assertions."},{"label":"C","text":"Provides adequate safeguards over access to assets."},{"label":"D","text":"Relates to operational activities."}],"ans":"B","explanation":"Controls relevant to an audit are those that affect financial statement assertions."},{"id":"AT10004_Q24","n":24,"stem":"Which of the following statements concerning the relevance of various types of controls to a financial statement audit is correct?","opts":[{"label":"A","text":"All controls are ordinarily relevant to a financial statement audit."},{"label":"B","text":"Controls over safeguarding of assets and liabilities are of primary importance, while controls over the reliability of financial reporting may also be relevant."},{"label":"C","text":"Controls over the reliability of financial reporting are ordinarily most directly relevant to a financial statement audit, but other controls may also be relevant."},{"label":"D","text":"An auditor may ordinarily ignore a consideration of controls when a substantive audit approach is taken."}],"ans":"C","explanation":"Controls over financial reporting reliability are most directly relevant, though operational/compliance controls affecting FS may also be relevant."},{"id":"AT10004_Q25","n":25,"stem":"The components of internal control include","opts":[{"label":"A","text":"Monitoring of controls that sets the tone of the organization."},{"label":"B","text":"A process of managing risks relevant to preparing financial statements."},{"label":"C","text":"A control environment consisting of policies and procedures to help ensure that management directives are carried out."},{"label":"D","text":"Control activities that identify, capture, and exchange information."}],"ans":"B","explanation":"The entity's risk assessment process is its process for identifying and managing risks relevant to financial reporting."},{"id":"AT10004_Q26","n":26,"stem":"An auditor should consider two key issues when obtaining an understanding of a client’s internal controls. These issues are","opts":[{"label":"A","text":"The effectiveness and efficiency of the controls."},{"label":"B","text":"The frequency and effectiveness of the controls."},{"label":"C","text":"The design and implementation of the controls."},{"label":"D","text":"The implementation and efficiency of the controls."}],"ans":"C","explanation":"Obtaining an understanding involves evaluating the design and determining whether controls have been implemented."},{"id":"AT10004_Q27","n":27,"stem":"Which of the following procedures would an auditor most likely include in the planning phase of a financial statement audit?","opts":[{"label":"A","text":"Obtain an understanding of the entity’s risk assessment process."},{"label":"B","text":"Identify specific internal control activities designed to prevent fraud."},{"label":"C","text":"Evaluate the reasonableness of the entity’s accounting estimates."},{"label":"D","text":"Perform cutoff tests of the entity’s sales and purchases."}],"ans":"A","explanation":"Obtaining an understanding of internal control components (including risk assessment process) is performed during planning."},{"id":"AT10004_Q28","n":28,"stem":"When assessing control risk at below the maximum level, an auditor is required to document the auditor’s understanding of the\nI. Entity’s control activities that help ensure management directives are carried out.\nII. Entity’s control environment factors that help the auditor plan the engagement.","opts":[{"label":"A","text":"I Only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"The auditor must document the understanding of both control activities and control environment components."},{"id":"AT10004_Q29","n":29,"stem":"Which of the following is the best way to compensate for the lack of adequate segregation of duties in a small organization?","opts":[{"label":"A","text":"Disclosing lack of segregation of duties to the external auditors during the annual review."},{"label":"B","text":"Replacing personnel every three of four years."},{"label":"C","text":"Requiring accountants to pass a yearly background check."},{"label":"D","text":"Allowing for greater management oversight of incompatible activities."}],"ans":"D","explanation":"Direct owner/manager oversight is the primary compensating control for small business lack of segregation of duties."},{"id":"AT10004_Q30","n":30,"stem":"Which of the following statements is most correct with respect to separation of duties?","opts":[{"label":"A","text":"Employees should not have temporary and permanent custody of assets."},{"label":"B","text":"Employees who authorize transactions should not have custody of related assets."},{"label":"C","text":"It is permissible to allow an employee to open cash receipts and record those receipts."},{"label":"D","text":"Employees who authorize transactions should have recording responsibility for these transactions."}],"ans":"B","explanation":"Authorization must be separated from asset custody."},{"id":"AT10004_Q31","n":31,"stem":"Authorizations can be either general or specific. Which of the following is not an example of a general authorization?","opts":[{"label":"A","text":"Automatic reorder points for raw materials inventory."},{"label":"B","text":"A sales manager’s authorization for a sales return."},{"label":"C","text":"Credit limits for various classes of transactions."},{"label":"D","text":"A sales price list for merchandise."}],"ans":"B","explanation":"Authorizing a specific transaction (a sales return) is a specific authorization."},{"id":"AT10004_Q32","n":32,"stem":"When obtaining knowledge about an entity’s internal control, it is important for the auditor to consider the competence of its employees, because their competence bears directly and importantly upon the","opts":[{"label":"A","text":"Cost-benefit relationship of internal control."},{"label":"B","text":"Comparison of recorded accountability with assets."},{"label":"C","text":"Achievement of the objectives of internal control."},{"label":"D","text":"Timing of substantive tests to be performed."}],"ans":"C","explanation":"Employee competence directly impacts whether internal control objectives are achieved."},{"id":"AT10004_Q33","n":33,"stem":"Control activities are the policies and procedures that help ensure that management directives are carried out. These include activities relating to authorization, performance reviews, information processing, physical controls, and segregation of duties. There is proper segregation of duties when an individual who","opts":[{"label":"A","text":"Records a transaction does not compare the accounting record of the asset with the asset itself."},{"label":"B","text":"Authorizes a transaction records it."},{"label":"C","text":"Authorizes a transaction maintains custody of the asset that resulted from the transaction."},{"label":"D","text":"Maintains custody of an asset has access to the accounting records for the asset."}],"ans":"A","explanation":"Independent reconciliation/verification should not be done by the person recording or holding custody."},{"id":"AT10004_Q34","n":34,"stem":"Proper segregation of duties reduces the opportunities to allow persons to be in positions to both","opts":[{"label":"A","text":"Journalize entries and prepare financial statements."},{"label":"B","text":"Record cash receipts and cash disbursements."},{"label":"C","text":"Establish internal controls and authorize transactions."},{"label":"D","text":"Perpetrate and conceal errors and irregularities."}],"ans":"D","explanation":"Segregation of duties prevents an individual from being able to both perpetrate and conceal errors or fraud."},{"id":"AT10004_Q35","n":35,"stem":"An auditor should obtain sufficient knowledge of an entity’s information system, including the related business processes relevant to financial reporting, to understand the","opts":[{"label":"A","text":"Policies used to detect the concealment of fraud."},{"label":"B","text":"Process used to prepare significant accounting estimates."},{"label":"C","text":"Safeguards used to limit access to computer facilities."},{"label":"D","text":"Procedures used to assure proper authorization of transactions."}],"ans":"B","explanation":"PSA 315 specifies understanding the financial reporting process used to prepare the FS, including accounting estimates."},{"id":"AT10004_Q36","n":36,"stem":"The primary objective of procedures performed to obtain an understanding of internal control is to provide an auditor with","opts":[{"label":"A","text":"Knowledge necessary to plan the audit."},{"label":"B","text":"A basis for modifying tests of controls."},{"label":"C","text":"Information necessary to prepare flowcharts."},{"label":"D","text":"Evidence to use in reducing detection risk."}],"ans":"A","explanation":"The primary purpose of understanding internal control is to obtain the knowledge necessary to plan the audit."},{"id":"AT10004_Q37","n":37,"stem":"In obtaining an understanding of internal control relevant to the audit, an auditor is required to obtain knowledge about the","opts":[{"label":"A","text":"Effectiveness of controls that have been implemented."},{"label":"B","text":"Consistency with which controls are currently being applied."},{"label":"C","text":"Design of the controls pertaining to internal control components."},{"label":"D","text":"Controls related to each class of transactions and account balance."}],"ans":"C","explanation":"The auditor evaluates design and determines implementation of controls."},{"id":"AT10004_Q38","n":38,"stem":"Obtaining an understanding of an internal control involves evaluating the design of the control and determining whether the control has been","opts":[{"label":"A","text":"Authorized."},{"label":"B","text":"Implemented."},{"label":"C","text":"Tested."},{"label":"D","text":"Monitored."}],"ans":"B","explanation":"PSA 315 specifically states: \"evaluating the design of the control and determining whether it has been implemented\"."},{"id":"AT10004_Q39","n":39,"stem":"After considering a client’s internal controls, an auditor has concluded that it is well designed and is functioning as intended. Under these circumstances the auditor would most likely","opts":[{"label":"A","text":"Perform tests of controls to the extent outlined in the audit program."},{"label":"B","text":"Determine the control procedures that should prevent or detect errors and fraud."},{"label":"C","text":"Not increase the extent of predetermined substantive tests."},{"label":"D","text":"Determine whether transactions are recorded to permit preparation of financial statements in accordance with PFRS."}],"ans":"C","explanation":"When controls function effectively as tested, the auditor does not need to increase substantive tests."},{"id":"AT10004_Q40","n":40,"stem":"Audit evidence concerning proper segregation of duties normally is best obtained by","opts":[{"label":"A","text":"Direct personal observation of the employee who applies control procedures."},{"label":"B","text":"Making inquiries of co-workers about the employee who applies control procedures."},{"label":"C","text":"Preparation of a flowchart of duties performed and available personnel."},{"label":"D","text":"Inspection of third-party documents containing the initials of who applied control procedures."}],"ans":"A","explanation":"Segregation of duties leaves no audit trail; observation of employees performing duties provides the best evidence."},{"id":"AT10004_Q41","n":41,"stem":"In conducting an audit in accordance with PSAs, the auditor is required to identify and assess the risks of material misstatement at the financial statement level, and at the assertion level for classes of transactions, account balances, and disclosures. Some of these risks, in the auditor’s judgment, require special audit consideration, such as those that involve fraud or complex transactions. Such risks are called","opts":[{"label":"A","text":"Business risks"},{"label":"B","text":"Audit risks"},{"label":"C","text":"Significant risks"},{"label":"D","text":"Material risks"}],"ans":"C","explanation":"Risks that require special audit consideration are defined as \"significant risks\"."},{"id":"AT10004_Q42","n":42,"stem":"As a result of obtaining an understanding of an entity’s internal control system, the auditor may become aware of material weaknesses in the design or implementation of internal control. The auditor is required to communicate this matter to","opts":[{"label":"A","text":"Those charged with governance or management"},{"label":"B","text":"Chief executive officer"},{"label":"C","text":"Securities and Exchange Commission"},{"label":"D","text":"Board of Accountancy"}],"ans":"A","explanation":"Significant deficiencies/material weaknesses must be communicated in writing to TCWG and management."},{"id":"AT10004_Q43","n":43,"stem":"Which of the following controls most likely would provide reasonable assurance that all credit sales transactions of an entity are recorded?","opts":[{"label":"A","text":"The accounting department supervisor controls the mailing of monthly statements to customers and investigates any differences reported by customers."},{"label":"B","text":"The accounting department supervisor independently reconciles, on a monthly basis, the accounts receivable subsidiary ledger to the accounts receivable control account."},{"label":"C","text":"The billing department supervisor matches prenumbered shipping documents with entries in the sales journal."},{"label":"D","text":"The billing department supervisor sends copies of approved sales orders to the credit department for comparison to authorized credit limits and current customer account balances."}],"ans":"C","explanation":"Matching prenumbered shipping documents to entries in the sales journal tests for completeness of recorded sales."},{"id":"AT10004_Q44","n":44,"stem":"An auditor tests an entity’s policy of obtaining credit approval before shipping goods to customers in support of management’s financial statement assertion of","opts":[{"label":"A","text":"Valuation."},{"label":"B","text":"Completeness."},{"label":"C","text":"Occurrence."},{"label":"D","text":"Rights and obligations."}],"ans":"A","explanation":"Credit approval verifies collectibility of receivables, supporting the valuation assertion."},{"id":"AT10004_Q45","n":45,"stem":"Macho Dancer Company uses its sales invoices for posting perpetual inventory records. Inadequate internal control over the invoicing function allows goods to be shipped but not invoiced. The inadequate controls could cause what type of misstatement in each of the following accounts?\nRevenues | Receivables | Inventories","opts":[{"label":"A","text":"Understatement | Understatement | Understatement"},{"label":"B","text":"Overstatement | Overstatement | Understatement"},{"label":"C","text":"Understatement | Understatement | Overstatement"},{"label":"D","text":"Overstatement | Overstatement | Overstatement"}],"ans":"C","explanation":"Uninvoiced shipments result in unrecorded revenues (understated) and receivables (understated), while inventory is not reduced in perpetual records based on invoice (overstated)."},{"id":"AT10004_Q46","n":46,"stem":"Which of the following control activities in an entity’s revenue/receipt cycle would provide reasonable assurance that all billed sales are correctly posted to the accounts receivable ledger?","opts":[{"label":"A","text":"Each shipment of goods on credit is supported by a prenumbered sales invoice."},{"label":"B","text":"The accounts receivable subsidiary ledger is reconciled daily to the accounts receivable control account in the general ledger."},{"label":"C","text":"Daily sales summaries are compared to daily postings to the accounts receivable ledger."},{"label":"D","text":"Each sales invoice is supported by a prenumbered shipping document."}],"ans":"C","explanation":"Comparing daily sales summaries to daily postings ensures all billed sales are posted to AR."},{"id":"AT10004_Q47","n":47,"stem":"The auditor’s primary objective in obtaining an understanding of the client’s controls over the purchasing function is to","opts":[{"label":"A","text":"Investigate the recording of unusual transactions regarding raw materials."},{"label":"B","text":"Determine the reliability of financial reporting by the purchasing function."},{"label":"C","text":"Observe the annual physical count."},{"label":"D","text":"Ascertain that raw materials paid for are on hand."}],"ans":"B","explanation":"Understanding purchasing controls determines the reliability of financial reporting in that cycle."},{"id":"AT10004_Q48","n":48,"stem":"Effective controls relevant to purchasing of raw materials should usually include all of the following, except","opts":[{"label":"A","text":"Determining the need for the raw materials prior to preparing the purchase order."},{"label":"B","text":"Systematic reporting of product changes that will affect raw materials."},{"label":"C","text":"Obtaining financial approval prior to making a commitment."},{"label":"D","text":"Obtaining third-party written quality and quantity reports prior to payment for the raw materials."}],"ans":"D","explanation":"Internal receiving reports (not third-party reports) are standard internal control documents for purchasing."},{"id":"AT10004_Q49","n":49,"stem":"Which of the following controls is not usually performed in the accounts payable department?","opts":[{"label":"A","text":"Indicating on the voucher the affected asset and expense accounts to be debited."},{"label":"B","text":"Approving vouchers for payment by having an authorized employee sign the vouchers."},{"label":"C","text":"Accounting for unused prenumbered purchase orders and receiving reports."},{"label":"D","text":"Matching the vendor’s invoice with the related purchase requisition, purchase order, and receiving report."}],"ans":"C","explanation":"Unused prenumbered POs and receiving reports are safeguarded by purchasing and receiving departments, not AP."},{"id":"AT10004_Q50","n":50,"stem":"The following are appropriate questions on an internal control questionnaire concerning purchase transactions, except","opts":[{"label":"A","text":"Are all goods received in a centralized receiving department and counted, inspected, and compared with purchase orders on receipt?"},{"label":"B","text":"Are intact cash receipts deposited daily in the bank?"},{"label":"C","text":"Are prenumbered purchase orders and receiving reports used and accounted for?"},{"label":"D","text":"Are an approved purchase requisition and a signed purchase order required for each purchase?"}],"ans":"B","explanation":"Cash receipts deposited intact relates to the cash receipts/revenue cycle, not purchase transactions."},{"id":"AT10004_Q51","n":51,"stem":"Which of the following is of least concern to an auditor in assessing the risks of material misstatement?","opts":[{"label":"A","text":"Signed checks are distributed by the controller to approved payees."},{"label":"B","text":"Checks are signed by one person."},{"label":"C","text":"Cash receipts are not deposited intact daily."},{"label":"D","text":"Treasurer does not verify the names and addresses of check payees."}],"ans":"B","explanation":"Signing by one person is standard in many systems as long as supporting vouchers are properly approved."},{"id":"AT10004_Q52","n":52,"stem":"To provide assurance that each voucher is submitted and paid only once, an auditor most likely would examine a sample of paid vouchers and determine whether each voucher is","opts":[{"label":"A","text":"Supported by a vendor’s invoice."},{"label":"B","text":"Stamped “paid” by the check signer."},{"label":"C","text":"Prenumbered and accounted for."},{"label":"D","text":"Approved for authorized purchases."}],"ans":"B","explanation":"Cancelling or stamping vouchers \"PAID\" prevents double submission and double payment."},{"id":"AT10004_Q53","n":53,"stem":"An auditor generally tests the segregation of duties related to inventory by","opts":[{"label":"A","text":"Personal inquiry and observation."},{"label":"B","text":"Test counts and cutoff procedures."},{"label":"C","text":"Analytical procedures and invoice recomputation."},{"label":"D","text":"Document inspection and reconciliation."}],"ans":"A","explanation":"Segregation of duties is tested through inquiry and observation."},{"id":"AT10004_Q54","n":54,"stem":"Your client, a merchandising concern, has annual sales of P30,000,000 and a 40% gross profit rate. Tests reveal that 2% of the peso amount of purchases do not get into inventory because of breakage and inventory pilferage by employees. The company estimates that these losses could be reduced to 0.5% of purchases by designing and implementing certain controls costing approximately P350,000. Should the controls be designed and implemented?","opts":[{"label":"A","text":"Yes, regardless of cost-benefit considerations, because the situation involves employee theft."},{"label":"B","text":"Yes, because the ideal system of internal control is the most extensive one."},{"label":"C","text":"No, because the cost of designing and implementing the added controls exceeds the projected savings."},{"label":"D","text":"Yes, because the expected benefits to be derived exceed the cost of the added controls."}],"ans":"C","explanation":"Cost of goods sold is 60% of P30M = P18,000,000 purchases. Reduction in loss is 1.5% of P18M = P270,000. The cost of P350,000 exceeds savings of P270,000."},{"id":"AT10004_Q55","n":55,"stem":"An internal control objective concerning property, plant, and equipment (PPE) acquisitions is that they be recorded at the correct amounts and in the proper period, and properly classified. In which of the following conditions would an auditor most likely assess a high level of risk of material misstatement?","opts":[{"label":"A","text":"All material acquisitions of PPE are required to be approved by the board of directors."},{"label":"B","text":"Most additions are self-constructed by the entity."},{"label":"C","text":"Recently acquired loans include covenants that preclude further plant acquisitions for 5 years."},{"label":"D","text":"Gross PPE increased 30% during the current period."}],"ans":"B","explanation":"Self-constructed assets involve complex allocation of overhead, materials, and labor, increasing risk of misstatement."},{"id":"AT10004_Q56","n":56,"stem":"When an entity uses a trust company as custodian of its marketable securities, the possibility of concealing fraud would most likely be reduced if the","opts":[{"label":"A","text":"Trust company has no direct contact with the entity employees responsible for maintaining investment accounting records."},{"label":"B","text":"Securities are registered in the name of the trust company, rather than the entity itself."},{"label":"C","text":"Interest and dividend checks are mailed directly to an entity employee who is authorized to sell securities."},{"label":"D","text":"Trust company places the securities in a bank safe-deposit vault under the custodian's exclusive control."}],"ans":"A","explanation":"Independent custodian without contact with recordkeepers prevents collusion and concealment."},{"id":"AT10004_Q57","n":57,"stem":"The following controls are designed to protect investment securities, except","opts":[{"label":"A","text":"Investment securities should be properly controlled physically in order to prevent unauthorized usage."},{"label":"B","text":"Custody over investment securities should be limited to personnel having record-keeping responsibility over the securities."},{"label":"C","text":"Securities should be registered in the entity’s name."},{"label":"D","text":"Access to securities should be vested in two individuals."}],"ans":"B","explanation":"Custody should be segregated from recordkeeping; combining them destroys internal control."},{"id":"AT10004_Q58","n":58,"stem":"Effective controls over the payroll function may include","opts":[{"label":"A","text":"Custody of rate authorization records by the supervisor of the payroll department."},{"label":"B","text":"Preparation of payroll transaction journal entries by an employee who reports to the supervisor of the personnel department."},{"label":"C","text":"Verification of agreement of job time tickets with employee clock card hours by a payroll department employee."},{"label":"D","text":"Reconciliation of totals on job time tickets with job reports by employees responsible for those specific jobs."}],"ans":"C","explanation":"Reconciling job time tickets with clock card hours verifies that payroll is computed only for hours worked."},{"id":"AT10004_Q59","n":59,"stem":"Employees of a manufacturing entity are often required to use time cards and job time tickets. Which of the following statements concerning the use of these documents is incorrect?","opts":[{"label":"A","text":"Time reported on job time tickets should be reconciled to time cards."},{"label":"B","text":"Payroll should be calculated based on job time tickets."},{"label":"C","text":"Each employee should have only one time card."},{"label":"D","text":"An employee may have one or many job time tickets in a day."}],"ans":"B","explanation":"Payroll is calculated based on time cards (clock cards), while job time tickets are used for cost accounting allocation."},{"id":"AT10004_Q60","n":60,"stem":"Which of the following personnel department procedures reduces the risk of payroll fraud and represents an appropriate responsibility for the department?","opts":[{"label":"A","text":"Authorizing the addition or deletion of employees from the payroll."},{"label":"B","text":"Authorizing overtime hours."},{"label":"C","text":"Collection and retention of unclaimed paychecks."},{"label":"D","text":"Distributing paychecks."}],"ans":"A","explanation":"Human resources/personnel is responsible for hiring and firing (authorizing additions/deletions), preventing ghost employees."}]},{"id":"AT-10005","code":"AT-10005","title":"The Auditor's Responses to Assessed Risks (PSA 330)","standards":"PSA 330","questionCount":40,"summary":"Overall Responses at Financial Statement Level, Audit Procedures Responsive to Risks at Assertion Level (Nature, Timing, Extent), Tests of Controls (Operating Effectiveness, Dual-Purpose Tests, Rotation of Testing), Substantive Procedures (Tests of Details, Substantive Analytical Procedures), Financial Statement Closing Process, and Documentation.","lectureOutline":"### PSA 330: THE AUDITOR’S RESPONSES TO ASSESSED RISKS\n\n#### Overall Responses at the Financial Statement Level\nThe auditor shall design and implement overall responses to address assessed RMM at the financial statement level:\n- Emphasizing to the audit team the need to maintain professional skepticism.\n- Assigning more experienced staff or those with special skills or using experts.\n- Providing more supervision.\n- Incorporating additional elements of unpredictability in the selection of further audit procedures.\n- Making general changes to the nature, timing, or extent of audit procedures.\n\n---\n\n### Audit Procedures Responsive to Risks at the Assertion Level\nIn designing further audit procedures, the auditor shall:\n1. Consider the reasons for the assessment given to the risk of material misstatement at the assertion level (inherent risk and control risk).\n2. Obtain more persuasive evidence the higher the auditor’s assessment of risk.\n\n#### Nature, Timing, and Extent\n- **Nature:** Purpose (tests of controls or substantive procedures) and Type (inspection, observation, inquiry, confirmation, recalculation, reperformance, analytical procedures).\n- **Timing:** When procedures are performed (interim vs. period-end) or period to which evidence applies.\n- **Extent:** Quantity of a specific procedure (sample size).\n\n---\n\n### TESTS OF CONTROLS\nThe auditor is **required** to perform tests of controls when:\n1. The auditor’s risk assessment includes an expectation of the operating effectiveness of controls; or\n2. Substantive procedures alone cannot provide sufficient appropriate audit evidence at the assertion level (e.g. highly automated systems).\n\n- **Dual-Purpose Tests:** Tests designed to evaluate operating effectiveness of controls and detect monetary misstatements at the same time (e.g. inspecting an invoice for approval while testing its pricing and mathematical accuracy).\n- **Rotation Testing of Controls:** If controls have not changed and do not address significant risks, the auditor shall test operating effectiveness at least once in every **three audits**, and shall test some controls each audit.\n\n---\n\n### SUBSTANTIVE PROCEDURES\nIrrespective of the assessed risks of material misstatement, the auditor shall design and perform substantive procedures for each material class of transactions, account balance, and disclosure.\n- **Tests of details** (of transactions, balances, disclosures).\n- **Substantive analytical procedures**.\n\n#### Financial Statement Closing Process\nSubstantive procedures must always include:\n- Agreeing or reconciling the financial statements with the underlying accounting records.\n- Examining material journal entries and other adjustments made during the course of preparing the financial statements.","items":[{"id":"AT10005_Q1","n":1,"stem":"Auditors can use several types of audit procedures to test controls. Which of the following types of audit procedures is least likely to be used during tests of controls?","opts":[{"label":"A","text":"Physical examination of assets"},{"label":"B","text":"Inquiries of client personnel"},{"label":"C","text":"Examination of documents, records, and reports"},{"label":"D","text":"Observation of control-related activities."}],"ans":"A","explanation":"Physical examination of assets tests existence and condition (substantive test of detail), not control effectiveness."},{"id":"AT10005_Q2","n":2,"stem":"Which of the following types of evidence will be gathered in order to test internal controls?","opts":[{"label":"A","text":"Confirmations of accounts receivable with customers."},{"label":"B","text":"Observation of client personnel receiving inventory shipments."},{"label":"C","text":"Observation of inventory counts."},{"label":"D","text":"Inquiry of management regarding significant litigation."}],"ans":"B","explanation":"Observing client personnel perform receiving and inspection controls directly tests the operation of controls."},{"id":"AT10005_Q3","n":3,"stem":"Control risk should be assessed in terms of","opts":[{"label":"A","text":"Specific control procedures."},{"label":"B","text":"Types of potential fraud."},{"label":"C","text":"Financial statement assertions."},{"label":"D","text":"Control environment factors."}],"ans":"C","explanation":"Control risk is assessed at the financial statement assertion level."},{"id":"AT10005_Q4","n":4,"stem":"Tests of controls are used to test whether controls are:","opts":[{"label":"A","text":"Operating effectively"},{"label":"B","text":"Properly documented by the client"},{"label":"C","text":"Placed in operation or implemented"},{"label":"D","text":"Properly incorporated in the financial statements"}],"ans":"A","explanation":"Tests of controls evaluate operating effectiveness in preventing or detecting material misstatements."},{"id":"AT10005_Q5","n":5,"stem":"Which of the following is ordinarily considered a test of internal control procedures?","opts":[{"label":"A","text":"Send confirmation letters to banks."},{"label":"B","text":"Count and list cash on hand."},{"label":"C","text":"Examine signatures on checks."},{"label":"D","text":"Obtain or prepare reconciliation of bank accounts as of the balance sheet date."}],"ans":"C","explanation":"Examining signatures on checks tests compliance with check signing and authorization control policies."},{"id":"AT10005_Q6","n":6,"stem":"Auditors can use several types of audit procedures to test controls. Which of the following types of audit procedures is least likely to be used during tests of controls?","opts":[{"label":"A","text":"Physical examination of assets"},{"label":"B","text":"Inquiries of client personnel"},{"label":"C","text":"Examination of documents, records, and reports"},{"label":"D","text":"Observation of control-related activities."}],"ans":"A","explanation":"Physical examination of assets is primarily substantive, not a test of control."},{"id":"AT10005_Q7","n":7,"stem":"Which of the following statements is true?","opts":[{"label":"A","text":"Tests of controls are necessary if the auditor plans to use the primarily substantive approach."},{"label":"B","text":"Tests of controls are necessary if the auditor plans to assess the level of control risk at maximum."},{"label":"C","text":"The auditor can simultaneously obtain an understanding of internal control and perform tests of controls."},{"label":"D","text":"After performing tests of controls, the auditor will always assess control risk at maximum."}],"ans":"C","explanation":"An auditor can perform concurrent tests of controls while obtaining an understanding of internal control."},{"id":"AT10005_Q8","n":8,"stem":"As a result of control testing, a CPA has decided to reduce control risk. What is the impact on substantive testing sample size if all other factors remain constant?","opts":[{"label":"A","text":"The sample size would be irrelevant."},{"label":"B","text":"The sample size would be higher."},{"label":"C","text":"The sample size would be lower."},{"label":"D","text":"The sample size would be unaffected."}],"ans":"C","explanation":"Lower control risk allows higher acceptable detection risk, resulting in smaller substantive test sample sizes."},{"id":"AT10005_Q9","n":9,"stem":"The audit risk against which the auditor and those who rely on his or her opinion require reasonable protection is a combination of two separate risks at the assertion level. The first risk is that balances, classes of transactions, or disclosures contain material misstatements. The second is that","opts":[{"label":"A","text":"The auditor will reject a correct account balance as incorrect."},{"label":"B","text":"Material misstatements that occur will not be detected by the audit."},{"label":"C","text":"The auditor will apply an inappropriate audit procedure."},{"label":"D","text":"The auditor will apply an inappropriate measure of audit materiality."}],"ans":"B","explanation":"The two components are: risk of material misstatement occurring (IR x CR), and risk of failing to detect it (Detection Risk)."},{"id":"AT10005_Q10","n":10,"stem":"The acceptable level of detection risk is inversely related to the","opts":[{"label":"A","text":"Assurance provided by substantive tests."},{"label":"B","text":"Risk of misplaying auditing procedures."},{"label":"C","text":"Preliminary judgment about materiality levels."},{"label":"D","text":"Risk of failing to discover material misstatements."}],"ans":"A","explanation":"As acceptable detection risk decreases, the required assurance provided by substantive tests increases."},{"id":"AT10005_Q11","n":11,"stem":"Which of the following statements about the auditor’s response to assessed risks of material misstatement in a financial statement audit is true?","opts":[{"label":"A","text":"When the risks of material misstatement are high, an auditor should reduce the amount of substantive testing."},{"label":"B","text":"Reliance on internal control may be sufficient to allow the auditor to eliminate substantive testing for significant transaction classes."},{"label":"C","text":"When assessing the risks of material misstatement, an auditor should not consider evidence obtained in prior audits about the operation of controls."},{"label":"D","text":"Risk assessment procedures performed to obtain an understanding of an entity’s internal control also may serve as tests of controls."}],"ans":"D","explanation":"Procedures performed to obtain an understanding of internal control may provide evidence of operating effectiveness (dual-purpose)."},{"id":"AT10005_Q12","n":12,"stem":"In a financial statement audit, the auditor is required to perform tests of controls when\nI. The auditor’s risk assessment includes an expectation of the operating effectiveness of controls.\nII. When substantive procedures alone do not provide sufficient appropriate audit evidence at the assertion level.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Either I or II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"Under PSA 330, TOC is required either when relying on controls or when substantive procedures alone are insufficient."},{"id":"AT10005_Q13","n":13,"stem":"After gaining an understanding of internal control and assessing the risks of material misstatement, an auditor decided to perform tests of controls. The auditor most likely decided that","opts":[{"label":"A","text":"Additional evidence to support a further reduction in control risk is not available."},{"label":"B","text":"It is not possible or practicable to reduce the risks of material misstatement at the assertion level to an acceptably low level with audit evidence obtained only from substantive test procedures."},{"label":"C","text":"There were many internal control weaknesses that could allow misstatements to enter the accounting system."},{"label":"D","text":"An increase in the assessed level of control risk is justified for certain financial statement assertions."}],"ans":"B","explanation":"When substantive tests alone cannot provide sufficient evidence, tests of controls must be performed."},{"id":"AT10005_Q14","n":14,"stem":"Tests of controls are concerned primarily with each of the following questions, except","opts":[{"label":"A","text":"By whom were the controls applied?"},{"label":"B","text":"Were the necessary controls consistently performed?"},{"label":"C","text":"How were the controls applied?"},{"label":"D","text":"Why were the controls applied?"}],"ans":"D","explanation":"Tests of controls address How, When/Consistency, and By Whom controls were applied, not Why they were applied."},{"id":"AT10005_Q15","n":15,"stem":"How frequently must an auditor test operating effectiveness of controls that appear to function as they have in past years and on which the auditor wishes to rely in the current year?","opts":[{"label":"A","text":"Monthly."},{"label":"B","text":"Annually."},{"label":"C","text":"At least every second audit."},{"label":"D","text":"At least every third audit."}],"ans":"D","explanation":"Under PSA 330, controls not changing must be tested at least once in every three audits."},{"id":"AT10005_Q16","n":16,"stem":"An auditor intends to perform tests of control on a client’s cash disbursements procedures. If the control procedures leave no audit trail of documentary evidence, the auditor most likely will test the procedures by","opts":[{"label":"A","text":"Inquiry and analytical procedures."},{"label":"B","text":"Inquiry and observation."},{"label":"C","text":"Analytical procedures and confirmation."},{"label":"D","text":"Confirmation and observation."}],"ans":"B","explanation":"Where controls leave no documentary trail, inquiry and direct observation are the primary test procedures."},{"id":"AT10005_Q17","n":17,"stem":"Before assessing control risk at a level lower than the m
