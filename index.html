led with false records).\n\n#### Responsibilities\n- **Management & TCWG:** Primary responsibility for prevention and detection of fraud.\n- **Auditor:** Obtain reasonable assurance that FS as a whole are free from material misstatement, maintaining professional skepticism throughout.\n- **Risk of Management Fraud:** Higher than employee fraud because management can manipulate accounting records and override controls.\n\n#### Auditor Responses to Fraud Risk\n- Assign experienced staff / experts.\n- Evaluate accounting policies for earnings management.\n- Incorporate unpredictability into audit procedures.\n- Address management override: test journal entries, review estimates for bias, evaluate business rationale of significant unusual transactions.\n\n---\n\n### PSA 250: CONSIDERATION OF LAWS AND REGULATIONS IN AN AUDIT OF FINANCIAL STATEMENTS\n- **Noncompliance:** Acts of omission or commission contrary to prevailing laws or regulations (excludes personal misconduct unrelated to business).\n- **Categories:**\n  1. *Direct Effect on FS amounts/disclosures* (tax laws, pension regulations): Obtain sufficient appropriate audit evidence regarding compliance.\n  2. *Other Laws Fundamental to Operating Aspects* (environmental, labor, operating licenses): Inquire of management and inspect correspondence with licensing/regulatory authorities.\n- **Reporting:** Report noncompliance to TCWG as soon as practicable. If material effect is uncorrected, issue a **qualified or adverse opinion**. If precluded from obtaining evidence, issue a **qualified or disclaimer of opinion**.\n\n---\n\n### PSA 260: COMMUNICATION WITH THOSE CHARGED WITH GOVERNANCE (TCWG)\n- **Those Charged with Governance:** Person(s) or organization(s) with responsibility for overseeing strategic direction and accountability (e.g., Board of Directors, Audit Committee).\n- **Matters Communicated:**\n  - Auditor's responsibilities in relation to the audit.\n  - Planned scope and timing of the audit.\n  - Significant findings from the audit (qualitative aspects of accounting practices, significant difficulties, uncorrected misstatements).\n  - Auditor independence (for listed entities).\n- **Form:** In writing regarding significant findings when oral communication is inadequate.","items":[{"id":"AT10008_Q1","n":1,"stem":"Which of the following best defines fraud in a financial statement auditing context?","opts":[{"label":"A","text":"Fraud is an unintentional misstatement of the financial statements."},{"label":"B","text":"Fraud is an intentional misstatement of the financial statements."},{"label":"C","text":"Fraud is either an intentional or unintentional misstatement of the financial statements, depending on materiality."},{"label":"D","text":"Fraud is either an intentional or unintentional misstatement of the financial statements, depending on consistency."}],"ans":"B","explanation":"Under PSA 240, fraud is distinguished from error by being an intentional misstatement."},{"id":"AT10008_Q2","n":2,"stem":"Fraud involving one or more members of management or those charged with governance is referred to as","opts":[{"label":"A","text":"Management fraud."},{"label":"B","text":"Employee fraud."},{"label":"C","text":"Fraudulent financial reporting."},{"label":"D","text":"Misappropriation of assets."}],"ans":"A","explanation":"Fraud involving management or TCWG is termed management fraud."},{"id":"AT10008_Q3","n":3,"stem":"Fraudulent financial reporting involves intentional misstatements including omissions of amounts or disclosures in financial statements to deceive financial statement users. It may be accomplished in a number of ways, including","opts":[{"label":"A","text":"Embezzling receipts."},{"label":"B","text":"Stealing physical assets or intellectual property."},{"label":"C","text":"Using an entity’s assets for personal use."},{"label":"D","text":"Manipulation, falsification, or alteration of accounting records or supporting documentation from which the financial statements are prepared."}],"ans":"D","explanation":"Manipulating or altering accounting records is a primary method of fraudulent financial reporting."},{"id":"AT10008_Q4","n":4,"stem":"Which of the following conditions are generally present when misstatements due to fraud occur?\nI. Incentive or pressure.\nII. Perceived opportunity.\nIII. Rationalization.","opts":[{"label":"A","text":"I and II only."},{"label":"B","text":"II and III only."},{"label":"C","text":"I and III only."},{"label":"D","text":"I, II, and III."}],"ans":"D","explanation":"These three conditions form the classic Fraud Triangle under PSA 240."},{"id":"AT10008_Q5","n":5,"stem":"Who is most likely to perpetrate fraudulent financial reporting?","opts":[{"label":"A","text":"Members of the board of directors."},{"label":"B","text":"Production employees."},{"label":"C","text":"Management of the company."},{"label":"D","text":"The internal auditors."}],"ans":"C","explanation":"Management has the authority, incentive, and ability to override controls and manipulate financial reports."},{"id":"AT10008_Q6","n":6,"stem":"The following are examples of fraud risk factors relating to misstatements arising from misappropriation of assets, except","opts":[{"label":"A","text":"Recurring negative cash flows from operating activities while reporting earnings and earnings growth."},{"label":"B","text":"Inadequate physical safeguards over cash, investments, inventory, or fixed assets."},{"label":"C","text":"Inadequate segregation of duties or independent checks."},{"label":"D","text":"Adverse relationship between the entity and employees with access to cash or other assets susceptible to theft created by recent changes made to employee compensation or benefit plans."}],"ans":"A","explanation":"Recurring negative cash flows while reporting earnings growth is a risk factor for fraudulent financial reporting, not misappropriation of assets."},{"id":"AT10008_Q7","n":7,"stem":"Opportunities to misappropriate assets increase when there are","opts":[{"label":"A","text":"Known or anticipated future employee layoffs."},{"label":"B","text":"Promotions, compensation, or other rewards inconsistent with expectations."},{"label":"C","text":"Recent or anticipated changes to employee compensation or benefit plans."},{"label":"D","text":"Inventory items that are small in size, of high value, or in high demand."}],"ans":"D","explanation":"Small, high-value, easily convertible inventory items provide high perceived opportunity for asset misappropriation."},{"id":"AT10008_Q8","n":8,"stem":"Which of the following conditions or events may create incentives/pressures to commit fraud?","opts":[{"label":"A","text":"Inadequate system of authorization and approval of transactions."},{"label":"B","text":"Lack of mandatory vacations for employees performing key control functions."},{"label":"C","text":"Excessive pressure on management or operating personnel to meet financial targets established by those charged with governance, including sales or profitability incentive goals."},{"label":"D","text":"Inadequate access controls over automated records."}],"ans":"C","explanation":"Excessive pressure to meet aggressive financial targets creates incentives/pressures to commit fraudulent financial reporting."},{"id":"AT10008_Q9","n":9,"stem":"Which of the following statements is correct about an auditor’s responsibility regarding consideration of fraud in a financial statement audit?","opts":[{"label":"A","text":"The auditor should consider the client’s internal control and plan and perform the audit to provide absolute assurance of detecting all material misstatements."},{"label":"B","text":"The auditor should assess the risk that errors may cause the financial statements to contain any misstatements and determine whether the necessary controls are prescribed and are being followed satisfactorily."},{"label":"C","text":"The auditor should consider the types of misstatements that could occur and perform tests on 100% of the information subject to misstatement."},{"label":"D","text":"The auditor should assess the risks of material misstatement due to fraud."}],"ans":"D","explanation":"The auditor is required under PSA 240 to assess the risks of material misstatement due to fraud."},{"id":"AT10008_Q10","n":10,"stem":"Which action regarding fraud is an activity related to performance of risk assessment procedures?","opts":[{"label":"A","text":"Consider whether estimates prepared and recorded by management could indicate a bias in reporting."},{"label":"B","text":"Consider the characteristics of journal entries, particularly those made near year end."},{"label":"C","text":"Document the results of procedures used to address the risk of fraud."},{"label":"D","text":"Discussions among the engagement team members regarding the risks of material misstatement due to fraud."}],"ans":"D","explanation":"Engagement team discussion (brainstorming) regarding fraud susceptibility is part of risk assessment procedures (PSA 315/240)."},{"id":"AT10008_Q11","n":11,"stem":"When the auditor identifies a misstatement in the financial statements, the auditor should consider whether such a misstatement may be indicative of fraud and if there is such an indication, the auditor should","opts":[{"label":"A","text":"Consider the implications of the misstatement in relation to other aspects of the audit."},{"label":"B","text":"Withdraw from the engagement."},{"label":"C","text":"Communicate the information to regulatory and enforcement authorities."},{"label":"D","text":"Report the matter to the person or persons who made the audit appointment."}],"ans":"A","explanation":"When misstatement is indicative of fraud, the auditor evaluates implications for management integrity and other audit aspects."},{"id":"AT10008_Q12","n":12,"stem":"As used in PSA 250 (Consideration of Laws and Regulations in an Audit of Financial Statements), this term refers to acts of omission or commission by the entity being audited, either intentional or unintentional, which are contrary to prevailing laws or regulations.","opts":[{"label":"A","text":"Noncompliance"},{"label":"B","text":"Illegal acts"},{"label":"C","text":"Erotic acts"},{"label":"D","text":"Unforgivable acts"}],"ans":"A","explanation":"The standard term in PSA 250 is \"Noncompliance\"."},{"id":"AT10008_Q13","n":13,"stem":"In order to plan the audit, the auditor should obtain a general understanding of the legal and regulatory framework applicable to the entity and the industry and how the entity is complying with that framework. To obtain this understanding, the following procedures would ordinarily be considered by the auditor, except","opts":[{"label":"A","text":"Use the existing understanding of the entity’s industry, regulatory, and other external factors."},{"label":"B","text":"Inquire of management concerning the entity’s policies and procedures regarding compliance with laws and regulations."},{"label":"C","text":"Inquire of management as to the laws and regulations that may be expected to have a fundamental effect on the operations of the entity."},{"label":"D","text":"Inspect correspondence with relevant licensing or regulatory authorities."}],"ans":"D","explanation":"Inspecting correspondence with regulatory authorities is performed during the audit to identify noncompliance, not just during preliminary planning understanding."},{"id":"AT10008_Q14","n":14,"stem":"If the auditor concludes that the noncompliance has a material effect on the financial statements, and has not been properly reflected in the financial statements, the auditor should express","opts":[{"label":"A","text":"A qualified or an adverse opinion."},{"label":"B","text":"A qualified opinion or a disclaimer of opinion."},{"label":"C","text":"A disclaimer of opinion."},{"label":"D","text":"A qualified opinion."}],"ans":"A","explanation":"Material uncorrected misstatements due to noncompliance warrant a qualified or adverse opinion (PSA 705)."},{"id":"AT10008_Q15","n":15,"stem":"If the auditor is precluded by the entity from obtaining sufficient appropriate audit evidence to evaluate whether noncompliance that may be material to the financial statements, has, or is likely to have, occurred, the auditor should express","opts":[{"label":"A","text":"A qualified opinion or an adverse opinion."},{"label":"B","text":"A qualified opinion or a disclaimer of opinion."},{"label":"C","text":"An adverse opinion."},{"label":"D","text":"An adverse opinion or a disclaimer of opinion."}],"ans":"B","explanation":"A scope limitation (inability to obtain evidence) warrants a qualified opinion or a disclaimer of opinion."},{"id":"AT10008_Q16","n":16,"stem":"Under PSA 260, this term is used to describe the role of persons entrusted with the supervision, control, and direction of an entity.","opts":[{"label":"A","text":"Oversight."},{"label":"B","text":"Governance."},{"label":"C","text":"Direction."},{"label":"D","text":"Control."}],"ans":"B","explanation":"PSA 260 defines \"Governance\" as describing the role of persons entrusted with supervision, control and direction."},{"id":"AT10008_Q17","n":17,"stem":"According to PSA 260, those matters that arise from the audit of financial statements and, in the opinion of the auditor, are both important and relevant to those charged with governance in overseeing the financial reporting and disclosure process are called","opts":[{"label":"A","text":"Audit matters of governance interest."},{"label":"B","text":"Significant audit matters."},{"label":"C","text":"Auditor’s findings."},{"label":"D","text":"Material misstatements in the financial statements."}],"ans":"A","explanation":"These matters are designated as \"Audit matters of governance interest\"."},{"id":"AT10008_Q18","n":18,"stem":"Which of the following statements relating to communication of audit matters of governance interest is incorrect?","opts":[{"label":"A","text":"Audit matters of governance interest include only those matters that have come to the attention of the auditor as a result of the performance of the audit."},{"label":"B","text":"In an audit in accordance with PSAs, the auditor should design audit procedures for the specific purpose of identifying matters of governance interest."},{"label":"C","text":"The auditor should identify relevant persons who are charged with governance and with whom audit matters of governance interest are to be communicated."},{"label":"D","text":"The auditor’s communications with those charged with governance may be made orally or in writing."}],"ans":"B","explanation":"Audits in accordance with PSAs are NOT designed specifically to identify all matters of governance interest; they communicate matters coming to attention during the audit."},{"id":"AT10008_Q19","n":19,"stem":"Audit matters of governance interest to be communicated to those charged with governance ordinarily include","opts":[{"label":"A","text":"Audit adjustments, whether or not recorded by the entity that have, or could have, a material effect on its financial statements."},{"label":"B","text":"Expected modifications to the auditor’s report."},{"label":"C","text":"Material uncertainties related to events and conditions that may cast significant doubt on the entity’s ability to continue as a going concern."},{"label":"D","text":"All of the above."}],"ans":"D","explanation":"All of these items are required communications with TCWG under PSA 260."},{"id":"AT10008_Q20","n":20,"stem":"PSA 260 requires the auditor to determine the relevant persons who are charged with governance and with whom audit matters of governance interest are communicated. For corporations covered by the SEC Code of Corporate Governance, which of the following is primarily responsible for corporate governance?","opts":[{"label":"A","text":"President."},{"label":"B","text":"Controller."},{"label":"C","text":"Board of Directors."},{"label":"D","text":"Management."}],"ans":"C","explanation":"The Board of Directors is primarily responsible for corporate governance."}]},{"id":"AT-10009","code":"AT-10009","title":"Audit Sampling (PSA 530)","standards":"PSA 530","questionCount":35,"summary":"Statistical vs Nonstatistical Sampling, Attribute Sampling (Tests of Controls) vs Variables Sampling (Substantive Tests), Sampling Risk (Alpha/Type I Risk, Beta/Type II Risk), Nonsampling Risk, Tolerable Deviation Rate, Expected Error, Sample Selection Methods (Random, Systematic, Stratification, Haphazard, Block), Classical Variables Techniques (Mean-Per-Unit, Difference, Ratio), Probability-Proportional-to-Size (PPS), and Sample Size Factors.","lectureOutline":"### PSA 530: AUDIT SAMPLING\nApplication of audit procedures to less than 100% of items within an account balance or class of transactions such that all sampling units have a chance of selection.\n\n#### Statistical vs. Nonstatistical Sampling\n- **Statistical:** Random selection + use of probability theory to evaluate sample results (including measurement of sampling risk).\n- **Nonstatistical:** Does not possess both characteristics. Both require professional judgment.\n\n#### Types of Sampling Plans\n1. **Attribute Sampling:** Applicable to tests of controls (estimates rate of deviation/occurrence).\n   - *Techniques:* Attribute estimation, Sequential (stop-or-go) sampling, Discovery sampling (used when expected deviation rate is near zero, e.g. fraud).\n2. **Variables Sampling:** Applicable to substantive testing (estimates monetary amount or correctness of account balance).\n   - *Techniques:* Mean-per-unit, Difference estimation, Ratio estimation, Probability-Proportional-to-Size (PPS / Dollar-unit sampling).\n\n---\n\n### SAMPLING RISK & AUDIT EFFICIENCY VS. EFFECTIVENESS\n\n| Type of Test | Sampling Risk Aspect | Also Called | Impact on Audit |\n|---|---|---|---|\n| **Test of Controls** | Risk of assessing control risk **too low** | Beta risk / Type II risk / Overreliance | **Effectiveness** (may lead to inappropriate unmodified opinion) |\n| **Test of Controls** | Risk of assessing control risk **too high** | Alpha risk / Type I risk / Underreliance | **Efficiency** (leads to unnecessary additional work) |\n| **Substantive Test** | Risk of **incorrect acceptance** | Beta risk / Type II risk | **Effectiveness** (material error not detected) |\n| **Substantive Test** | Risk of **incorrect rejection** | Alpha risk / Type I risk | **Efficiency** (unnecessary additional audit procedures) |\n\n---\n\n### SAMPLE SELECTION METHODS\n- **Random Number Sampling:** Equal chance for all items; uses random number tables or software.\n- **Systematic Selection:** Population divided by sample size = interval (e.g., every 50th item from random starting point). Must watch for population cyclical patterns.\n- **Stratification:** Subdividing population into homogenous subpopulations/strata (often by monetary value). Reduces variability and allows smaller sample size.\n- **Haphazard Selection:** Auditor selects without structured technique; NOT valid for statistical sampling.\n- **Block / Cluster Selection:** Selecting contiguous items; rarely appropriate for audit sampling.\n\n---\n\n### FACTORS INFLUENCING SAMPLE SIZE\n\n#### For Tests of Controls:\n- Reliance on controls: **Increases** sample size\n- Tolerable deviation rate: **Decreases** sample size (inverse relationship)\n- Expected deviation rate: **Increases** sample size (direct relationship)\n- Required confidence level: **Increases** sample size\n- Population size: **Negligible effect** (for large populations)\n\n#### For Substantive Procedures:\n- Assessed inherent/control risk: **Increases** sample size\n- Use of other substantive procedures: **Decreases** sample size\n- Required confidence level: **Increases** sample size\n- Tolerable error: **Decreases** sample size\n- Expected error: **Increases** sample size\n- Stratification: **Decreases** sample size","items":[{"id":"AT10009_Q1","n":1,"stem":"Audit sampling involves the","opts":[{"label":"A","text":"Selection of all items over a certain amount."},{"label":"B","text":"Application of audit procedures to less than 100% of items within a class of transactions or an account balance such that all items have a chance of selection."},{"label":"C","text":"Application of audit procedures to all items that comprise a class of transactions or an account balance."},{"label":"D","text":"Application of audit procedures to all items over a certain amount and those that are unusual or have a history of error."}],"ans":"B","explanation":"Under PSA 530, audit sampling involves testing less than 100% of items such that all items have a chance of selection."},{"id":"AT10009_Q2","n":2,"stem":"Population, as defined in PSA 530, means the entire set of data from which a sample is selected and about which the auditor wishes to draw conclusions. It is important for the auditor to ensure that the population is\nI. Appropriate to the objective of the audit procedure.\nII. Complete.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"The population must be both appropriate to the audit objective and complete."},{"id":"AT10009_Q3","n":3,"stem":"An advantage of statistical over nonstatistical sampling methods in tests of controls is that the statistical methods","opts":[{"label":"A","text":"Afford greater assurance than a nonstatistical sample of equal size."},{"label":"B","text":"Provide an objective basis for quantitatively evaluating sampling risks."},{"label":"C","text":"Can more easily convert the sample into a dual-purpose test useful for substantive testing."},{"label":"D","text":"Eliminate the need to use judgment in determining appropriate sample sizes."}],"ans":"B","explanation":"Statistical sampling allows quantitative measurement and mathematical evaluation of sampling risk."},{"id":"AT10009_Q4","n":4,"stem":"The risk of incorrect acceptance and the likelihood of assessing control risk too low relate to the","opts":[{"label":"A","text":"Effectiveness of the audit."},{"label":"B","text":"Efficiency of the audit."},{"label":"C","text":"Preliminary estimates of materiality levels."},{"label":"D","text":"Tolerable misstatement."}],"ans":"A","explanation":"Both risks (Beta / Type II risks) affect audit effectiveness and may lead to issuing an inappropriate unmodified opinion."},{"id":"AT10009_Q5","n":5,"stem":"The likelihood of assessing control risk too high is the risk that the sample selected to test controls","opts":[{"label":"A","text":"Does not support the auditor’s planned assessed level of control risk when the true operating effectiveness of internal control justifies such an assessment."},{"label":"B","text":"Contains misstatements that could be material to the financial statements when aggregated with misstatements in other account balances of transactions classes."},{"label":"C","text":"Contains proportionately fewer deviations from prescribed internal controls than exist in the balance or class as a whole."},{"label":"D","text":"Does not support the tolerable misstatement for some or all of management’s assertions."}],"ans":"A","explanation":"Assessing CR too high (underreliance) occurs when sample deviations are higher than the population rate, leading the auditor to believe controls are worse than they actually are."},{"id":"AT10009_Q6","n":6,"stem":"While performing a test of details during an audit, the auditor determined that the sample results supported the conclusion that the recorded account balance was materially misstated. It was, in fact, not materially misstated. This situation illustrates the risk of","opts":[{"label":"A","text":"Incorrect rejection"},{"label":"B","text":"Incorrect acceptance"},{"label":"C","text":"Assessing control risk too low"},{"label":"D","text":"Assessing control risk too high"}],"ans":"A","explanation":"Concluding that a balance is materially misstated when it is in fact fairly stated is the risk of incorrect rejection (Alpha risk)."},{"id":"AT10009_Q7","n":7,"stem":"Which of the following sample planning factors would influence the sample size for a substantive test of details for a specific account?\nExpected Error | Tolerable Error","opts":[{"label":"A","text":"No | No"},{"label":"B","text":"Yes | Yes"},{"label":"C","text":"No | Yes"},{"label":"D","text":"Yes | No"}],"ans":"B","explanation":"Both expected error and tolerable error directly determine substantive sample size."},{"id":"AT10009_Q8","n":8,"stem":"An underlying feature of random-based selection of items is that each","opts":[{"label":"A","text":"Stratum of the accounting population be given equal representation in the sample."},{"label":"B","text":"Item in the accounting population be randomly ordered."},{"label":"C","text":"Item in the accounting population should have an opportunity to be selected."},{"label":"D","text":"Item must be systematically selected using replacement."}],"ans":"C","explanation":"In random selection, every item in the population has a known and non-zero chance of selection."},{"id":"AT10009_Q9","n":9,"stem":"Which of the following best illustrates the concept of sampling risk?","opts":[{"label":"A","text":"A randomly chosen sample may not be representative of the population as a whole on the characteristic of interest."},{"label":"B","text":"An auditor may select audit procedures that are not appropriate to achieve the specific objective."},{"label":"C","text":"An auditor may fail to recognize errors in the documents examined for the chosen sample."},{"label":"D","text":"The documents related to the chosen sample may not be available for inspection."}],"ans":"A","explanation":"Sampling risk arises because a sample may not be representative of the underlying population."},{"id":"AT10009_Q10","n":10,"stem":"Which of the following statistical selection techniques is least desirable for use by an auditor?","opts":[{"label":"A","text":"Systematic selection"},{"label":"B","text":"Stratified selection"},{"label":"C","text":"Block selection"},{"label":"D","text":"Sequential selection"}],"ans":"C","explanation":"Block selection selects contiguous items which cannot ordinarily yield valid inferences about the entire population."},{"id":"AT10009_Q11","n":11,"stem":"The expected population deviation rate of client billing errors is 3%. The auditor has established a tolerable rate of 5%. In the review of client invoices the auditor should use","opts":[{"label":"A","text":"Stratified sampling"},{"label":"B","text":"Variable sampling"},{"label":"C","text":"Discovery sampling"},{"label":"D","text":"Attribute sampling"}],"ans":"D","explanation":"Testing for control deviations or billing errors is an attribute sampling application."},{"id":"AT10009_Q12","n":12,"stem":"Which of the following sampling methods would be used to estimate a numerical measurement of a population, such as a peso value?","opts":[{"label":"A","text":"Attributes sampling"},{"label":"B","text":"Stop-or-go sampling"},{"label":"C","text":"Variables sampling"},{"label":"D","text":"Random-number sampling"}],"ans":"C","explanation":"Variables sampling is used to estimate numerical amounts (such as peso values)."},{"id":"AT10009_Q13","n":13,"stem":"Which of the following statements is correct concerning statistical sampling in tests of controls?","opts":[{"label":"A","text":"Deviations from control procedures at a given rate usually result in misstatements at a higher rate."},{"label":"B","text":"As the population size doubles, the sample size should also double."},{"label":"C","text":"The qualitative aspects of deviations are not considered by the auditor."},{"label":"D","text":"There is an inverse relationship between the sample size and the tolerable rate."}],"ans":"D","explanation":"As the tolerable deviation rate decreases, the required sample size increases (inverse relationship)."},{"id":"AT10009_Q14","n":14,"stem":"Which of the following statistical sampling plans does not use a fixed sample size for tests of controls?","opts":[{"label":"A","text":"Attributes sampling"},{"label":"B","text":"Sequential sampling"},{"label":"C","text":"PPS sampling"},{"label":"D","text":"Variables sampling"}],"ans":"B","explanation":"Sequential (stop-or-go) sampling evaluates evidence in steps without a predetermined single fixed sample size."},{"id":"AT10009_Q15","n":15,"stem":"If certain forms are not consecutively numbered","opts":[{"label":"A","text":"Selection of a random sample probably is not possible."},{"label":"B","text":"Systematic sampling may be appropriate."},{"label":"C","text":"Stratified sampling should be used."},{"label":"D","text":"Random number tables cannot be used."}],"ans":"B","explanation":"Systematic selection (counting every nth physical document) remains practical even when documents are not prenumbered."},{"id":"AT10009_Q16","n":16,"stem":"When performing a test of a control with respect to control over cash receipts, an auditor may use a systematic sampling technique with a start at any randomly selected item. The biggest disadvantage of this type of sampling is that the items in the population","opts":[{"label":"A","text":"Must be systematically replaced in the population after sampling."},{"label":"B","text":"May systematically occur more than once in the sample."},{"label":"C","text":"Must be recorded in a systematic pattern before the sample can be drawn."},{"label":"D","text":"May occur in a systematic pattern, thus destroying the sample randomness."}],"ans":"D","explanation":"If population items coincide with a cyclical or systematic pattern that matches the interval, randomness and representativeness are destroyed."},{"id":"AT10009_Q17","n":17,"stem":"In testing accounts receivable, an auditor sends out positive confirmation requests to 100 randomly selected customers. A customer returns the confirmation indicating that the balance is correct when, in fact, the balance is overstated. This is an example of:","opts":[{"label":"A","text":"Projected misstatement"},{"label":"B","text":"Sampling error"},{"label":"C","text":"Standard error"},{"label":"D","text":"Nonsampling error"}],"ans":"D","explanation":"Erroneous confirmation response by a customer is an audit evidence failure not caused by sample size (nonsampling error)."},{"id":"AT10009_Q18","n":18,"stem":"An auditor is testing internal control procedures that are evidenced on an entity’s vouchers by matching random numbers with voucher numbers. If a random number matches the number of a voided voucher, that voucher ordinarily should be replaced by another voucher in the random sample if the voucher","opts":[{"label":"A","text":"Constitutes a deviation."},{"label":"B","text":"Has been properly voided."},{"label":"C","text":"Cannot be located."},{"label":"D","text":"Represents an immaterial peso amount."}],"ans":"B","explanation":"If a selected voucher was properly voided, it is not a deviation and should be replaced with another randomly selected voucher."},{"id":"AT10009_Q19","n":19,"stem":"An auditor plans to examine a sample of 20 purchase orders for proper approvals as prescribed by the client’s internal control procedures. One of the purchase orders in the chosen sample cannot be found, and the auditor is unable to use alternative procedures to test whether that purchase was properly approved. The auditor should","opts":[{"label":"A","text":"Choose another purchase order to replace the missing purchase order in the sample."},{"label":"B","text":"Consider this test of control invalid and proceed with substantive tests since internal control cannot be relied upon."},{"label":"C","text":"Treat the missing purchase order as a deviation for the purpose of evaluating the sample."},{"label":"D","text":"Select a completely new set of 20 purchase orders."}],"ans":"C","explanation":"If an item cannot be tested or located, it must be treated as a deviation."},{"id":"AT10009_Q20","n":20,"stem":"The tolerable rate of deviations for a test of a control is generally","opts":[{"label":"A","text":"Lower than the expected rate of errors in the related accounting records."},{"label":"B","text":"Higher than the expected rate of errors in the related accounting records."},{"label":"C","text":"Identical to the expected rate of errors in the related accounting records."},{"label":"D","text":"Unrelated to the expected rate of errors in the related accounting records."}],"ans":"B","explanation":"Tolerable rate must exceed expected rate; otherwise testing controls is not worthwhile."},{"id":"AT10009_Q21","n":21,"stem":"Which of the following is a sampling risk that is associated with the efficiency of an audit?","opts":[{"label":"A","text":"Risk of assessing control risk too high."},{"label":"B","text":"Risk of incorrect acceptance."},{"label":"C","text":"Inherent risk."},{"label":"D","text":"Detection risk."}],"ans":"A","explanation":"Risk of assessing control risk too high (Alpha risk) leads to unnecessary substantive audit work, reducing audit efficiency."},{"id":"AT10009_Q22","n":22,"stem":"If the auditor is concerned that a population may contain exceptions, the determination of a sample size sufficient to include at least one such exception is a characteristic of","opts":[{"label":"A","text":"Discovery sampling"},{"label":"B","text":"Variables sampling"},{"label":"C","text":"Random sampling"},{"label":"D","text":"PPS sampling"}],"ans":"A","explanation":"Discovery sampling is designed to find at least one exception if the actual rate equals or exceeds the critical rate."},{"id":"AT10009_Q23","n":23,"stem":"An auditor discovers that an account balance believed not to be materially misstated based on an audit sample was materially misstated based on the total population of the account balance. This is an example of which of the following types of sampling risks?","opts":[{"label":"A","text":"Incorrect rejection."},{"label":"B","text":"Incorrect acceptance."},{"label":"C","text":"Assessing control risk too low."},{"label":"D","text":"Assessing control risk too high."}],"ans":"B","explanation":"Accepting an account balance as fairly stated when it is in fact materially misstated is incorrect acceptance."},{"id":"AT10009_Q24","n":24,"stem":"Which of the following courses of action would an auditor most likely follow in planning a sample of cash disbursements if the auditor is aware of several unusually large cash disbursements?","opts":[{"label":"A","text":"Set the tolerable rate of deviation at a lower level than originally planned."},{"label":"B","text":"Stratify the cash disbursements population so that the unusually large disbursements are selected."},{"label":"C","text":"Increase the sample size to reduce the effect of the unusually large disbursements."},{"label":"D","text":"Continue to draw new samples until all the unusually large disbursements appear in the sample."}],"ans":"B","explanation":"Stratification allows separating large items into an independent stratum examined 100%."},{"id":"AT10009_Q25","n":25,"stem":"While performing a test of details during an audit, an auditor determined that the sample results supported the conclusion that the recorded account balance was materially misstated. It was, in fact, not materially misstated. This situation illustrates the risk of","opts":[{"label":"A","text":"Assessing control risk too high"},{"label":"B","text":"Assessing control risk too low"},{"label":"C","text":"Incorrect rejection"},{"label":"D","text":"Incorrect acceptance"}],"ans":"C","explanation":"Concurring that a balance is materially misstated when it is in fact true is the risk of incorrect rejection."},{"id":"AT10009_Q26","n":26,"stem":"For which of the following audit tests would an auditor most likely use attribute sampling?","opts":[{"label":"A","text":"Making an independent estimate of the amount of FIFO inventory."},{"label":"B","text":"Examining invoices in support of the valuation of fixed asset additions."},{"label":"C","text":"Selecting accounts receivable for confirmation of account balances."},{"label":"D","text":"Inspecting employee time cards for proper approval by supervisors."}],"ans":"D","explanation":"Inspecting time cards for supervisory approval tests a binary control attribute (presence/absence of approval)."},{"id":"AT10009_Q27","n":27,"stem":"An auditor desired to test credit approval on 10,000 sales invoices processed during the year. The auditor designed a statistical sample that would provide 1% risk of assessing control risk too low (99% confidence) that not more than 7% of the sales invoices lacked approval. The auditor estimated from previous experience that about 2 ½% of the sales invoices lacked approval. A sample of 200 invoices was examined and seven of them were lacking approval. The auditor then determined the achieved upper precision limit to be 8%.\n\nIn the evaluation of this sample, the auditor decided to increase the level of the preliminary assessment of control risk because the","opts":[{"label":"A","text":"Tolerable rate (7%) was less than the achieved upper precision limit (8%)."},{"label":"B","text":"Expected deviation rate (7%) was more than the percentage of errors in the sample (3 ½%)."},{"label":"C","text":"Achieved upper precision limit (8%) was more than the percentage of errors in the sample (3 ½%)."},{"label":"D","text":"Expected deviation rate (2 ½%) was less than the tolerable rate (7%)."}],"ans":"A","explanation":"When achieved upper precision limit (8%) exceeds the tolerable rate (7%), the control does not support the planned assessed level of control risk."},{"id":"AT10009_Q28","n":28,"stem":"Referring to the previous item (where sample deviation rate was 7/200 = 3.5% and achieved upper precision limit was 8%), the allowance for sampling risk was","opts":[{"label":"A","text":"5 ½%"},{"label":"B","text":"4 ½%"},{"label":"C","text":"3 ½%"},{"label":"D","text":"1%."}],"ans":"B","explanation":"Allowance for sampling risk = Achieved upper precision limit (8%) - Sample deviation rate (3.5%) = 4.5%."},{"id":"AT10009_Q29","n":29,"stem":"The diagram below depicts the auditor’s estimated maximum deviation rate compared with the tolerable rate and also depicts the true population deviation rate compared with the tolerable rate.\n\nAuditor's Estimate:\n- Max Deviation Rate Is Less than Tolerable Rate: I (True rate <= Tolerable), III (True rate > Tolerable)\n- Max Deviation Rate Exceeds Tolerable Rate: II (True rate <= Tolerable), IV (True rate > Tolerable)\n\nAs a result of tests of controls, the auditor assesses control risk higher than necessary and thereby increases substantive testing. This is illustrated by","opts":[{"label":"A","text":"I"},{"label":"B","text":"II"},{"label":"C","text":"III"},{"label":"D","text":"IV"}],"ans":"B","explanation":"Quadrant II represents assessing control risk higher than necessary (True rate <= Tolerable, but Auditor estimated rate exceeds Tolerable)."},{"id":"AT10009_Q30","n":30,"stem":"In addition to evaluating the frequency of deviations in tests of controls, an auditor should also consider certain qualitative aspects of the deviations. The auditor most likely would give broader consideration to the implications of a deviation if it was","opts":[{"label":"A","text":"The only deviation discovered in the sample."},{"label":"B","text":"Identical to a deviation discovered during the prior year’s audit."},{"label":"C","text":"Caused by an employee’s misunderstanding of instructions."},{"label":"D","text":"Initially concealed by a forged document."}],"ans":"D","explanation":"An intentional concealment or forgery indicates potential fraud, which carries much wider qualitative audit implications."},{"id":"AT10009_Q31","n":31,"stem":"When the auditor goes through a population and selects items for the sample without regard to their size, source, or other distinguishing characteristics, it is called","opts":[{"label":"A","text":"Block selection"},{"label":"B","text":"Systematic selection"},{"label":"C","text":"Haphazard selection"},{"label":"D","text":"Random selection"}],"ans":"C","explanation":"Selecting items without following a structured technique is haphazard selection."},{"id":"AT10009_Q32","n":32,"stem":"When an auditor has chosen a random sample and is using nonstatistical attributes sampling, that auditor","opts":[{"label":"A","text":"Need not consider the risk of assessing control risk too low."},{"label":"B","text":"Has committed a nonsampling error."},{"label":"C","text":"Will have to use discovery sampling to evaluate the results."},{"label":"D","text":"Should compare the deviation rate of the sample to the tolerable deviation rate."}],"ans":"D","explanation":"In nonstatistical sampling, the sample deviation rate is compared against the tolerable deviation rate using professional judgment."},{"id":"AT10009_Q33","n":33,"stem":"An error that arises from an isolated event that has not recurred other than on specifically identifiable occasions and is therefore not representative of similar errors in the population is a/an","opts":[{"label":"A","text":"Anomalous error"},{"label":"B","text":"Isolated error"},{"label":"C","text":"Individual error"},{"label":"D","text":"Non-recurring error"}],"ans":"A","explanation":"Under PSA 530, this is the definition of an \"Anomalous error\"."},{"id":"AT10009_Q34","n":34,"stem":"If all other factors specified in an attributes sampling plan remain constant, decreasing the tolerable rate and decreasing the risk of assessing control risk too low would have what effect on sample size?","opts":[{"label":"A","text":"Increase."},{"label":"B","text":"Remain the same."},{"label":"C","text":"Decrease."},{"label":"D","text":"Indeterminate, depends upon exact change being made."}],"ans":"A","explanation":"Both decreasing tolerable rate and decreasing acceptable risk require a larger sample size (both increase sample size)."},{"id":"AT10009_Q35","n":35,"stem":"Which of the following statements is correct about the sample size in statistical sampling when testing internal controls?","opts":[{"label":"A","text":"The auditor should consider the tolerable rate of deviation from the controls being tested in determining sample size."},{"label":"B","text":"As the likely rate of deviation decreases, the auditor should increase the planned sample size."},{"label":"C","text":"The allowable risk of assessing control risk too low has no effect on the planned sample size."},{"label":"D","text":"Of all the factors to be considered, the population size has the greatest effect on the sample size."}],"ans":"A","explanation":"The tolerable rate of deviation is an essential input in determining sample size."}]},{"id":"AT-10010","code":"AT-10010","title":"Auditing in an IT Environment","standards":"Auditing in an IT Environment / CIS","questionCount":30,"summary":"IT Environment Impact on Auditing, System Characteristics (Concentration of data, lack of visible trail, systems-generated transactions), General IT Controls vs Application Controls (Input, Processing, Output), Stand-alone PCs and Online Systems, Networks and Databases, Computer-Assisted Audit Techniques (CAATs), Program Analysis (Code review, flowcharting, snapshot) and Program Testing (Test data, BCSE, ITF, Parallel simulation, Controlled reprocessing), Continuous audit techniques (SCARFs, audit hooks, tagging), and Generalized Audit Software (GAS).","lectureOutline":"### AUDITING IN AN IT ENVIRONMENT\n- The overall objective and scope of an audit **does not change** in an IT environment.\n- The IT environment affects:\n  1. Procedures followed in obtaining understanding of accounting and internal controls;\n  2. Consideration of inherent and control risk;\n  3. Design and performance of tests of controls and substantive procedures.\n\n---\n\n### CHARACTERISTICS OF AN IT ENVIRONMENT\n- **Concentration of functions and knowledge:** Fewer persons involved in processing.\n- **Concentration of programs and data:** Centralized machine-readable files.\n- **Nature of Processing:** Less visible evidence, absence of input documents, lack of visible audit trail (overwritten logs), lack of visible output, ease of access to data and programs from remote locations.\n- **Design & Procedural Aspects:** Consistency of performance (programs execute instructions exactly without human fatigue, but errors are repeated systematically), system-generated transactions.\n\n---\n\n### INTERNAL CONTROLS IN AN IT ENVIRONMENT\n\n#### 1. General IT Controls\nFramework of overall control over IT activities to ensure overall control objectives are achieved:\n- Organization and management controls (segregation of incompatible IT functions: system analysts, programmers, operators, data librarians).\n- Development and maintenance controls (systems design, testing, approvals, change management).\n- Delivery and support controls (disaster recovery/contingency planning, file backup, hot site vs. cold site, system security, environmental controls).\n- Monitoring controls (IT performance indicators, internal IT audits).\n\n#### 2. IT Application Controls\nSpecific controls over application systems ensuring transactions are authorized, recorded, and processed completely and accurately:\n- **Input Controls:** Proper authorization, conversion into machine-readable form, error rejection and correction. (e.g., check digits, hash totals, limit/reasonableness checks, validity checks, field checks).\n- **Processing Controls:** Ensuring system-generated transactions and data files are updated properly without addition, duplication or loss.\n- **Output Controls:** Accurate processing results, access restricted to authorized personnel, output reconciliation.\n\n---\n\n### AUDIT APPROACHES & CAATS\n\n#### Three Basic Approaches\n1. **Auditing Around the Computer:** Auditor examines inputs and outputs without testing internal computer programs (black-box approach; appropriate for simple systems with detailed printed audit trail).\n2. **Auditing With the Computer:** Using computer software as an audit tool (e.g. Generalized Audit Software, spreadsheets).\n3. **Auditing Through the Computer:** Auditor directly tests computer processing logic and controls (white-box approach).\n\n#### CAATs for Tests of Controls\n- **Program Analysis:** Code review, comparison programs, flowcharting software, program tracing and mapping, snapshot.\n- **Program Testing (Historical / Point-in-time):**\n  - *Test Data:* Auditor-prepared dummy transactions (valid and invalid) processed by client software under auditor control.\n  - *Base Case System Evaluation (BCSE):* Comprehensive test data testing every possible program condition.\n  - *Integrated Test Facility (ITF):* Dummy unit/entity set up in client's live database where test data and actual live data run simultaneously without operating staff being aware.\n  - *Parallel Simulation:* Processing client's live actual data using auditor's generalized audit software and comparing output with client results.\n  - *Controlled Reprocessing:* Processing actual client data through a verified copy of the client's application program.\n- **Continuous Audit Techniques (Throughout a period):**\n  - *Audit Modules:* Programmed audit routines embedded into client application.\n  - *SCARFs (Systems Control Audit Review Files):* Embedded logs collecting transaction info meeting audit criteria for subsequent analysis.\n  - *Audit Hooks:* Program \"exits\" allowing auditor to insert custom audit subroutines.\n  - *Transaction Tagging:* Flagging a transaction record and tracing it through critical processing points.\n  - *Extended Records:* Appending additional audit data to regular transaction records to preserve an extended audit trail.","items":[{"id":"AT10010_Q1","n":1,"stem":"Which of the following characteristics distinguishes computer processing from manual processing?","opts":[{"label":"A","text":"Computer processing virtually eliminates the occurrence of computational error normally associated with manual processing."},{"label":"B","text":"Errors or fraud in computer processing will be detected soon after their occurrences."},{"label":"C","text":"The potential for systematic error is ordinarily greater in manual processing than in computerized processing."},{"label":"D","text":"Most computer systems are designed so that transaction trails useful for audit purposes do not exist."}],"ans":"A","explanation":"Computers perform mathematical computations precisely as programmed, virtually eliminating human manual arithmetic errors."},{"id":"AT10010_Q2","n":2,"stem":"Which of the following is correct concerning batch processing of transactions?","opts":[{"label":"A","text":"Transactions are processed in the order they occur, regardless of type."},{"label":"B","text":"It has largely been replaced by on-line real-time processing in all but legacy systems."},{"label":"C","text":"It is more likely to result in an easy-to-follow audit trail than is on-line transaction processing."},{"label":"D","text":"It is used only in nondatabase applications."}],"ans":"C","explanation":"Batch processing groups source documents together and creates batch control totals, producing an easier-to-follow audit trail."},{"id":"AT10010_Q3","n":3,"stem":"Which of the following procedures would an entity most likely include in its computer disaster recovery plan?","opts":[{"label":"A","text":"Develop an auxiliary power supply to provide uninterrupted electricity."},{"label":"B","text":"Store duplicate copies of critical files in a location away from the computer center."},{"label":"C","text":"Maintain a listing of entity passwords with the network manager."},{"label":"D","text":"Translate data for storage purposes with a cryptographic secret code."}],"ans":"B","explanation":"Off-site storage of duplicate backup files is a vital procedure in disaster recovery planning."},{"id":"AT10010_Q4","n":4,"stem":"What technology is needed in order to convert a paper document into a computer file?","opts":[{"label":"A","text":"Optical character recognition"},{"label":"B","text":"Electronic data interchange"},{"label":"C","text":"Bar-coding scanning"},{"label":"D","text":"Joining and merging"}],"ans":"A","explanation":"Optical character recognition (OCR) scans and converts printed/written text on paper into machine-encoded text files."},{"id":"AT10010_Q5","n":5,"stem":"A manufacturer of complex electronic equipment such as oscilloscopes and microscopes has been shipping its products with thick paper manuals but wants to reduce the cost of producing and shipping this documentation. Of the following, the best medium for the manufacturer to use to accomplish this is","opts":[{"label":"A","text":"Write-once-read-many."},{"label":"B","text":"Digital audio tape."},{"label":"C","text":"Compact disc/read-only memory."},{"label":"D","text":"Computer-output-to-microform."}],"ans":"C","explanation":"CD-ROM (read-only memory) allows cheap mass distribution of large documentation manuals."},{"id":"AT10010_Q6","n":6,"stem":"Misstatements in a batch computer system caused by incorrect programs or data may not be detected immediately because","opts":[{"label":"A","text":"Errors in some transactions may cause rejection of other transactions in the batch."},{"label":"B","text":"The identification of errors in input data typically is not a part of the program."},{"label":"C","text":"There are time delays in processing transactions in a batch system."},{"label":"D","text":"The processing of transactions in a batch system is not uniform."}],"ans":"C","explanation":"Batch processing runs at scheduled periodic intervals, introducing time delays before output and error reports are generated."},{"id":"AT10010_Q7","n":7,"stem":"A client is concerned that a power outage or disaster could impair the computer hardware’s ability to function as designed. The client desires off-site back-up hardware facilities that are fully configured and ready to operate within several hours. The client most likely should consider a","opts":[{"label":"A","text":"Cold site."},{"label":"B","text":"Cool site."},{"label":"C","text":"Warm site."},{"label":"D","text":"Hot site."}],"ans":"D","explanation":"A hot site is a fully equipped backup facility with pre-installed hardware and network capabilities ready for immediate operation."},{"id":"AT10010_Q8","n":8,"stem":"What type of computer system is characterized by data that are assembled from more than one location and records that are updated immediately?","opts":[{"label":"A","text":"Microcomputer system"},{"label":"B","text":"Minicomputer system"},{"label":"C","text":"Batch processing system"},{"label":"D","text":"On-line, real-time system"}],"ans":"D","explanation":"In an on-line, real-time system, transactions are entered from remote locations and master files are updated immediately."},{"id":"AT10010_Q9","n":9,"stem":"End-user computing is most likely to occur on which of the following types of computers?","opts":[{"label":"A","text":"Mainframe"},{"label":"B","text":"Minicomputers"},{"label":"C","text":"Personal computers"},{"label":"D","text":"Personal reference assistants"}],"ans":"C","explanation":"End-user computing (EUC) takes place on standalone personal computers / workstations managed directly by department staff."},{"id":"AT10010_Q10","n":10,"stem":"Which of the following statements most likely represents a disadvantage for an entity that keeps microcomputer-prepared data files rather than manually prepared files?","opts":[{"label":"A","text":"Random error associated with processing similar transactions in different ways is usually greater."},{"label":"B","text":"It is usually more difficult to compare recorded accountability with physical count of assets."},{"label":"C","text":"Attention is focused on the accuracy of the programming process rather than errors in individual transactions."},{"label":"D","text":"It is usually easier for unauthorized persons to access and alter the files."}],"ans":"D","explanation":"Personal computer files often lack enterprise-grade physical and logical security, making unauthorized access and alteration easier."},{"id":"AT10010_Q11","n":11,"stem":"To avoid invalid data input, a bank added an extra number at the end of each account number and subjected the new number to an algorithm. This technique is known as","opts":[{"label":"A","text":"Optical character recognition"},{"label":"B","text":"A check digit"},{"label":"C","text":"A dependency check"},{"label":"D","text":"A format check"}],"ans":"B","explanation":"A check digit is an extra calculated digit appended to an identification number to detect input and transposition errors."},{"id":"AT10010_Q12","n":12,"stem":"Preventing someone with sufficient technical skill from circumventing security procedures and making changes to production programs is best accomplished by","opts":[{"label":"A","text":"Reviewing reports of jobs completed."},{"label":"B","text":"Comparing production programs with independently controlled copies."},{"label":"C","text":"Running test data periodically."},{"label":"D","text":"Providing suitable segregation of duties."}],"ans":"D","explanation":"Segregating systems development (programmers) from computer operations and production program libraries provides the strongest preventative control."},{"id":"AT10010_Q13","n":13,"stem":"An entity has the following invoices in a batch:\nInvoice No. 201 (Qty 150, Price 5.00)\nInvoice No. 202 (Qty 200, Price 10.00)\nInvoice No. 203 (Qty 250, Price 25.00)\nInvoice No. 204 (Qty 300, Price 30.00)\nWhich of the following most likely represents a hash total?","opts":[{"label":"A","text":"FGHK80"},{"label":"B","text":"4"},{"label":"C","text":"204"},{"label":"D","text":"810"}],"ans":"D","explanation":"A hash total is a sum of numbers that has no intrinsic financial meaning (201 + 202 + 203 + 204 = 810) used purely to detect omissions or alterations."},{"id":"AT10010_Q14","n":14,"stem":"Which of the following controls is a processing control designed to ensure the reliability and accuracy of data processing?\nLimit test | Validity check test","opts":[{"label":"A","text":"Yes | Yes"},{"label":"B","text":"Yes | No"},{"label":"C","text":"No | Yes"},{"label":"D","text":"No | No"}],"ans":"A","explanation":"Both limit tests (reasonableness bounds) and validity checks (matching against master files) serve as automated processing/input controls."},{"id":"AT10010_Q15","n":15,"stem":"Which of the following activities would most likely be performed in the information systems department?","opts":[{"label":"A","text":"Initiation of changes to master records."},{"label":"B","text":"Conversion of information to machine-readable form."},{"label":"C","text":"Correction of transactional errors."},{"label":"D","text":"Initiation of changes to existing applications."}],"ans":"B","explanation":"Data entry and conversion to machine-readable form is a standard IT operations activity; initiating changes and corrections must come from user departments."},{"id":"AT10010_Q16","n":16,"stem":"When computer programs or files can be accessed from terminals, users should be required to enter a(n)","opts":[{"label":"A","text":"Parity check"},{"label":"B","text":"Personal identification code"},{"label":"C","text":"Self-diagnosis test"},{"label":"D","text":"Echo check"}],"ans":"B","explanation":"User authentication via passwords or personal identification codes (PINs) controls access."},{"id":"AT10010_Q17","n":17,"stem":"Which of the following is an example of a validity check?","opts":[{"label":"A","text":"The computer ensures that a numerical amount in a record does not exceed some predetermined amount."},{"label":"B","text":"As a computer corrects errors and data are successfully resubmitted to the system, the causes of the errors are printed out."},{"label":"C","text":"The computer flags any transmission for which the control field value did not match that of an existing file record."},{"label":"D","text":"After data for a transaction are entered, the computer sends certain data back to the terminal for comparison with data originally sent."}],"ans":"C","explanation":"A validity check verifies that an entered key or code exists in an authorized master file (e.g. valid customer ID)."},{"id":"AT10010_Q18","n":18,"stem":"A control feature in an electronic data processing system requires the central processing unit (CPU) to send signals to the printer to activate the print mechanism for each character. The print mechanism, just prior to printing, sends a signal back to the CPU verifying that the proper print position has been activated. This type of hardware control is referred to as","opts":[{"label":"A","text":"Echo control."},{"label":"B","text":"Validity control."},{"label":"C","text":"Signal control."},{"label":"D","text":"Check digit control."}],"ans":"A","explanation":"Echo control (or echo check) involves hardware transmitting received signals back to the source to verify accuracy of transmission."},{"id":"AT10010_Q19","n":19,"stem":"Which of the following most likely represents a significant deficiency in internal control?","opts":[{"label":"A","text":"The systems analyst reviews applications of data processing and maintains systems documentation."},{"label":"B","text":"The systems programmer designs systems for computerized applications and maintains output controls."},{"label":"C","text":"The control clerk establishes control over data received by the information systems department and reconciles control totals after processing."},{"label":"D","text":"The accounts payable clerk prepares data for computer processing and enters the data into the computer."}],"ans":"B","explanation":"Programmers should never have responsibility for operational controls such as output distribution; this represents an incompatible combination of duties."},{"id":"AT10010_Q20","n":20,"stem":"Internal control is ineffective when computer department personnel","opts":[{"label":"A","text":"Participate in computer software acquisition decisions."},{"label":"B","text":"Design documentation for computerized systems."},{"label":"C","text":"Originate changes in master files."},{"label":"D","text":"Provide physical security for program files."}],"ans":"C","explanation":"Changes in master file data (such as prices, credit limits, pay rates) must originate from user departments, never IT personnel."},{"id":"AT10010_Q21","n":21,"stem":"An auditor would most likely be concerned with which of the following controls in a distributed data processing system?","opts":[{"label":"A","text":"Hardware controls"},{"label":"B","text":"Systems documentation controls"},{"label":"C","text":"Access controls"},{"label":"D","text":"Disaster recovery controls"}],"ans":"C","explanation":"In distributed data processing with many network nodes, access controls are the critical defense against unauthorized transactions and data alteration."},{"id":"AT10010_Q22","n":22,"stem":"An auditor anticipates assessing control risk at a low level in a computerized environment. Under these circumstances, on which of the following activities would the auditor initially focus?","opts":[{"label":"A","text":"Programmed control activities"},{"label":"B","text":"Application control activities"},{"label":"C","text":"Output control activities"},{"label":"D","text":"General control activities"}],"ans":"D","explanation":"General IT controls provide the foundation for application controls; ineffective general controls undermine all application controls."},{"id":"AT10010_Q23","n":23,"stem":"Auditing by testing the input and output of a computer system instead of the computer program itself will","opts":[{"label":"A","text":"Not detect program errors which do not show up in the output sampled."},{"label":"B","text":"Detect all program errors, regardless of the nature of the output."},{"label":"C","text":"Provide the auditor with the same type of evidence."},{"label":"D","text":"Not provide the auditor with confidence in the results of the auditing procedures."}],"ans":"A","explanation":"Auditing around the computer cannot detect unauthorized program code or exceptions that do not appear in the specific sample examined."},{"id":"AT10010_Q24","n":24,"stem":"Which of the following client electronic data processing (EDP) systems generally can be audited without examining or directly testing the EDP computer programs of the system?","opts":[{"label":"A","text":"A system that performs relatively uncomplicated processes and produces detailed output."},{"label":"B","text":"A system that affects a number of essential master files and produces a limited output."},{"label":"C","text":"A system that updates a few essential master files and produces no printed output other than final balances."},{"label":"D","text":"A system that performs relatively complicated processing and produces very little detailed output."}],"ans":"A","explanation":"When processing is uncomplicated and comprehensive printouts/audit trails exist, auditing around the computer is feasible."},{"id":"AT10010_Q25","n":25,"stem":"To obtain evidence that on-line access controls are properly functioning, an auditor most likely would","opts":[{"label":"A","text":"Create checkpoints at periodic intervals after live data processing to test for unauthorized use of the system."},{"label":"B","text":"Examine the transaction log to discover whether any transactions were lost or entered twice due to a system malfunction."},{"label":"C","text":"Enter invalid identification numbers or passwords to ascertain whether the system rejects them."},{"label":"D","text":"Vouch a random sample of processed transactions to assure proper authorization."}],"ans":"C","explanation":"Testing invalid passwords/IDs directly verifies that access security properly denies unauthorized entry."},{"id":"AT10010_Q26","n":26,"stem":"An auditor most likely would introduce test data into a computerized payroll system to test controls related to the","opts":[{"label":"A","text":"Existence of unclaimed payroll checks held by supervisors."},{"label":"B","text":"Early cashing of payroll checks by employees."},{"label":"C","text":"Discovery of invalid employee I.D. numbers."},{"label":"D","text":"Proper approval of overtime by supervisors."}],"ans":"C","explanation":"Test data with invalid employee ID numbers checks whether the program's validity controls properly reject unauthorized numbers."},{"id":"AT10010_Q27","n":27,"stem":"When an auditor tests a computerized accounting system, which of the following is true of the test data approach?","opts":[{"label":"A","text":"Several transactions of each type must be tested."},{"label":"B","text":"Test data are processed by the client’s computer programs under the auditor’s control."},{"label":"C","text":"Test data must consist of all possible valid and invalid conditions."},{"label":"D","text":"The program tested is different from the program used throughout the year by the client."}],"ans":"B","explanation":"In the test data approach, auditor-created dummy data is processed through client software under auditor supervision."},{"id":"AT10010_Q28","n":28,"stem":"Which of the following computer-assisted auditing techniques allows fictitious and real transactions to be processed together without client operating personnel being aware of the testing process?","opts":[{"label":"A","text":"Integrated test facility"},{"label":"B","text":"Input controls matrix"},{"label":"C","text":"Parallel simulation"},{"label":"D","text":"Data entry monitor"}],"ans":"A","explanation":"An Integrated Test Facility (ITF) embeds dummy audit entities in client files, allowing simulated and live transactions to run concurrently."},{"id":"AT10010_Q29","n":29,"stem":"Which of the following methods of testing application controls utilizes a generalized audit software package prepared by the auditors?","opts":[{"label":"A","text":"Parallel simulation"},{"label":"B","text":"Integrated testing facility approach"},{"label":"C","text":"Test data approach"},{"label":"D","text":"Exception report tests"}],"ans":"A","explanation":"Parallel simulation reprocesses client transactions using auditor-controlled generalized audit software."},{"id":"AT10010_Q30","n":30,"stem":"In creating lead schedules for an audit engagement, a CPA often uses automated work paper software. What client information is needed to begin this process?","opts":[{"label":"A","text":"Interim financial information such as third quarter sales, net income, and inventory and receivable balances."},{"label":"B","text":"Specialized journal information such as the invoice and purchase order numbers of the last few sales and purchases of the year."},{"label":"C","text":"General ledger information such as account numbers, prior year account balances, and current year unadjusted information."},{"label":"D","text":"Adjusting entry information such as deferrals and accruals, and reclassification journal entries."}],"ans":"C","explanation":"General ledger chart of accounts, unadjusted trial balance, and prior year balances are the initial inputs for automated lead schedules."}]},{"id":"AT-10011","code":"AT-10011","title":"Completing the Audit (PSA 560, 570, 580)","standards":"PSA 560, PSA 570 (Revised), PSA 580","questionCount":35,"summary":"Procedures to wrap-up an audit engagement, Related Party Transactions, PSA 560 Subsequent Events (3 periods: up to report date, between report date and issue date, after issue date), Inquiries of Client Legal Counsel (Litigation/Claims, scope limitation), PSA 580 Management Representation Letter (dating, signatories, refusal), PSA 570 Going Concern evaluation, mitigating factors, and Management Letter.","lectureOutline":"### PROCEDURES TO WRAP-UP AN AUDIT ENGAGEMENT\n1. Review for related party transactions\n2. Review for subsequent events (PSA 560)\n3. Inquiries of client’s legal counsel\n4. Obtain a management representation letter (PSA 580)\n5. Search for unrecorded liabilities\n6. Perform final review stage analytical procedures (PSA 520)\n7. Review adequacy of disclosures using a disclosure checklist\n8. Review of working papers\n9. Form an opinion\n\n---\n\n### PSA 560: SUBSEQUENT EVENTS\nEvents occurring between the balance sheet date and the date when the financial statements are authorized for issue, and facts that become known to the auditor after the report date.\n\n#### Three Periods\n1. **Events between Balance Sheet Date and Date of Auditor’s Report:**\n   - Active duty to perform procedures to identify events requiring adjustment or disclosure.\n   - Type 1 (Adjusting): Conditions existing at or before BS date.\n   - Type 2 (Non-adjusting): Conditions arising after BS date (disclose).\n2. **Facts Discovered After Report Date but Before Financial Statements are Issued:**\n   - No active duty to perform procedures, but if facts become known: discuss with management, determine if FS need amendment.\n   - If amended, issue new report dated not earlier than approval date or dual-date report.\n   - If management refuses to amend, modify opinion or notify TCWG and take steps to prevent reliance.\n3. **Facts Discovered After Financial Statements Have Been Issued:**\n   - No obligation to make inquiries. If facts existed at report date that would have caused modification: discuss with management, review steps taken by management to inform users, issue new amended report with Emphasis of Matter.\n\n---\n\n### INQUIRIES OF CLIENT’S LEGAL COUNSEL\n- List of legal issues prepared by management and sent by the auditor to attorney.\n- Attorney’s refusal to reply is a **scope limitation** leading to a qualified opinion or disclaimer.\n\n---\n\n### PSA 580: MANAGEMENT REPRESENTATION LETTER\n- Confirms oral representations and reduces misunderstandings.\n- Addressed to the auditor; **dated as of the audit report date**.\n- Signed by the CEO and CFO.\n- **Refusal to Provide Representations:** Constitutes a scope limitation; auditor shall express a **qualified opinion or disclaim an opinion**.\n- Representations are NOT a substitute for other necessary auditing procedures.\n\n---\n\n### PSA 570: GOING CONCERN\n- Management is responsible for assessing going concern.\n- Auditor evaluates management's assessment and considers mitigating plans (e.g., postponing R&D, disposing non-core assets, restructuring debt).\n- If material uncertainty exists and is adequately disclosed: issue an **unmodified opinion with a separate \"Material Uncertainty Related to Going Concern\" section**. If disclosure is inadequate, express a **qualified or adverse opinion**.\n\n---\n\n### MANAGEMENT LETTER\n- Optional letter containing constructive recommendations for improving client operations and internal controls. No standard format.","items":[{"id":"AT10011_Q1","n":1,"stem":"The primary source of information to be reported about litigation, claims, and assessments is the","opts":[{"label":"A","text":"Independent auditor"},{"label":"B","text":"Client’s management"},{"label":"C","text":"Court records"},{"label":"D","text":"Client’s lawyer"}],"ans":"B","explanation":"Management is the primary source of information regarding litigation and claims; the lawyer provides corroboration."},{"id":"AT10011_Q2","n":2,"stem":"The primary reason an auditor requests that letters of inquiry be sent to a client’s attorneys is to provide the auditor with","opts":[{"label":"A","text":"A description and evaluation of litigation, claims, and assessments that existed at the balance sheet date."},{"label":"B","text":"The attorneys’ opinions of the client’s historical experiences in recent similar litigation."},{"label":"C","text":"Corroboration of the information furnished by management about litigation, claims, and assessments."},{"label":"D","text":"The probable outcome of asserted claims and pending or threatened litigation."}],"ans":"C","explanation":"Legal letters corroborate information furnished by management regarding claims and litigation."},{"id":"AT10011_Q3","n":3,"stem":"The letter of audit inquiry should be","opts":[{"label":"A","text":"Prepared and sent by the auditor."},{"label":"B","text":"Prepared by management and sent by the auditor."},{"label":"C","text":"Prepared and sent by management."},{"label":"D","text":"Prepared by the auditor and sent by management."}],"ans":"B","explanation":"The letter is prepared by management (authorizing disclosure) and mailed directly by the auditor."},{"id":"AT10011_Q4","n":4,"stem":"The refusal of a client’s lawyer to provide a representation on the legality of a particular act committed by the client is ordinarily","opts":[{"label":"A","text":"Proper grounds to withdraw from the engagement."},{"label":"B","text":"Insufficient reason to modify the auditor’s report because of the lawyer’s obligation of confidentiality."},{"label":"C","text":"Considered to be a scope limitation."},{"label":"D","text":"Sufficient reason to issue a “subject to” opinion."}],"ans":"C","explanation":"A refusal by client legal counsel to respond to an inquiry is a scope limitation."},{"id":"AT10011_Q5","n":5,"stem":"Management’s refusal to give the auditor permission to communicate with the entity’s legal counsel is most likely to lead to","opts":[{"label":"A","text":"An adverse opinion."},{"label":"B","text":"A qualified opinion or an adverse opinion."},{"label":"C","text":"An unmodified opinion."},{"label":"D","text":"A qualified opinion or a disclaimer of opinion."}],"ans":"D","explanation":"Precluding communication with lawyers is a management-imposed scope limitation (qualified or disclaimer)."},{"id":"AT10011_Q6","n":6,"stem":"In which of the following circumstances would an auditor most likely meet with the client’s legal counsel to discuss the likely outcome of the litigation and claims?\nI. The auditor determines that the matter is a significant risk.\nII. There is a disagreement between management and the entity’s legal counsel.\nIII. The subject matter of the litigation is complex.","opts":[{"label":"A","text":"I and II only."},{"label":"B","text":"II and III only."},{"label":"C","text":"I and III only."},{"label":"D","text":"I, II, and III."}],"ans":"D","explanation":"A meeting with legal counsel is appropriate when risks are significant, disagreements exist, or litigation is highly complex."},{"id":"AT10011_Q7","n":7,"stem":"Which of the following statements extracted from a client’s lawyer’s letter concerning litigation, claims, and assessments most likely would cause the auditor to request clarification?","opts":[{"label":"A","text":"“I believe that the action can be settled for less than the damages claimed.”"},{"label":"B","text":"“I believe that the company will be able to defend this action successfully.”"},{"label":"C","text":"“I believe that the plaintiff’s case against the company is without merit.”"},{"label":"D","text":"“I believe that the possible liability to the company is nominal in amount.”"}],"ans":"A","explanation":"Stating that an action can be settled for less than claimed is ambiguous regarding the estimated range of loss, requiring clarification."},{"id":"AT10011_Q8","n":8,"stem":"The auditor should consider the status of legal matters up to the","opts":[{"label":"A","text":"Balance sheet date."},{"label":"B","text":"Date of the auditor’s report."},{"label":"C","text":"Date of approval of the financial statements."},{"label":"D","text":"Date of issuance of the financial statements."}],"ans":"B","explanation":"Legal matters and subsequent events are evaluated up to the date of the auditor's report."},{"id":"AT10011_Q9","n":9,"stem":"Analytical procedures used in the overall review stage of the audit generally include","opts":[{"label":"A","text":"Retesting controls that appeared to be ineffective during the assessment of control risk."},{"label":"B","text":"Considering unusual or unexpected account balances that were not previously identified."},{"label":"C","text":"Gathering evidence concerning account balances that have not changed from the prior year."},{"label":"D","text":"Performing tests of transactions to corroborate management’s financial statement assertions."}],"ans":"B","explanation":"Final review analytical procedures consider unusual or unexpected relationships not previously identified."},{"id":"AT10011_Q10","n":10,"stem":"Analytical procedures performed in the overall review stage of an audit suggest that several accounts have unexpected relationships. The results of these procedures most likely indicate that","opts":[{"label":"A","text":"The communication with the audit committee should be revised."},{"label":"B","text":"Irregularities exist among the relevant account balances."},{"label":"C","text":"Additional substantive tests of details are required."},{"label":"D","text":"Internal control activities are not operating effectively."}],"ans":"C","explanation":"Unexpected relationships identified during final analytical review necessitate performing additional substantive tests."},{"id":"AT10011_Q11","n":11,"stem":"The responsibility for the identification and disclosure of related parties and transactions with such parties rests with the","opts":[{"label":"A","text":"Auditor."},{"label":"B","text":"Entity’s management."},{"label":"C","text":"Financial Reporting Standards Council (FRSC)."},{"label":"D","text":"Securities and Exchange Commission (SEC)."}],"ans":"B","explanation":"Identification and disclosure of related parties is primarily management's responsibility."},{"id":"AT10011_Q12","n":12,"stem":"The auditor should review information provided by those charged with governance and management identifying\nI. The names of all known related parties.\nII. Related party transactions.","opts":[{"label":"A","text":"I only."},{"label":"B","text":"II only."},{"label":"C","text":"Both I and II."},{"label":"D","text":"Neither I nor II."}],"ans":"C","explanation":"The auditor must review information identifying both related party names and specific transactions."},{"id":"AT10011_Q13","n":13,"stem":"Which of the following events most likely indicates the existence of related parties?","opts":[{"label":"A","text":"Making a loan without scheduled terms for repayment of the funds."},{"label":"B","text":"Discussing merger terms with a company that is a major competitor."},{"label":"C","text":"Selling real estate at a price that differs significantly from its book value."},{"label":"D","text":"Borrowing a large sum of money at a variable rate of interest."}],"ans":"A","explanation":"Unscheduled, non-interest, or uncollateralized loans strongly indicate non-arm's-length related party transactions."},{"id":"AT10011_Q14","n":14,"stem":"An auditor searching for related party transactions should obtain an understanding of each subsidiary’s relationship to the total entity because","opts":[{"label":"A","text":"This may permit the audit of intercompany account balances to be performed as of concurrent dates."},{"label":"B","text":"This may reveal whether particular transactions would have taken place if the parties had not been related."},{"label":"C","text":"The business structure may be deliberately designed to obscure related party transactions."},{"label":"D","text":"Intercompany transactions may have been consummated on terms equivalent to arm’s-length transactions."}],"ans":"C","explanation":"Complex subsidiary or entity business structures may be deliberately used to obscure related party dealings."},{"id":"AT10011_Q15","n":15,"stem":"After determining that a related party transaction has, in fact, occurred, an auditor should","opts":[{"label":"A","text":"Obtain an understanding of the business purpose of the transaction."},{"label":"B","text":"Substantiate that the transaction was consummated on terms equivalent to an arm’s-length transaction."},{"label":"C","text":"Add a separate paragraph to the auditor’s report to explain the transaction."},{"label":"D","text":"Perform analytical procedures to verify whether similar transactions
