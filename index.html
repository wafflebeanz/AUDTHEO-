aximum, the auditor obtains reasonable assurance that controls are in use and operating effectively. This assurance is most likely obtained in part by","opts":[{"label":"A","text":"Preparing flowcharts and narratives of the entity’s internal control system."},{"label":"B","text":"Performing substantive test of details of transactions and balances."},{"label":"C","text":"Analyzing tests of trends and ratios."},{"label":"D","text":"Inspection of documents."}],"ans":"D","explanation":"Inspection of documents containing initials, approvals, or stamps provides evidence of control operation."},{"id":"AT10005_Q18","n":18,"stem":"The following statements relate to the use of audit evidence when testing the operating effectiveness of relevant controls. Which is false?","opts":[{"label":"A","text":"An auditor who obtains sufficient appropriate audit evidence about the operating effectiveness of controls during the interim period should no longer obtain additional evidence of operating effectiveness for the remaining period."},{"label":"B","text":"An auditor may plan to use audit evidence about the operating effectiveness of controls obtained in prior audits."},{"label":"C","text":"If an auditor plans to rely on controls that have changed since they were last tested, the auditor should test the operating effectiveness of such controls in the current audit."},{"label":"D","text":"Audit evidence pertaining only to a point in time may be sufficient for the auditor’s purpose, for example, when testing controls over an entity’s physical count of inventories at year-end."}],"ans":"A","explanation":"Testing controls at interim requires obtaining evidence for the remaining period (roll-forward)."},{"id":"AT10005_Q19","n":19,"stem":"The objective of dual-purpose tests is to:","opts":[{"label":"A","text":"Evaluate whether internal controls are operating effectively."},{"label":"B","text":"Detect material misstatements in the financial statements."},{"label":"C","text":"Identify unusual trends or patterns in comparative financial statements."},{"label":"D","text":"Test internal controls as well as transactions and balances using the same test procedures."}],"ans":"D","explanation":"A dual-purpose test tests a control and detects monetary misstatements simultaneously."},{"id":"AT10005_Q20","n":20,"stem":"Which of the following types of evidence will be gathered in order to test internal controls?","opts":[{"label":"A","text":"Confirmations of accounts receivable with customers."},{"label":"B","text":"Observation of client personnel receiving inventory shipments."},{"label":"C","text":"Observation of inventory counts."},{"label":"D","text":"Inquiry of management regarding significant litigation."}],"ans":"B","explanation":"Observation of personnel receiving shipments tests compliance with receiving control procedures."},{"id":"AT10005_Q21","n":21,"stem":"An auditor may decide to assess control risk at the maximum level for certain assertions because the auditor believes","opts":[{"label":"A","text":"Controls are unlikely to pertain to the assertions."},{"label":"B","text":"The entity’s control components are interrelated."},{"label":"C","text":"Sufficient appropriate audit evidence to support the assertions is likely to be available."},{"label":"D","text":"More emphasis on tests of controls than substantive tests is warranted."}],"ans":"A","explanation":"If controls do not pertain to the assertion or are ineffective, control risk is assessed at maximum."},{"id":"AT10005_Q22","n":22,"stem":"Which of the following procedures most likely would be included as part of an auditor's tests of control procedures?","opts":[{"label":"A","text":"Inspection"},{"label":"B","text":"Reconciliation"},{"label":"C","text":"Confirmation"},{"label":"D","text":"Analytical procedures"}],"ans":"A","explanation":"Inspection of documents for evidence of authorization/approval is a classic test of control."},{"id":"AT10005_Q23","n":23,"stem":"The primary purpose of performing further control tests is to provide","opts":[{"label":"A","text":"a basis for reducing the assessed level of control risk below the maximum level."},{"label":"B","text":"a basis for understanding the flow of transactions through the accounting system."},{"label":"C","text":"assurance that transactions are properly recorded."},{"label":"D","text":"all accounting control procedures leave visible evidence."}],"ans":"A","explanation":"Tests of controls support an assessment of control risk below the maximum level."},{"id":"AT10005_Q24","n":24,"stem":"Which of the following statements is correct concerning an auditor’s assessment of control risk?","opts":[{"label":"A","text":"Assessing control risk may be performed concurrently during an audit with obtaining an understanding of the entity’s internal control."},{"label":"B","text":"Evidence about the operation of controls in prior audits may not be considered during the current year’s assessment of control risk."},{"label":"C","text":"The basis for an auditor’s conclusions about the assessed level of control risk need not be documented unless control risk is assessed at the maximum level."},{"label":"D","text":"The lower the assessed level of control risk, the less assurance the evidence must provide that the controls are operating effectively."}],"ans":"A","explanation":"Control risk assessment and obtaining an understanding of internal control may be performed concurrently."},{"id":"AT10005_Q25","n":25,"stem":"On the basis of audit evidence gathered and evaluated, an auditor decides to increase the assessed level of control risk from that originally planned. To achieve an overall audit risk level that is substantially the same as the planned audit risk level, the auditor would","opts":[{"label":"A","text":"Increase inherent risk."},{"label":"B","text":"Increase materiality level."},{"label":"C","text":"Decrease inherent risk."},{"label":"D","text":"Decrease detection risk."}],"ans":"D","explanation":"When control risk increases, acceptable detection risk must decrease to keep overall audit risk constant."},{"id":"AT10005_Q26","n":26,"stem":"When an auditor increases the planned assessed level of control risk because certain controls were determined to be ineffective, the auditor would most likely increase the","opts":[{"label":"A","text":"Extent of tests of details."},{"label":"B","text":"Level of inherent risk."},{"label":"C","text":"Extent of tests of controls."},{"label":"D","text":"Level of detection risk."}],"ans":"A","explanation":"Higher control risk requires more extensive substantive tests of details."},{"id":"AT10005_Q27","n":27,"stem":"Regardless of the assessed level of control risk, an auditor would perform some","opts":[{"label":"A","text":"Tests of controls to determine the effectiveness of internal control policies."},{"label":"B","text":"Analytical procedures to verify the design of internal control procedures."},{"label":"C","text":"Substantive tests to restrict detection risk for significant transaction classes."},{"label":"D","text":"Dual-purpose tests to evaluate both the risk of monetary misstatement and preliminary control risk."}],"ans":"C","explanation":"The auditor must perform some substantive procedures for all significant transaction classes and balances regardless of assessed control risk."},{"id":"AT10005_Q28","n":28,"stem":"The objective of tests of details of transactions that are being performed as tests of controls procedures is to","opts":[{"label":"A","text":"monitor the design and use of entity documents such as pre-numbered shipping form."},{"label":"B","text":"determine whether controls have been placed in operation."},{"label":"C","text":"detect material misstatements in the account balances in the financial statements."},{"label":"D","text":"evaluate whether controls operate effectively."}],"ans":"D","explanation":"When performed as test of control procedures, the objective is to evaluate operating effectiveness of controls."},{"id":"AT10005_Q29","n":29,"stem":"For a particular assertion, control risk is the risk that","opts":[{"label":"A","text":"controls will not detect a material misstatement that occurs."},{"label":"B","text":"audit procedures will fail to detect a weak control system."},{"label":"C","text":"the prescribed control procedures will not be applied uniformly."},{"label":"D","text":"a material misstatement will occur in the accounting process."}],"ans":"A","explanation":"Control risk is the risk that internal controls will not prevent or detect and correct a material misstatement."},{"id":"AT10005_Q30","n":30,"stem":"If the results of the auditor's tests of controls induce the auditor to change the assessed level of control risk for inventory from 0.2 to 0.4 and audit risk and inherent risk remain constant, what is the effect on the acceptable level of detection risk?","opts":[{"label":"A","text":"A change in detection risk cannot be calculated because audit risk and inherent risk values are not given."},{"label":"B","text":"Detection risk would increase from 0.3 to 0.6."},{"label":"C","text":"Detection risk would decrease from 0.4 to 0.2."},{"label":"D","text":"Detection risk would not change since audit risk and inherent risk do not change."}],"ans":"C","explanation":"Since AR = IR x CR x DR, doubling CR from 0.2 to 0.4 halves acceptable DR (e.g. from 0.4 to 0.2)."},{"id":"AT10005_Q31","n":31,"stem":"During the consideration of a small business client’s internal control, the auditor discovered that the accounts receivable clerk approves credit memos and has access to cash. Which of the following controls would be most effective in offsetting this weakness?","opts":[{"label":"A","text":"The controller reconciles the total of the detail accounts receivable accounts to the amount shown in the ledger."},{"label":"B","text":"The controller receives the monthly bank statement directly and reconciles the checking accounts."},{"label":"C","text":"The owner reviews errors in billings to customers and postings to the subsidiary ledger."},{"label":"D","text":"The owner reviews credit memos after they are recorded."}],"ans":"D","explanation":"Owner review of credit memos compensates for the incompatible duties of approving credit memos and handling cash."},{"id":"AT10005_Q32","n":32,"stem":"Which of the following is ordinarily considered a test of internal control procedures?","opts":[{"label":"A","text":"Send confirmation letters to banks."},{"label":"B","text":"Count and list cash on hand."},{"label":"C","text":"Examine signatures on checks."},{"label":"D","text":"Obtain or prepare reconciliation of bank accounts as of the balance sheet date."}],"ans":"C","explanation":"Examine signatures on checks verifies proper authorization (test of control)."},{"id":"AT10005_Q33","n":33,"stem":"Which of the following procedures would an auditor most likely perform to test controls relating to management’s assertion concerning the completeness of sales transactions?","opts":[{"label":"A","text":"Verify that extensions and footings on the entity’s sales invoices and monthly customer statements have been recomputed."},{"label":"B","text":"Compare the invoiced prices on prenumbered sales invoices to the entity’s authorized price list."},{"label":"C","text":"Inquire about the entity’s credit granting policies and the consistent application of credit checks."},{"label":"D","text":"Inspect the entity’s reports of prenumbered shipping documents that have not been recorded in the sales journal."}],"ans":"D","explanation":"Inspecting unrecorded shipping documents detects unbilled/unrecorded sales, testing completeness."},{"id":"AT10005_Q34","n":34,"stem":"Which of the following tests of controls most likely would help assure an auditor that goods shipped are properly billed?","opts":[{"label":"A","text":"Scan the sales journal for sequential and unusual entries."},{"label":"B","text":"Examine shipping documents for matching sales invoices."},{"label":"C","text":"Compare the accounts receivable ledger to daily sales summaries."},{"label":"D","text":"Inspect unused sales invoices for consecutive prenumbering."}],"ans":"B","explanation":"Tracing shipping documents forward to matching sales invoices ensures shipped items were billed."},{"id":"AT10005_Q35","n":35,"stem":"An auditor is least likely to test controls that provide for","opts":[{"label":"A","text":"Approval of the purchase and sale of trading securities."},{"label":"B","text":"Classification of revenue and expense transactions by product line."},{"label":"C","text":"Segregation of the functions of recording disbursements and reconciling the bank account."},{"label":"D","text":"Comparison of receiving reports and vendors’ invoices with purchase orders."}],"ans":"B","explanation":"Detailed classification by product line is largely management/operational reporting, less critical to basic FS assertions."},{"id":"AT10005_Q36","n":36,"stem":"Which of the following procedures concerning accounts receivable would an auditor most likely perform to obtain evidential matter in support of an assessed level of controls risk below the maximum level?","opts":[{"label":"A","text":"Observing an entity’s employee prepare the schedule of past due accounts receivable."},{"label":"B","text":"Sending confirmation requests to an entity’s principal customers to verify the existence of accounts receivable."},{"label":"C","text":"Inspecting an entity’s analysis of accounts receivable for unusual balances."},{"label":"D","text":"Comparing an entity’s uncollectible accounts expense to actual uncollectible accounts receivable."}],"ans":"A","explanation":"Observing employee performance of control activities provides evidence of control operation below maximum."},{"id":"AT10005_Q37","n":37,"stem":"An internal control questionnaire indicates that an approved receiving report is required to accompany every check request for payment of merchandise. Which of the following procedures provides the greatest assurance that this control is operating effectively?","opts":[{"label":"A","text":"Select and examine receiving reports and ascertain that the related canceled checks are dated no earlier than the receiving reports."},{"label":"B","text":"Select and examine receiving reports and ascertain that the related canceled checks are dated no later than the receiving reports."},{"label":"C","text":"Select and examine canceled checks and ascertain that the related receiving reports are dated no earlier than the checks."},{"label":"D","text":"Select and examine canceled checks and ascertain that the related receiving reports are dated no later than the checks."}],"ans":"D","explanation":"Sampling cancelled checks and verifying receiving reports exist and are dated prior to/no later than the checks."},{"id":"AT10005_Q38","n":38,"stem":"An auditor uses the knowledge provided by the understanding of internal control and the final assessed level of control risk primarily to determine the nature, timing, and extent of the","opts":[{"label":"A","text":"Attribute tests"},{"label":"B","text":"Compliance tests"},{"label":"C","text":"Tests of controls"},{"label":"D","text":"Substantive tests"}],"ans":"D","explanation":"The final assessed level of control risk dictates the nature, timing, and extent of substantive tests."},{"id":"AT10005_Q39","n":39,"stem":"When there are numerous property and equipment transactions during the year, an auditor who plans to assess control risk at a low level usually performs","opts":[{"label":"A","text":"Tests of controls and extensive tests of property and equipment balances at the end of the year."},{"label":"B","text":"Analytical procedures for current year property and equipment transactions."},{"label":"C","text":"Tests of controls and limited tests of current year property and equipment transactions."},{"label":"D","text":"Analytical procedures for property and equipment balances at the end of the year."}],"ans":"C","explanation":"Assessing CR low allows performing tests of controls and limited tests of current year transactions."},{"id":"AT10005_Q40","n":40,"stem":"Tests of controls are least likely to be omitted with regard to","opts":[{"label":"A","text":"Accounts believed to be subject to ineffective controls."},{"label":"B","text":"Accounts representing few transactions."},{"label":"C","text":"Accounts representing many transactions."},{"label":"D","text":"Subsequent events."}],"ans":"C","explanation":"High transaction volume accounts benefit most from reliance on controls to achieve audit efficiency."}]},{"id":"AT-10006","code":"AT-10006","title":"Materiality, Misstatements, Analytical Procedures, Related Parties, Internal Audit & Experts","standards":"PSA 320, PSA 450, PSA 520, PSA 550, PSA 610, PSA 620","questionCount":30,"summary":"Materiality levels (Overall, Performance, Specific), PSA 450 Accumulation and Evaluation of Misstatements (Trivial threshold, Communication with TCWG), PSA 520 Analytical Procedures (Planning, Substantive, Final Review), PSA 550 Related Parties (Inquiry, Significant Risks, Disclosures), PSA 610 Using the Work of Internal Auditors (Competence, Objectivity, Direct Assistance), and PSA 620 Using the Work of an Auditor's Expert.","lectureOutline":"### PSA 320: MATERIALITY IN PLANNING AND PERFORMING AN AUDIT\n- Materiality is a matter of professional judgment, affected by the perception of the financial information needs of users.\n- Applied both in **planning and performing** the audit, and in **evaluating the effect of misstatements**.\n\n#### Three Different Levels of Materiality (AASC Bulletin 001-2010)\n1. **Materiality for the Financial Statements as a Whole (Overall Materiality):**\n   - Determined by identifying an appropriate benchmark (e.g. profit before tax, total revenue, gross profit, total equity, net asset value) and applying an appropriate percentage.\n   - Evaluates whether proposed audit adjustments are significant.\n2. **Performance Materiality:**\n   - Set below overall materiality to reduce to an appropriately low level the probability that aggregate uncorrected and undetected misstatements exceed overall materiality.\n   - Used for scoping financial statement line items.\n3. **Specific Materiality:**\n   - Amount set for particular classes of transactions, account balances, or disclosures where lesser amounts could reasonably be expected to influence economic decisions.\n\n---\n\n### PSA 450: EVALUATION OF MISSTATEMENTS IDENTIFIED DURING THE AUDIT\n- Accumulate all misstatements identified during the audit, other than those that are **clearly trivial**.\n- Request management to correct all accumulated misstatements.\n- Communicate with TCWG uncorrected misstatements and their effect on the opinion.\n- Request written representation from management and TCWG that effects of uncorrected misstatements are immaterial.\n\n---\n\n### PSA 520: ANALYTICAL PROCEDURES\nEvaluations of financial information through analysis of plausible relationships among both financial and non-financial data.\n- **Timing of Analytical Procedures:**\n  1. *Planning Stage:* Mandatory (RAP). Focuses on enhancing understanding and identifying areas of high risk.\n  2. *Substantive Testing Stage:* Optional. Used to obtain substantive evidence when more effective/efficient.\n  3. *Final Review Stage:* Mandatory. Near the end of the audit to form an overall conclusion whether FS are consistent with the auditor's understanding.\n\n---\n\n### PSA 550: RELATED PARTIES\n- Management is responsible for identifying and disclosing related parties.\n- Auditor inquires of management, inspects records, and remains alert for undisclosed related parties.\n- Significant related party transactions outside the normal course of business are treated as **significant risks**.\n\n---\n\n### PSA 610: USING THE WORK OF INTERNAL AUDITORS\n- Evaluate the internal audit function's:\n  1. Organizational status and policies supporting **objectivity**;\n  2. Level of **competence**; and\n  3. Systematic and disciplined approach (quality control).\n- External auditor cannot share responsibility for the audit opinion.\n\n---\n\n### PSA 620: USING THE WORK OF AN AUDITOR’S EXPERT\n- Expert in a field other than accounting or auditing (actuary, engineer, appraiser, lawyer).\n- Evaluate competence, capabilities, and objectivity.\n- Obtain agreement in writing on nature, scope, objectives, roles, confidentiality.\n- The auditor shall **not refer to the work of an auditor's expert in an unmodified opinion** unless required by law. If referred to in a modified opinion, state that reference does not reduce auditor's responsibility.","items":[{"id":"AT10006_Q1","n":1,"stem":"Which of the following concepts about materiality is incorrect?","opts":[{"label":"A","text":"Materiality is directly related to the acceptable level of detection risk."},{"label":"B","text":"Materiality does not apply if internal control is highly effective."},{"label":"C","text":"Materiality is a matter of professional audit judgment."},{"label":"D","text":"None is incorrect."}],"ans":"B","explanation":"Materiality applies in all audits regardless of how effective internal control may be."},{"id":"AT10006_Q2","n":2,"stem":"The auditor is required to determine three different levels of materiality: (1) materiality for the financial statements as a whole, (2) performance materiality, and (3)","opts":[{"label":"A","text":"Overall materiality"},{"label":"B","text":"Planning materiality"},{"label":"C","text":"General materiality"},{"label":"D","text":"Specific materiality"}],"ans":"D","explanation":"Under AASC Bulletin 001-2010, the three levels are: overall materiality, performance materiality, and specific materiality."},{"id":"AT10006_Q3","n":3,"stem":"What materiality level would be considered by the auditor to determine whether the proposed adjustments are significant or not?","opts":[{"label":"A","text":"Overall materiality"},{"label":"B","text":"Scoping materiality"},{"label":"C","text":"Specific materiality"},{"label":"D","text":"Performance materiality"}],"ans":"A","explanation":"Overall materiality determines whether proposed audit adjustments are significant."},{"id":"AT10006_Q4","n":4,"stem":"Which of the following factors are normally considered by the auditor in determining the appropriate benchmark for the purpose of calculating overall materiality?\nI. Components of the entity’s financial statements\nII. Laws and regulations\nIII. Nature of the entity","opts":[{"label":"A","text":"I and II only"},{"label":"B","text":"I and III only"},{"label":"C","text":"II and III only"},{"label":"D","text":"I, II, and III"}],"ans":"D","explanation":"All of these factors influence benchmark selection for overall materiality."},{"id":"AT10006_Q5","n":5,"stem":"Which of the following statements concerning materiality is not correct?","opts":[{"label":"A","text":"When establishing the overall audit strategy, the auditor shall determine materiality for the financial statements as a whole."},{"label":"B","text":"If, in the specific circumstances of the entity, there is one or more particular classes of transactions, account balances or disclosures for which misstatements of lesser amounts than materiality for the financial statements as a whole could reasonably be expected to influence the economic decisions of users taken on the basis of the financial statements, the auditor shall also determine the materiality level or levels to those particular classes of transactions, account balances or disclosures."},{"label":"C","text":"Determining materiality involves the exercise of professional judgment."},{"label":"D","text":"The materiality level for the financial statements as a whole determined in the planning stage of the audit should not be affected by changes in the circumstances of the engagement."}],"ans":"D","explanation":"Materiality must be revised as the audit progresses if the auditor becomes aware of information that would have caused determination of a different amount."},{"id":"AT10006_Q6","n":6,"stem":"The concepts of audit risk and materiality are interrelated and must be considered together by the auditor. Which of the following is true?","opts":[{"label":"A","text":"Audit risk is the risk that the auditor may unknowingly express a modified opinion when, in fact, the financial statements are fairly stated."},{"label":"B","text":"The phrase in the auditor’s report “present fairly, in all material respects, in accordance with Philippine Financial Reporting Standards” indicates the auditor’s belief that the financial statements as a whole are not materially misstated."},{"label":"C","text":"If misstatements are not important individually but are important in the aggregate, the concept of materiality does not apply."},{"label":"D","text":"Material fraud but not material errors cause financial statements to be materially misstated."}],"ans":"B","explanation":"The phrase \"present fairly, in all material respects\" explicitly communicates the auditor's opinion regarding the absence of material misstatements."},{"id":"AT10006_Q7","n":7,"stem":"In evaluating the fair presentation of the financial statements, the auditor should assess whether the aggregate of uncorrected misstatements that have been identified during the audit is material. The aggregate of uncorrected misstatements comprises\nI. Specific misstatements identified by the auditor including the net effect of uncorrected misstatements identified during the audit of previous period.\nII. The auditor’s best estimate of other misstatements which cannot be specifically identified.","opts":[{"label":"A","text":"I only."},{"label":"B","text":"II only."},{"label":"C","text":"Both I and II."},{"label":"D","text":"Neither I nor II."}],"ans":"C","explanation":"Aggregate uncorrected misstatements comprises identified specific misstatements plus projected/estimated unidentifiable misstatements."},{"id":"AT10006_Q8","n":8,"stem":"A client decides not to correct misstatements communicated by the auditor that collectively are not material and wants the auditor to issue the report based on the uncorrected numbers. Which of the following statements is correct regarding the financial statement presentation?","opts":[{"label":"A","text":"The financial statements are free from material misstatement, and no disclosure is required in the notes to the financial statements."},{"label":"B","text":"The financial statements are not in accordance with the applicable financial reporting framework."},{"label":"C","text":"The financial statements contain uncorrected misstatements that should result in a qualified opinion."},{"label":"D","text":"The financial statements are free of material misstatement, but the disclosure of the proposed adjustments is required in the notes to the financial statements."}],"ans":"A","explanation":"Because the uncorrected misstatements are immaterial, the financial statements remain free of material misstatement and no note disclosure is required."},{"id":"AT10006_Q9","n":9,"stem":"For audits of financial statements made in accordance with PSAs, the use of analytical procedures is required to some extent:\nIn Planning Stage | As Substantive Test | In Final Review Stage","opts":[{"label":"A","text":"No | Yes | Yes"},{"label":"B","text":"Yes | Yes | No"},{"label":"C","text":"Yes | No | Yes"},{"label":"D","text":"No | No | No"}],"ans":"C","explanation":"Analytical procedures are mandatory in the Planning stage (PSA 315) and Final Review stage (PSA 520); they are optional as substantive tests."},{"id":"AT10006_Q10","n":10,"stem":"Analytical procedures used in planning an audit should focus on identifying","opts":[{"label":"A","text":"Material weaknesses of internal control."},{"label":"B","text":"The predictability of financial data from individual transactions."},{"label":"C","text":"The various assertions that are embodied in the financial statements."},{"label":"D","text":"Areas that may represent specific risks relevant to the audit."}],"ans":"D","explanation":"Planning analytical procedures identify unusual transactions and areas representing specific risks relevant to the audit."},{"id":"AT10006_Q11","n":11,"stem":"Which of the following statements concerning analytical procedures is true?","opts":[{"label":"A","text":"Analytical procedures may be omitted entirely for some financial statement audits."},{"label":"B","text":"Analytical procedures used in planning the audit should not use nonfinancial information."},{"label":"C","text":"Analytical procedures usually are effective and efficient for tests of controls."},{"label":"D","text":"Analytical procedures alone may provide the appropriate level of assurance for some assertions."}],"ans":"D","explanation":"Substantive analytical procedures alone can provide sufficient appropriate evidence for predictable accounts."},{"id":"AT10006_Q12","n":12,"stem":"Which of the following would not be considered an analytical procedure?","opts":[{"label":"A","text":"Estimating payroll expense by multiplying the number of employees by the average hourly wage rate and the total hours worked."},{"label":"B","text":"Projecting an error rate by comparing the results of a statistical sample with the actual population characteristics."},{"label":"C","text":"Computing accounts receivable turnover by dividing credit sales by the average net receivables."},{"label":"D","text":"Developing the expected sales based on the sales trend of the prior five years."}],"ans":"B","explanation":"Projecting an error rate from a statistical sample is an audit sampling procedure, not an analytical procedure."},{"id":"AT10006_Q13","n":13,"stem":"Which of the following procedures would an auditor most likely perform in planning a financial statement audit?","opts":[{"label":"A","text":"Inquiring of the client’s legal counsel concerning pending litigation."},{"label":"B","text":"Comparing the financial statements with anticipated results."},{"label":"C","text":"Examining computer-generated exception reports to verify the effectiveness of internal control."},{"label":"D","text":"Searching for unauthorized transactions that may aid in detecting unrecorded liabilities."}],"ans":"B","explanation":"Comparing financial statements with budgeted/anticipated results is an analytical procedure performed during planning."},{"id":"AT10006_Q14","n":14,"stem":"Analytical procedures may be classified as being primarily","opts":[{"label":"A","text":"Tests of controls."},{"label":"B","text":"Substantive tests."},{"label":"C","text":"Tests of ratios."},{"label":"D","text":"Tests of details of balances."}],"ans":"B","explanation":"Analytical procedures are classified primarily as substantive procedures."},{"id":"AT10006_Q15","n":15,"stem":"The primary objective of analytical procedures used in the overall review stage of an audit is to","opts":[{"label":"A","text":"Obtain evidence from details testing to corroborate particular assertions."},{"label":"B","text":"Identify areas that represent specific risks relevant to the audit."},{"label":"C","text":"Assist the auditor in assessing the validity of the conclusions reached."},{"label":"D","text":"Satisfy doubts when questions arise about a client’s ability to continue in existence."}],"ans":"C","explanation":"In the overall review stage, analytical procedures assist in assessing the validity of audit conclusions reached."},{"id":"AT10006_Q16","n":16,"stem":"Analytical procedures used in the overall review stage of an audit generally include","opts":[{"label":"A","text":"Considering unusual or unexpected account balances that were not previously identified."},{"label":"B","text":"Performing tests of transactions to corroborate management’s financial statement assertions."},{"label":"C","text":"Gathering evidence concerning account balances that have not changed from the prior year."},{"label":"D","text":"Retesting controls that appeared to be ineffective during the assessment of control risk."}],"ans":"A","explanation":"Overall review analytical procedures help identify previously unrecognized risks or unexpected balances."},{"id":"AT10006_Q17","n":17,"stem":"When auditing related party transactions, an auditor places primary emphasis on","opts":[{"label":"A","text":"Confirming the existence of the related parties."},{"label":"B","text":"Verifying the valuation of the related party transactions."},{"label":"C","text":"Evaluating the disclosure of the related party transactions."},{"label":"D","text":"Ascertaining the rights and obligations of the related parties."}],"ans":"C","explanation":"Primary emphasis is placed on adequacy of disclosure because related party transactions cannot be presumed to be at arm's length."},{"id":"AT10006_Q18","n":18,"stem":"Which of the following auditing procedures most likely would assist an auditor in identifying related party transactions?","opts":[{"label":"A","text":"Inspecting correspondence with lawyers for evidence of unreported contingent liabilities."},{"label":"B","text":"Vouching accounting records for recurring transactions recorded just after the balance sheet date."},{"label":"C","text":"Reviewing confirmations of loans receivable and payable for indications of guarantees."},{"label":"D","text":"Performing analytical procedures for indications of possible financial difficulties."}],"ans":"C","explanation":"Guarantees on loans receivable/payable often indicate related party relationships."},{"id":"AT10006_Q19","n":19,"stem":"Which of the following most likely would indicate the existence of related parties?","opts":[{"label":"A","text":"Writing down obsolete inventory just before year-end."},{"label":"B","text":"Failing to correct previously identified internal control deficiencies."},{"label":"C","text":"Depending on a single product for the success of the entity."},{"label":"D","text":"Borrowing money at an interest rate significantly below the market rate."}],"ans":"D","explanation":"Borrowing at terms significantly non-market (such as unusually low interest rates) indicates related party transactions."},{"id":"AT10006_Q20","n":20,"stem":"After determining that a related party transaction has, in fact, occurred an auditor should","opts":[{"label":"A","text":"Substantiate that related party transactions were consummated on terms equivalent to those that prevail in arm’s-length transactions."},{"label":"B","text":"Perform analytical procedures to verify whether similar transactions have occurred, but were not recorded."},{"label":"C","text":"Obtain an understanding of the purpose of the transaction."},{"label":"D","text":"Determine whether a particular transaction would have occurred if the parties had not been related."}],"ans":"C","explanation":"The auditor must obtain an understanding of the business purpose and rationale of the related party transaction."},{"id":"AT10006_Q21","n":21,"stem":"Which of the following are included in the activities of the internal audit function?\nI. Monitoring of internal control.\nII. Examination of financial and operating information.\nIII. Review of operating activities.","opts":[{"label":"A","text":"I and II only"},{"label":"B","text":"I and III only"},{"label":"C","text":"II and III only"},{"label":"D","text":"I, II, and III"}],"ans":"D","explanation":"Internal audit activities include monitoring control, examining information, and reviewing operational activities."},{"id":"AT10006_Q22","n":22,"stem":"The external auditor should obtain a sufficient understanding of the internal audit function because","opts":[{"label":"A","text":"The understanding of the internal audit function is an important substantive test to be performed by the external auditor."},{"label":"B","text":"The audit programs, working papers, and reports of internal auditors may often be used as a substitute for the work of the external auditor’s staff."},{"label":"C","text":"The procedures performed by the internal audit staff may eliminate the external auditor’s need for considering internal control."},{"label":"D","text":"The work performed by internal auditors may be a factor in determining the nature, timing, and extent of the external auditor’s procedures."}],"ans":"D","explanation":"Internal audit work influences the nature, timing, and extent of external audit procedures."},{"id":"AT10006_Q23","n":23,"stem":"If the external auditor decides that it is efficient to consider how the work performed by the internal auditors may affect the nature, timing, and extent of audit procedures, he/she should assess the internal auditors’","opts":[{"label":"A","text":"Efficiency and experience"},{"label":"B","text":"Independence and review skills"},{"label":"C","text":"Training and supervisory skills"},{"label":"D","text":"Competence and objectivity"}],"ans":"D","explanation":"Under PSA 610, the primary criteria are competence and objectivity (plus systematic/disciplined approach)."},{"id":"AT10006_Q24","n":24,"stem":"Which of the following factors should an external auditor obtain updated information about when assessing an internal auditor’s competence?","opts":[{"label":"A","text":"The reporting status of the internal auditor within the organization."},{"label":"B","text":"The educational level and professional experiences of the internal auditor."},{"label":"C","text":"Whether policies prohibit the internal auditor from auditing areas where relatives are employed."},{"label":"D","text":"Whether the board of directors, audit committee, or owner-manager oversees employment decisions related to the internal auditor."}],"ans":"B","explanation":"Educational level, certifications, and professional experience are indicators of competence."},{"id":"AT10006_Q25","n":25,"stem":"Which of the following is an incorrect statement concerning the relationship of the internal auditor and the scope of the external audit of an entity’s financial statements?","opts":[{"label":"A","text":"The external auditor is not required to give consideration to the internal audit function beyond obtaining a sufficient understanding to identify and assess the risks of material misstatement of the financial statements and to design and perform further audit procedures."},{"label":"B","text":"The internal auditors may determine the extent to which audit procedures should be employed by the external auditor."},{"label":"C","text":"Under certain circumstances, the internal auditors may assist the external auditor in performing substantive tests and tests of controls."},{"label":"D","text":"The nature, timing, and extent of the external auditor’s substantive tests may be affected by the work of internal auditors."}],"ans":"B","explanation":"Internal auditors NEVER determine the extent of procedures employed by the external auditor."},{"id":"AT10006_Q26","n":26,"stem":"Which of the following is not an auditor’s expert upon whose work an auditor may rely?","opts":[{"label":"A","text":"Actuary"},{"label":"B","text":"Engineer"},{"label":"C","text":"Appraiser"},{"label":"D","text":"Internal auditor"}],"ans":"D","explanation":"An internal auditor is an employee of the client, not an \"auditor's expert\" under PSA 620."},{"id":"AT10006_Q27","n":27,"stem":"Which of the following statements is correct concerning an auditor’s use of the work of an expert?","opts":[{"label":"A","text":"An auditor may not use an expert in the determination of physical characteristics relating to inventories."},{"label":"B","text":"If there is a material difference between an expert’s findings and the assertions in the financial statements, only an adverse opinion may be issued."},{"label":"C","text":"If an auditor believes that the determinations made by an expert are unreasonable, only a qualified opinion may be issued."},{"label":"D","text":"The work of an expert who is related to the client may be acceptable under certain circumstances."}],"ans":"D","explanation":"An expert related to the client may be used if the auditor applies more extensive procedures to verify objectivity."},{"id":"AT10006_Q28","n":28,"stem":"Which of the following statements is correct concerning the auditor’s use of the work of an auditor’s expert?","opts":[{"label":"A","text":"The auditor is required to perform substantive test procedures to verify the expert’s assumptions and findings."},{"label":"B","text":"The auditor should obtain an understanding of the methods and assumptions used by the expert."},{"label":"C","text":"The entity should not have an understanding of the nature of the work to be performed by the expert."},{"label":"D","text":"The expert should not have an understanding of the auditor’s corroborative use of the expert’s findings."}],"ans":"B","explanation":"Under PSA 620, the auditor must obtain an understanding of the methods and assumptions used by the expert."},{"id":"AT10006_Q29","n":29,"stem":"If the results of the auditor’s expert’s work do not provide sufficient appropriate audit evidence or are not consistent with other audit evidence, the auditor should","opts":[{"label":"A","text":"Report the matter to the appropriate regulatory agency of the government."},{"label":"B","text":"Resolve the matter."},{"label":"C","text":"Withdraw from the engagement."},{"label":"D","text":"Express an unqualified opinion with reference to the work of the expert."}],"ans":"B","explanation":"The auditor must resolve inconsistencies by agreeing on further work with the expert or performing additional procedures."},{"id":"AT10006_Q30","n":30,"stem":"When issuing an unmodified auditor’s report, the auditor","opts":[{"label":"A","text":"May refer to the work of an auditor’s expert."},{"label":"B","text":"Should refer to the work of an auditor’s expert to indicate a division of responsibility."},{"label":"C","text":"Should include in the auditor’s report the identity of the auditor’s expert and the extent of the expert’s involvement."},{"label":"D","text":"Should not refer to the expert’s work."}],"ans":"D","explanation":"Under PSA 620, the auditor SHALL NOT refer to the work of an auditor's expert in an unmodified report unless required by law."}]},{"id":"AT-10007","code":"AT-10007","title":"Audit Evidence, Specific Considerations, Confirmations, Estimates, Documentation","standards":"PSA 500, PSA 501, PSA 505, PSA 540, PSA 230","questionCount":50,"summary":"Sufficient Appropriate Audit Evidence, Reliability Generalizations, Management Assertions (Transactions, Balances), Audit Procedures (Inspection, Observation, Inquiry, Confirmation, Recalculation, Reperformance, Analytical), PSA 501 Inventory attendance & litigation, PSA 505 Positive vs Negative Confirmations, PSA 540 Accounting Estimates, and PSA 230 Audit Documentation (Experienced auditor concept, 60-day assembly, permanent vs current files, ownership of working papers).","lectureOutline":"### PSA 500: AUDIT EVIDENCE\nInformation used by the auditor in arriving at conclusions on which the opinion is based:\n- **Sufficiency:** Quantity of evidence.\n- **Appropriateness:** Quality of evidence (Relevance and Reliability).\n\n#### Generalizations on Reliability of Audit Evidence\n1. Evidence obtained from independent sources outside the entity is more reliable.\n2. Evidence generated internally is more reliable when related controls are effective.\n3. Evidence obtained directly by the auditor (e.g. observation) is more reliable than indirect evidence (e.g. inquiry).\n4. Evidence in documentary form (paper or electronic) is more reliable than oral representation.\n5. Original documents are more reliable than photocopies or facsimiles.\n\n#### Financial Statement Assertions\n- **Classes of Transactions & Events:** Occurrence, Completeness, Accuracy, Cutoff, Classification, Presentation.\n- **Account Balances at Period End:** Existence, Rights and Obligations, Completeness, Accuracy/Valuation and Allocation, Classification, Presentation.\n\n---\n\n### PSA 501: SPECIFIC CONSIDERATIONS FOR SELECTED ITEMS\n- **Inventory:** Attendance at physical inventory counting is required unless impracticable. If unforeseen circumstances prevent attendance on planned date, observe counts on an alternative date and test intervening transactions.\n- **Litigation and Claims:** Letter of general inquiry prepared by management and sent by the auditor directly to external legal counsel. Management refusal is a scope limitation (qualified/disclaimer).\n\n---\n\n### PSA 505: EXTERNAL CONFIRMATIONS\n- **Positive Confirmation:** Respondent replies directly indicating agreement or disagreement, or providing information.\n- **Negative Confirmation:** Respondent replies only if in disagreement. Provides less persuasive evidence; used only when risk is low, large number of small balances, low exception rate expected, and no reason to believe requests will be disregarded.\n- **Control of Confirmations:** Auditor must maintain direct control over preparing, addressing, and sending requests and receiving replies.\n\n---\n\n### PSA 540: AUDITING ACCOUNTING ESTIMATES\nApproaches to auditing estimates:\n1. Review and test the process used by management.\n2. Develop an independent point estimate or range for comparison.\n3. Review subsequent events confirming the estimate.\n\n---\n\n### PSA 230: AUDIT DOCUMENTATION (WORKING PAPERS)\n- Must enable an **experienced auditor** having no previous connection with the audit to understand nature, timing, extent, results, and significant matters.\n- **Assembly of Final Audit File:** Ordinarily completed within **not more than 60 days** after the date of the auditor's report.\n- **Ownership:** Working papers are the property of the auditor (cannot substitute for the entity's accounting records).\n- **Files:**\n  - *Permanent File:* Continuing interest (articles of incorporation, contracts, loan indentures, internal control flowcharts, engagement letter).\n  - *Current File:* Pertinent to the current year (lead schedules, working trial balance, audit program, confirmations, rep letter).","items":[{"id":"AT10007_Q1","n":1,"stem":"Which of the following is correct?","opts":[{"label":"A","text":"The evidence that the auditor accumulates remains the same from audit to audit, but the general objectives vary, depending on the circumstances."},{"label":"B","text":"The general audit objectives remain the same from audit to audit, but the evidence varies, depending on the circumstances."},{"label":"C","text":"The circumstances may vary from audit to audit, but the evidence accumulated remains the same."},{"label":"D","text":"The general audit objectives may vary from audit to audit, but the circumstances remain the same."}],"ans":"B","explanation":"General audit objectives remain constant across audits, while evidence gathered varies based on risk and circumstances."},{"id":"AT10007_Q2","n":2,"stem":"Auditing standards require the auditor to accumulate sufficient competent evidence to support the opinion issued. Because of the nature of audit evidence, it is","opts":[{"label":"A","text":"unlikely that the auditor will be completely convinced that the opinion is correct."},{"label":"B","text":"likely that the auditor will be completely convinced that the opinion is correct."},{"label":"C","text":"unlikely that the auditor will arrive at a conclusion."},{"label":"D","text":"likely that the auditor would change his/her mind about the opinion if he/she takes the time to gather additional evidence."}],"ans":"A","explanation":"Audit evidence is persuasive rather than conclusive; absolute conviction is unattainable."},{"id":"AT10007_Q3","n":3,"stem":"An audit evidence is generally considered relevant when it is","opts":[{"label":"A","text":"derived through valid statistical sampling."},{"label":"B","text":"objective and unbiased."},{"label":"C","text":"factual, adequate, and convincing."},{"label":"D","text":"consistent with the audit objectives."}],"ans":"D","explanation":"Relevance refers to the logical connection with the specific audit objective or assertion being tested."},{"id":"AT10007_Q4","n":4,"stem":"Which of the following statements concerning evidential matter is true?","opts":[{"label":"A","text":"Appropriate evidence supporting management’s assertions should be convincing rather than merely persuasive."},{"label":"B","text":"Effective internal control contributes little to the reliability of the evidence created within the entity."},{"label":"C","text":"The cost of obtaining evidence is not an important consideration to an auditor in deciding what evidence should be obtained."},{"label":"D","text":"A client’s accounting records cannot be considered sufficient evidence to support the financial statements."}],"ans":"D","explanation":"Accounting records alone are not sufficient; they must be corroborated with other audit evidence."},{"id":"AT10007_Q5","n":5,"stem":"Evidential matter supporting the financial statements consists of the underlying accounting data and all corroborating information available to the auditor. Which of the following is an example of corroborating information?","opts":[{"label":"A","text":"Minutes of meetings of the board of directors"},{"label":"B","text":"General and subsidiary ledgers"},{"label":"C","text":"Accounting manuals"},{"label":"D","text":"Worksheets supporting cost allocations"}],"ans":"A","explanation":"Minutes of board meetings constitute corroborating information outside the underlying accounting records."},{"id":"AT10007_Q6","n":6,"stem":"Which of the following types of audit evidence provides the least assurance of reliability?","opts":[{"label":"A","text":"Receivable confirmations received from the client's customers."},{"label":"B","text":"Prenumbered receiving reports completed by the client's employees."},{"label":"C","text":"Prior months' bank statements obtained from the client."},{"label":"D","text":"Municipal property tax bills prepared in the client's name."}],"ans":"B","explanation":"Internally generated receiving reports prepared by client employees provide less reliability than external third-party documents."},{"id":"AT10007_Q7","n":7,"stem":"Which of the following procedures would provide the most reliable audit evidence?","opts":[{"label":"A","text":"Inquiries of the client’s internal audit staff held in private"},{"label":"B","text":"Inspection of prenumbered client purchase orders filed in the vouchers payable department"},{"label":"C","text":"Analytical procedures performed by the auditor on the entity’s trial balance"},{"label":"D","text":"Inspection of bank statements obtained directly from the client’s financial institution"}],"ans":"D","explanation":"Bank statements obtained directly by the auditor from external financial institutions have the highest reliability."},{"id":"AT10007_Q8","n":8,"stem":"Which of the following is not a basic procedure used in an audit?","opts":[{"label":"A","text":"Risk assessment procedures."},{"label":"B","text":"Substantive test procedures."},{"label":"C","text":"Tests of controls."},{"label":"D","text":"Tests of direct evidence."}],"ans":"D","explanation":"The three basic procedure categories are: RAP, TOC, and Substantive Procedures."},{"id":"AT10007_Q9","n":9,"stem":"Audit procedures may be classified as risk assessment procedures and further audit procedures. Which of the following does not describes further audit procedures?","opts":[{"label":"A","text":"These procedures test the operating effectiveness of controls in preventing, or detecting and correcting, material misstatements at the assertion level."},{"label":"B","text":"These procedures are used to detect material misstatements at the assertion level."},{"label":"C","text":"These are procedures for obtaining an understanding of the entity and its environment, including its internal control, to assess the risks of material misstatement at the financial statement and assertion levels."},{"label":"D","text":"These procedures include tests of details of classes of transactions, account balances, and disclosures and analytical procedures."}],"ans":"C","explanation":"Obtaining an understanding to assess RMM describes risk assessment procedures, not further audit procedures."},{"id":"AT10007_Q10","n":10,"stem":"Which of the following is not a distinguishing feature of risk-based auditing?","opts":[{"label":"A","text":"Identifying areas posing the highest risk of financial statement errors"},{"label":"B","text":"Analysis of internal control"},{"label":"C","text":"Collecting and evaluating evidence"},{"label":"D","text":"Concentrating audit resources in those areas presenting the highest risk of financial statement errors"}],"ans":"C","explanation":"Collecting and evaluating evidence is common to all audit methodologies, not a distinguishing feature of risk-based auditing."},{"id":"AT10007_Q11","n":11,"stem":"Observation is considered a reliable audit procedure but one that is limited in usefulness. However, it is used in a number of different situations. Which of the following statements is true regarding observation as an audit technique?","opts":[{"label":"A","text":"It is the most effective audit methodology to use in filling out internal control questionnaires."},{"label":"B","text":"It is the most persuasive methodology to learn how transactions are really processed during the period under audit."},{"label":"C","text":"It is the most persuasive audit technique for determining if fraud has occurred."},{"label":"D","text":"It is most persuasive about the performance of a process but is limited to the moment in time at which the observation takes place."}],"ans":"D","explanation":"Observation is limited to the point in time at which the observation takes place, and the act of observing may affect behavior."},{"id":"AT10007_Q12","n":12,"stem":"Which of the following is a false statement about audit objectives?","opts":[{"label":"A","text":"There should be a one-to-one relationship between audit objectives and procedures."},{"label":"B","text":"Audit objectives should be developed in light of management assertions about the financial statement components."},{"label":"C","text":"Selection of tests of financial statement assertions should depend upon the understanding of internal control."},{"label":"D","text":"The auditor should resolve any substantial doubt about any of management’s relevant financial statement assertions."}],"ans":"A","explanation":"There is not a one-to-one relationship; a single procedure can satisfy multiple objectives, and multiple procedures may be needed for one objective."},{"id":"AT10007_Q13","n":13,"stem":"Which of the following is not an assertion relating to classes of transactions?","opts":[{"label":"A","text":"Accuracy."},{"label":"B","text":"Occurrence."},{"label":"C","text":"Cutoff."},{"label":"D","text":"Consistency."}],"ans":"D","explanation":"\"Consistency\" is not one of the standard assertions under PSA 500 (which are occurrence, completeness, accuracy, cutoff, classification, presentation)."},{"id":"AT10007_Q14","n":14,"stem":"Which of the following is a management assertion regarding account balances at the period end?","opts":[{"label":"A","text":"Transactions and events that have been recorded have occurred and pertain to the entity."},{"label":"B","text":"Transactions and events have been recorded in the proper accounts."},{"label":"C","text":"The entity holds or controls the rights to assets, and liabilities are obligations of the entity."},{"label":"D","text":"Amounts and other data related to transactions and events have been recorded appropriately."}],"ans":"C","explanation":"Rights and obligations is an assertion regarding account balances at period end."},{"id":"AT10007_Q15","n":15,"stem":"Which of the following might be detected by an auditor’s review of the client’s sales cut-off?","opts":[{"label":"A","text":"Excessive goods returned for credit."},{"label":"B","text":"Unrecorded sales discounts."},{"label":"C","text":"Lapping of year-end accounts receivable."},{"label":"D","text":"Inflated sales for the year."}],"ans":"D","explanation":"Recording subsequent period sales in the current period inflates current year sales; sales cut-off tests detect this."},{"id":"AT10007_Q16","n":16,"stem":"Which of the following should be considered by the auditor in deciding which means (or combination of means) to use in selecting items for testing?\nI. The risk of material misstatement related to the assertion being tested.\nII. Audit efficiency.","opts":[{"label":"A","text":"I only"},{"label":"B","text":"II only"},{"label":"C","text":"Both I and II"},{"label":"D","text":"Neither I nor II"}],"ans":"C","explanation":"Both RMM and audit efficiency guide whether to use 100% examination, specific item selection, or audit sampling."},{"id":"AT10007_Q17","n":17,"stem":"Which of the following statements about specific item testing is false?","opts":[{"label":"A","text":"It is selective."},{"label":"B","text":"It does not constitute sampling."},{"label":"C","text":"It can be an efficient means of gathering audit evidence."},{"label":"D","text":"The results of audit procedures applied to items selected in this way can be projected to the entire population."}],"ans":"D","explanation":"Results from selecting specific items (e.g. high-value items) CANNOT be projected to the remainder of the population."},{"id":"AT10007_Q18","n":18,"stem":"According to PSA 530, selecting specific items may include selecting the following, except:","opts":[{"label":"A","text":"All items over a certain amount"},{"label":"B","text":"Low value or non-key items"},{"label":"C","text":"Items to obtain information"},{"label":"D","text":"Items to test control"}],"ans":"B","explanation":"Specific item selection focuses on high-value, key, or risk items, not low-value non-key items."},{"id":"AT10007_Q19","n":19,"stem":"It will be appropriate to audit all the items that make up a class of transactions or account balance (100% examination), except","opts":[{"label":"A","text":"When the class of transactions or account balance consists of a large number of small value items."},{"label":"B","text":"When the class of transactions or account balance consists of a small number of large value items."},{"label":"C","text":"When there is a significant risk of misstatement and other selection methods do not provide sufficient appropriate audit evidence."},{"label":"D","text":"When the repetitive nature of a calculation or other process performed automatically by the client’s computer information system (CIS) makes a 100% examination cost effective."}],"ans":"A","explanation":"Large numbers of small-value items are suited for audit sampling, not 100% examination."},{"id":"AT10007_Q20","n":20,"stem":"Audit sampling involves the","opts":[{"label":"A","text":"Selection of all items over a certain amount"},{"label":"B","text":"Application of audit procedures to all items that comprise a class of transactions or an account balance"},{"label":"C","text":"Application of audit procedures to all items over a certain amount and those that are unusual or have a history of error"},{"label":"D","text":"Application of audit procedures to less than 100% of items within a class of transactions or an account balance such that all items have a chance of selection"}],"ans":"D","explanation":"This is the definition of audit sampling under PSA 530."},{"id":"AT10007_Q21","n":21,"stem":"Confirmation is “the process of obtaining and evaluating a direct communication from a third party in response to a request for information about a particular item affecting financial statement assertions.” Two assertions for which confirmation of accounts receivable balances provides primary evidence are","opts":[{"label":"A","text":"Completeness and valuation"},{"label":"B","text":"Existence and completeness"},{"label":"C","text":"Valuation and rights and obligations"},{"label":"D","text":"Rights and obligations and existence"}],"ans":"D","explanation":"Accounts receivable confirmation primarily tests existence and rights and obligations (it does not prove collectibility/valuation or completeness)."},{"id":"AT10007_Q22","n":22,"stem":"Who signs the confirmation requests?","opts":[{"label":"A","text":"The audit partner"},{"label":"B","text":"The CEO/CFO of the client"},{"label":"C","text":"The appropriate level of management"},{"label":"D","text":"Both management and the auditor"}],"ans":"C","explanation":"The request must be signed by the appropriate level of management to authorize the third party to release information to the auditor."},{"id":"AT10007_Q23","n":23,"stem":"When the recipient has accomplished the confirmation request, replies should be:","opts":[{"label":"A","text":"Sent directly to the auditor"},{"label":"B","text":"Sent directly to the client, after which the client gives the replies to the auditor"},{"label":"C","text":"Sent directly to the auditor, with another copy of the reply going to the client"},{"label":"D","text":"Not sent back since a confirmation request does not necessitate replies"}],"ans":"A","explanation":"To maintain audit evidence integrity, confirmation replies must be sent directly to the auditor."},{"id":"AT10007_Q24","n":24,"stem":"Which of the following sets of information does an auditor confirm on one form?","opts":[{"label":"A","text":"Accounts payable and purchase commitments."},{"label":"B","text":"Cash in bank and collateral for loans."},{"label":"C","text":"Inventory on consignment and contingent liabilities."},{"label":"D","text":"Accounts receivable and accrued interest receivable."}],"ans":"B","explanation":"The standard bank confirmation request form confirms cash deposit balances and loan collateral simultaneously."},{"id":"AT10007_Q25","n":25,"stem":"In which of the following circumstances would the use of the negative form of accounts receivable confirmation most likely be justified?","opts":[{"label":"A","text":"A substantial number of accounts may be in dispute and the accounts receivable balance arises from sales to a few major customers."},{"label":"B","text":"A substantial number of accounts may be in dispute and the accounts receivable balance arises from sales to many customers with small balances."},{"label":"C","text":"A small number of accounts may be in dispute and the accounts receivable balance arises from sales to a few major customers."},{"label":"D","text":"A small number of accounts may be in dispute and the accounts receivable balance arises from sales to many customers with small balances."}],"ans":"D","explanation":"Negative confirmation is justified when RMM is low, many small balances are involved, and low exception rate is expected."},{"id":"AT10007_Q26","n":26,"stem":"Positive confirmation request is not used when:","opts":[{"label":"A","text":"A large number of small balances are involved."},{"label":"B","text":"The entity’s information systems and internal controls are unreliable or ineffective"},{"label":"C","text":"The information available to corroborate management’s assertion(s) is only available outside the entity"},{"label":"D","text":"Specific fraud risk factors, such as risk of management override of internal controls, prevent the auditor from relying on evidence from the entity."}],"ans":"A","explanation":"When a large number of small balances are involved and risk is low, negative confirmation is used instead."},{"id":"AT10007_Q27","n":27,"stem":"The return of positive accounts receivable confirmation without an exception attests to the","opts":[{"label":"A","text":"Collectibility of the accounts receivable."},{"label":"B","text":"Accuracy of the aging of accounts receivable."},{"label":"C","text":"Accuracy of the receivables balance."},{"label":"D","text":"Accuracy of the allowance for bad debts."}],"ans":"C","explanation":"Confirmation attests that the balance recorded exists and is acknowledged by the debtor (accuracy of balance)."},{"id":"AT10007_Q28","n":28,"stem":"Which of the following statements is correct concerning the use of negative confirmation requests?","opts":[{"label":"A","text":"Unreturned negative confirmation requests rarely provide significant explicit evidence."},{"label":"B","text":"Negative confirmation requests are effective when detection risk is low."},{"label":"C","text":"Unreturned negative confirmation requests indicate that alternative procedures are necessary."},{"label":"D","text":"Negative confirmation requests are effective when understatements of account balances are suspected."}],"ans":"A","explanation":"An unreturned negative confirmation provides implicit, not explicit, evidence because the debtor may simply have discarded it."},{"id":"AT10007_Q29","n":29,"stem":"The blank form of accounts receivable confirmations may be less efficient than the positive form because","opts":[{"label":"A","text":"Shipping documents need to be inspected."},{"label":"B","text":"Recipients may sign the forms without proper investigation."},{"label":"C","text":"More nonresponses to the requests are likely to occur."},{"label":"D","text":"Subsequent cash receipts need to be verified."}],"ans":"C","explanation":"Blank forms require the recipient to fill in the balance, which leads to lower response rates and greater follow-up work."},{"id":"AT10007_Q30","n":30,"stem":"Which of the following procedures would an auditor most likely perform for year-end accounts receivable confirmations when the auditor did not receive replies to second requests?","opts":[{"label":"A","text":"Review the cash receipts journal for the month prior to year-end."},{"label":"B","text":"Intensify the study of internal control concerning the revenue cycle."},{"label":"C","text":"Increase the assessed level of detection risk for the existence assertion."},{"label":"D","text":"Inspect the shipping records documenting the merchandise sold to the debtors."}],"ans":"D","explanation":"Alternative procedures for non-responding accounts receivable include inspecting subsequent cash collections and shipping documents/invoices."},{"id":"AT10007_Q31","n":31,"stem":"Which of the following audit procedures is best for identifying unrecorded trade accounts payable?","opts":[{"label":"A","text":"Reviewing cash disbursements recorded subsequent to the reporting date to determine whether the related payables apply to the prior period."},{"label":"B","text":"Investigating payables recorded just prior to and just subsequent to the reporting date to determine whether they are supported by receiving reports."},{"label":"C","text":"Examining unusual relationships between monthly accounts payable balances and recorded cash payments."},{"label":"D","text":"Reconciling vendors’ statements to the file of receiving reports to identify items received just prior to the reporting date."}],"ans":"A","explanation":"The search for unrecorded liabilities examines subsequent cash disbursements and matching receiving reports."},{"id":"AT10007_Q32","n":32,"stem":"S1: The primary source of information to be reported about litigation, claims, and assessments is the client’s management.\nS2: The primary source for evidence to corroborate the existence of pending litigation is attorney confirmations.","opts":[{"label":"A","text":"True, true"},{"label":"B","text":"False, false"},{"label":"C","text":"True, false"},{"label":"D","text":"False, true"}],"ans":"A","explanation":"Management is the primary source of information, and the attorney letter of inquiry provides primary corroboration."},{"id":"AT10007_Q33","n":33,"stem":"The auditor considers the status of legal matters up to","opts":[{"label":"A","text":"The date of the audit report."},{"label":"B","text":"The reporting date."},{"label":"C","text":"The issuance of financial statements."},{"label":"D","text":"The date of receipt of letter from lawyers."}],"ans":"A","explanation":"Legal inquiry responses and status of litigation are evaluated up to the date of the auditor's report."},{"id":"AT10007_Q34","n":34,"stem":"Which of the following procedures might be useful in discovering a contingent liability for a lawsuit that management is intentionally neglecting to disclose?","opts":[{"label":"A","text":"Inquiries (orally and in writing) of management."},{"label":"B","text":"Analyzing legal expense and review invoices and statements from outside legal counsel."},{"label":"C","text":"Reviewing current and previous years’ internal revenue agent reports."},{"label":"D","text":"Obtaining a letter of representation from management that it is aware of no undisclosed contingent liabilities."}],"ans":"B","explanation":"Analyzing legal expense accounts and invoices identifies law firms hired and matters being litigated."},{"id":"AT10007_Q35","n":35,"stem":"Which of the following is an audit procedure that an auditor most likely would perform concerning litigation, claims, and assessments?","opts":[{"label":"A","text":"Request the client’s lawyer to evaluate whether the client’s pending litigation, claims, and assessments indicate a going concern problem."},{"label":"B","text":"Examine the legal documents in the client’s lawyer’s possession concerning litigation, claims, and assessments to which the lawyer has devoted substantive attention."},{"label":"C","text":"Discuss with management its policies and procedures adopted for evaluating and accounting for litigation, claims, and assessments."},{"label":"D","text":"Confirm directly with the client’s lawyer that all litigation, claims, and assessments have been recorded or disclosed in the financial statements."}],"ans":"D","explanation":"Inquiring directly with legal counsel confirms completeness and reasonableness of litigation disclosures."},{"id":"AT10007_Q36","n":36,"stem":"A lawyer’s refusal to respond to a letter of audit inquiry normally requires the auditor to:","opts":[{"label":"A","text":"Issue a qualified opinion or a disclaimer of opinion."},{"label":"B","text":"Issue an unqualified opinion with an explanatory paragraph."},{"label":"C","text":"Issue a qualified or adverse opinion."},{"label":"D","text":"Issue an unqualified opinion."}],"ans":"A","explanation":"A lawyer's refusal to respond is a scope limitation leading to a qualified opinion or disclaimer of opinion."},{"id":"AT10007_Q37","n":37,"stem":"Which of the following statements is incorrect about accounting estimates?","opts":[{"label":"A","text":"Management is responsible for making accounting estimates included in the financial statements."},{"label":"B","text":"When evaluating accounting estimates, the auditor should pay particular attention to assumptions that are objective and are consistent with industry patterns."},{"label":"C","text":"The risk of material misstatement is greater when accounting estimates are involved."},{"label":"D","text":"The evidence available to support an accounting estimate will often be more difficult to obtain and less conclusive than evidence available to support other items in the financial statements."}],"ans":"B","explanation":"The auditor should pay particular attention to assumptions that are subjective or susceptible to bias, not those that are objective."},{"id":"AT10007_Q38","n":38,"stem":"In evaluating the assumptions on which the estimate is based, the auditor would need to pay particular attention to assumptions which are","opts":[{"label":"A","text":"reasonable in light of actual results in prior periods."},{"label":"B","text":"consistent with those used for other accounting estimates."},{"label":"C","text":"consistent with management’s plans which appear appropriate."},{"label":"D","text":"subjective or susceptible to material misstatement."}],"ans":"D","explanation":"Under PSA 540, particular attention is paid to subjective assumptions susceptible to management bias or misstatement."},{"id":"AT10007_Q39","n":39,"stem":"Which of the following is least likely to be an approach followed when auditing the fair values of assets and liabilities?","opts":[{"label":"A","text":"Review and test management’s process of valuation."},{"label":"B","text":"Confirm valuation with audit committee members."},{"label":"C","text":"Independently develop an estimate of the value of the account."},{"label":"D","text":"Review subsequent events relating to the account."}],"ans":"B","explanation":"Audit committee members are part of governance, not independent valuation experts or confirming parties."},{"id":"AT10007_Q40","n":40,"stem":"Which of the following procedures would an auditor ordinarily perform first in evaluating management’s accounting estimates for reasonableness?","opts":[{"label":"A","text":"Obtain an understanding of how management developed its estimates."},{"label":"B","text":"Develop independent expectations of management’s estimates."},{"label":"C","text":"Consider the appropriateness of the key factors in developing the estimates."},{"label":"D","text":"Test the calculations used by management in developing the estimates."}],"ans":"A","explanation":"The auditor first obtains an understanding of the process, data, and assumptions management used."},{"id":"AT10007_Q41","n":41,"stem":"Which of the following would an auditor generally perform to obtain assurance that accounting estimates are properly accounted for and disclosed?","opts":[{"label":"A","text":"Inquiry of management"},{"label":"B","text":"Make an independent estimate for comparison with client’s estimate"},{"label":"C","text":"Review subsequent events"},{"label":"D","text":"Obtain knowledge about the applicable financial reporting standards related to the accounting estimate"}],"ans":"A","explanation":"Inquiry of management regarding estimation bases and disclosure provides initial assurance on proper accounting."},{"id":"AT10007_Q42","n":42,"stem":"An auditor’s working papers serve mainly to","opts":[{"label":"A","text":"Provide the principal support for the auditor’s report."},{"label":"B","text":"Satisfy the auditor’s responsibilities concerning the Code of Ethics."},{"label":"C","text":"Monitor the effectiveness of the CPA firm’s quality control procedures."},{"label":"D","text":"Document the level of independence maintained by the auditor."}],"ans":"A","explanation":"Working papers provide the principal record of work performed and support for the auditor's report."},{"id":"AT10007_Q43","n":43,"stem":"Under the requirements of PSA 230, audit documentation must contain sufficient information to allow what type of auditor to understand the nature, timing, extent, and results of procedures performed?","opts":[{"label":"A","text":"An experienced audit team member."},{"label":"B","text":"An experienced auditor having no previous connection with the engagement."},{"label":"C","text":"Any certified public accountant."},{"label":"D","text":"An auditor qualified as a peer review specialist."}],"ans":"B","explanation":"Under PSA 230, documentation must be understood by an experienced auditor having no previous connection with the audit."},{"id":"AT10007_Q44","n":44,"stem":"Audit documentation may be recorded on paper or on electronic or other media. The following are examples of audit documentation, except","opts":[{"label":"A","text":"Audit programs"},{"label":"B","text":"Letters of confirmation and representation"},{"label":"C","text":"Correspondence (including e-mail) concerning significant matters"},{"label":"D","text":"The entity’s accounting records"}],"ans":"D","explanation":"The entity's accounting records belong to the client and do not constitute auditor working papers."},{"id":"AT10007_Q45","n":45,"stem":"The current file of the auditor’s working papers generally should include","opts":[{"label":"A","text":"A flowchart of the internal controls"},{"label":"B","text":"A copy of the financial statements"},{"label":"C","text":"Organization charts"},{"label":"D","text":"Copies of bond and note indentures"}],"ans":"B","explanation":"Financial statements of the current year are in the current file. Continuing documents (flowcharts, contracts, indentures) are in the permanent file."},{"id":"AT10007_Q46","n":46,"stem":"The permanent file portion of the auditor’s working papers generally should include","opts":[{"label":"A","text":"A copy of the engagement letter."},{"label":"B","text":"A copy of key customer confirmation."},{"label":"C","text":"Names and addresses of audit staff personnel on the engagements."},{"label":"D","text":"Time and expense reports."}],"ans":"A","explanation":"Continuing contractual agreements such as the ongoing engagement letter belong in the permanent file."},{"id":"AT10007_Q47","n":47,"stem":"The following are ordinarily excluded from audit documentation:\nSuperseded drafts | Preliminary notes | Corrected copies | Duplicates","opts":[{"label":"A","text":"Yes | Yes | Yes | Yes"},{"label":"B","text":"No | Yes | Yes | No"},{"label":"C","text":"No | No | Yes | Yes"},{"label":"D","text":"Yes | No | Yes | No"}],"ans":"A","explanation":"Under PSA 230, superseded drafts, preliminary notes, typographical error copies, and duplicates are excluded from final audit documentation."},{"id":"AT10007_Q48","n":48,"stem":"The completion of the assembly of the final audit file after the date of the auditor’s report does not ordinarily involve","opts":[{"label":"A","text":"The performance of new audit procedures or the drawing of new conclusions."},{"label":"B","text":"Sorting, collating and cross-referencing working papers."},{"label":"C","text":"Deleting or discarding superseded documentation."},{"label":"D","text":"Signing off on completion checklists relating to the file assembly process."}],"ans":"A","explanation":"File assembly is an administrative process that does NOT involve new audit procedures or new conclusions."},{"id":"AT10007_Q49","n":49,"stem":"The primary reason auditors cross-index their working papers is to","opts":[{"label":"A","text":"Give the working papers a professional appearance."},{"label":"B","text":"Explain the use of tick marks."},{"label":"C","text":"Provide an explanation of the audit steps performed."},{"label":"D","text":"Provide a trail for the auditor and the reviewer."}],"ans":"D","explanation":"Cross-indexing creates an orderly audit trail linking lead schedules, test workpapers, and financial statements."},{"id":"AT10007_Q50","n":50,"stem":"S1: Working papers are the property of the auditor.\nS2: Although portions of or extracts from the working papers may be made available to the entity at the discretion of the auditor, they may be substitute for the entity’s accounting records.","opts":[{"label":"A","text":"Only statement one is correct"},{"label":"B","text":"Only statement two is correct"},{"label":"C","text":"Both statements are correct"},{"label":"D","text":"Both statements are incorrect"}],"ans":"A","explanation":"S1 is true. S2 is false because working papers CANNOT be a substitute for the entity's accounting records."}]},{"id":"AT-10008","code":"AT-10008","title":"Fraud, Consideration of Laws and Regulations, TCWG Communications","standards":"PSA 240, PSA 250, PSA 260","questionCount":20,"summary":"Fraud definition, Fraud Triangle (Incentive/Pressure, Opportunity, Rationalization), 2 Types of Fraud (Fraudulent Financial Reporting, Misappropriation of Assets), Responsibilities of Management, TCWG and Auditor, Audit Responses to Fraud Risk, PSA 250 Noncompliance with Laws and Regulations (Direct Effect vs Indirect Effect), and PSA 260 Communication with Those Charged with Governance.","lectureOutline":"### PSA 240: THE AUDITOR’S RESPONSIBILITIES RELATING TO FRAUD\n- **Fraud:** An intentional act involving deception to obtain unjust or illegal advantage.\n- **Fraud Triangle:**\n  1. Incentive or pressure\n  2. Perceived opportunity\n  3. Rationalization\n- **Two Types of Fraud Relevant to the Auditor:**\n  1. *Fraudulent Financial Reporting:* Intentional misstatements/omissions to deceive users (often involves management override of controls, manipulation of records, misapplication of accounting principles).\n  2. *Misappropriation of Assets:* Theft of entity assets (often perpetrated by employees, concea
